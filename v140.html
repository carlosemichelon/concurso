<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Banco Mestre V140 — Produção guiada com leitura aprimorada</title>
<style>
body{margin:0;background:#f5f7f7;color:#17353b;font:16px/1.5 system-ui,Arial}
#loading{max-width:720px;margin:15vh auto;padding:24px}
#loading a{color:#16616a;font-weight:700}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite">
<h1>Banco Mestre V140</h1>
<p>Carregando bibliotecas compactas no computador e no celular...</p>
<p><a href="./v131.html">Abrir a versão anterior V130</a></p>
</div>
<script>
(async function(){
 'use strict';
 const info=document.getElementById('loading');
 try{
  const response=await fetch('./v062.html?base=V062',{cache:'no-store'});
  if(!response.ok)throw Error('Base V062 indisponível ('+response.status+')');
  let source=await response.text();
  if(!source.includes('pdf_catalog_v062.json')||
     !source.includes('assets/pdf_v061.js')||
     !source.includes('documents.length!==65')||
     !source.includes('</head>')||!source.includes('</body>'))
   throw Error('A base foi alterada. O carregamento seguro foi interrompido.');
  const tag=name=>'<scr'+'ipt src="assets/'+name+'"></scr'+'ipt>';
  const styles=[
   '<link rel="stylesheet" href="assets/v062_biblioteca_grifos.css?v=062">',
   '<link rel="stylesheet" href="assets/v064_painel_grifos.css?v=064">',
   '<link rel="stylesheet" href="assets/v065_cartao_rapido_header.css?v=065">',
   '<link rel="stylesheet" href="assets/v066_backup_drive_grifos.css?v=066">',
   '<link rel="stylesheet" href="assets/v067_diagnostico_local.css?v=067">',
   '<link rel="stylesheet" href="assets/v068_grifador.css?v=068">',
   '<link rel="stylesheet" href="assets/v070_cores_metodologia.css?v=070">',
   '<link rel="stylesheet" href="assets/v094_precise_selector.css?v=094">',
   '<link rel="stylesheet" href="assets/v096_icons.css?v=096">',
   '<link rel="stylesheet" href="assets/v097_grifos_painel.css?v=097">',
   '<link rel="stylesheet" href="assets/v098_tec_visual.css?v=098">',
   '<link rel="stylesheet" href="assets/v098_pdf_image_icons_fix.css?v=098">',
   '<link rel="stylesheet" href="assets/v099_legenda_grifos.css?v=099">',
   '<link rel="stylesheet" href="assets/v100_pdf_tools.css?v=100">',
   '<link rel="stylesheet" href="assets/v102_pdf_ui.css?v=102">',
   '<link rel="stylesheet" href="assets/v103_mobile.css?v=103">',
   '<link rel="stylesheet" href="assets/v103_sync.css?v=103">',
   '<link rel="stylesheet" href="assets/v104_mobile.css?v=104">',
   '<link rel="stylesheet" href="assets/v105_pdf_horizontal.css?v=105">',
   '<link rel="stylesheet" href="assets/v106_compact_readability.css?v=106">',
   '<link rel="stylesheet" href="assets/v107_mobile_study_icons.css?v=107">',
   '<link rel="stylesheet" href="assets/v108_grifos_editor.css?v=108">',
   '<link rel="stylesheet" href="assets/v109_mobile_library.css?v=109">',
   '<link rel="stylesheet" href="assets/v110_calibrador.css?v=110">',
   '<link rel="stylesheet" href="assets/v113_compact_bibliotecas.css?v=113">',
   '<link rel="stylesheet" href="assets/v115_compact_sections.css?v=115">',
  '<link rel="stylesheet" href="assets/v114_pdf_controls_position.css?v=114">',
   '<link rel="stylesheet" href="assets/v118_ui_compact.css?v=118">',
   '<link rel="stylesheet" href="assets/v119_public_cards_ui.css?v=119">',
   '<link rel="stylesheet" href="assets/v120_grifos_paragrafos.css?v=120">',
   '<link rel="stylesheet" href="assets/v122_visual_compact.css?v=122">',
   '<link rel="stylesheet" href="assets/v124_assuntos_cartoes.css?v=124">',
   '<link rel="stylesheet" href="assets/v130_redacao.css?v=130">'
  ].join('');
  const scripts=[
   'v063_grifos_navegacao.js?v=063',
   'v122_grifos_sync_core.js?v=122',
   'v120_highlight_groups.js?v=120',
   'v122_biblioteca_grifos.js?v=122',
   'v064_imagens_visibilidade.js?v=064',
   'v120_painel_grifos.js?v=120',
   'v066_backup_drive_grifos.js?v=066',
   'v067_diagnostico_local.js?v=067'
  ].map(tag).join('');
  // V068 — apenas no HTML montado: motor PDF e grifador atuais substituem V061,
  // mantendo a V062 e a V067 preservadas em seus próprios arquivos.
  if(!source.includes('assets/pdf_v061.js?v=061')||
     !source.includes('assets/v061_selecao_texto.js?v=061'))
   throw Error('O motor de PDF foi alterado; aplicação da V068 interrompida para proteger os grifos.');
  source=source.replace('assets/pdf_v061.js?v=061','assets/pdf_v122.js?v=122')
   .replace('assets/v061_selecao_texto.js?v=061','assets/v111_grifador.js?v=111');
  // V122: as listas de assuntos começam recolhidas e utilizam o verso canônico.
  if(!source.includes('assets/v054_assuntos_navegacao.js?v=054'))
   throw Error('Navegação original dos assuntos não encontrada');
  source=source.replace('assets/v054_assuntos_navegacao.js?v=054',
   'assets/v126_assuntos_rapidos.js?v=126');
  // Ao abrir #tema? diretamente, impedir que o bootstrap gere primeiro
  // todas as listas de disciplinas, cartões e assuntos visuais.
  const bm126Boot='<scr'+'ipt src="assets/v034_boot.js"></scr'+'ipt>';
  if(!source.includes(bm126Boot))throw Error('Bootstrap visual não encontrado');
  source=source.replace(bm126Boot,tag('v126_boot_topic.js?v=126'));
  // A classificação precisa estar disponível ANTES da inicialização do menu.
  const grifadorTag=tag('v111_grifador.js?v=111');
  if(!source.includes(grifadorTag))throw Error('Ordem de scripts do grifador alterada');
  source=source.replace(grifadorTag,tag('v109_classificador_lei_seca.js?v=109')+tag('v112_perfis_lei_seca.js?v=112')+tag('v114_ia_lei_seca.js?v=114')+tag('v114_cf_artigo1.js?v=114')+tag('v121_relacoes_normativas.js?v=121')+tag('v124_remissoes.js?v=124')+grifadorTag);
  // As versões posteriores do editor não são carregadas. Preservar somente dados
  // e funcionalidades externas ao editor: cartões privados, PDFs e Atlas.
  if(!source.includes('d.documents.length!==65')||!source.includes('assets/v055_pdfs_recolhidos.js?v=055'))
   throw Error('Catálogo PDF da base alterado; interrompendo para preservar acervo.');
  source=source.replace('assets/pdf_catalog_v062.json','assets/pdf_catalog_v140.json')
   .replace("d.format!=='BancoMestrePDFCatalogV062'","d.format!=='BancoMestrePDFCatalogV140'")
   .replace('d.documents.length!==65','d.documents.length!==79')
   .replace('id="pdfStat">65','id="pdfStat">79')
   .replace('assets/v055_pdfs_recolhidos.js?v=055','assets/v140_pdfs_recolhidos.js?v=140');
  const atlasInit='<scr'+'ipt src="assets/visibilidade-v026.js"></scr'+'ipt>';
  if(!source.includes(atlasInit))throw Error('Inicialização do Atlas alterada');
  source=source.replace(atlasInit,atlasInit+tag('v087_atlas_visibilidade_global.js?v=087'));
  if(!source.includes("fetch('assets/'+f)"))throw Error('Leitor de cartões alterado');
  source=source.replace("fetch('assets/'+f)","fetch('assets/'+f+'?bm=018',{cache:'no-store'})");
  // Retidos para rastreabilidade: os 17 IDs inativos não compõem a lista de estudo.
  if(!source.includes('const a=cards.filter(c=>')||!source.includes('for(const c of cards){const g=c.provisional?'))
   throw Error('Filtro de cartões alterado; segurança interrompe a atualização');
  source=source.replace('const a=cards.filter(c=>','const a=cards.filter(c=>(c.provisional||c.active!==false)&&')
   .replace('for(const c of cards){const g=c.provisional?','for(const c of cards.filter(c=>c.provisional||c.active!==false)){const g=c.provisional?');
  // V119 carrega a base pública V024 sem autenticação Google.
  if(!source.includes("fetch('assets/meta_v021.json')"))
   throw Error('Leitor de metadados alterado; operação interrompida');
  source=source.replace("fetch('assets/meta_v021.json')",
   "fetch('assets/meta_public_v024.json?v=119',{cache:'no-store'})");
  // 17 IDs inativos continuam no arquivo e são visíveis apenas sob demanda.
  if(!source.includes('const a=cards.filter(c=>'))
   throw Error('Filtro de cartões alterado');
  source=source.replace('const a=cards.filter(c=>',
   'const a=cards.filter(c=>(c.provisional||c.active!==false||document.getElementById("bm119ShowInactive")?.checked)&&');

  // V123: o carregador antigo marcava loadedCards=true antes de concluir
  // as requisições, fazendo Assuntos/Flashcards competirem pela lista vazia.
  const bm123OldStart='async function loadCards(){if(loadedCards)return;loadedCards=true;try{';
  const bm123OldEnd="}catch(e){$('cardRows').textContent=e.message}}";
  if(!source.includes(bm123OldStart)||!source.includes(bm123OldEnd))
   throw Error('Função de cartões mudou; atualização bloqueada para evitar perda de dados');
  source=source.replace(bm123OldStart,
    "let bm123CardsPromise=null;\nfunction loadCards(){\n"+
    " if(bm123CardsPromise)return bm123CardsPromise;\n"+
    " const out=document.getElementById('cardRows');\n"+
    " if(out&&!cards.length)out.textContent='Carregando cartões V024…';\n"+
    " bm123CardsPromise=(async()=>{try{");
  source=source.replace(bm123OldEnd,
    "}catch(e){loadedCards=false;bm123CardsPromise=null;"+
    "const out=document.getElementById('cardRows');"+
    "if(out)out.textContent='Falha ao carregar cartões: '+e.message;"+
    "throw e}})();\nreturn bm123CardsPromise;\n}");
  const bm123CardsAssigned='cards=[...ijui,...base];';
  if(!source.includes(bm123CardsAssigned))
   throw Error('Atribuição da base de cartões não encontrada');
  source=source.replace(bm123CardsAssigned,bm123CardsAssigned+'loadedCards=true;');
  // Quando filtros não encontram cartões, mostrar causa em vez de lista vazia.
  const bm123EndRender="const out=$('cardRows');out.replaceChildren();";
  if(!source.includes(bm123EndRender))
   throw Error('Renderizador dos cartões alterado');
  source=source.replace(bm123EndRender,
   bm123EndRender+"if(!a.length)out.textContent='Nenhum cartão corresponde à busca ou aos filtros. Limpe os filtros para ver toda a base.';");
  // A abertura pelo menu aguarda e trata falhas sem rejeição silenciosa.
  source=source.replace("if(name==='cartoes')loadCards();",
   "if(name==='cartoes')void loadCards().catch(e=>console.warn('Carregamento dos cartões V024:',e));");
  // Navegação V127: assunto geral só filtra a interface; campos canônicos intactos.
  const bm128GeneralAnchor="(f==='all'||c.discipline===f)&&($('cardTopicFilter').value==='all'||";
  if(!source.includes(bm128GeneralAnchor))throw Error('Filtro original de cartões mudou; módulo de assuntos gerais não foi aplicado');
  source=source.replace(bm128GeneralAnchor,"(f==='all'||c.discipline===f)&&(window.BM128General?.matches?.(c)!==false)&&($('cardTopicFilter').value==='all'||");
  // V129: trocar a fonte antiga GitHub do Vade por Drive, preservando o ID dos grifos.
  // O V041 criava o painel antes de V044 e impedia a execução do leitor Drive.
  const bm129VadeGitHub='<scr'+'ipt src="assets/v041_vade.js"></scr'+'ipt>';
  const bm129VadeDuplicate='<scr'+'ipt src="assets/v044_vade_drive.js?v=048"></scr'+'ipt>';
  const bm129DriveReader='<scr'+'ipt src="assets/v048_drive.js?v=048"></scr'+'ipt>';
  if(!source.includes(bm129VadeGitHub)||!source.includes(bm129VadeDuplicate)||!source.includes(bm129DriveReader))
   throw Error('Módulos do Vade/Drive incompatíveis; versão V128 preservada');
  source=source.replace(bm129VadeGitHub,tag('v127_vade_drive.js?v=129'))
               .replace(bm129VadeDuplicate,'<!-- Leitor antigo duplicado do Vade removido em V129 -->');
  source=source.replace('</head>',styles+'</head>');
  source=source.replace('</body>',scripts+tag('v130_drive_pdf_sync.js?v=130')+tag('v084_drive_images_sync.js?v=084')+tag('v086_exclusoes_atlas_privadas.js?v=086')+tag('v097_pdf_selection_core.js?v=097')+tag('v104_precise_touch.js?v=104')+tag('v096_icons.js?v=096')+tag('v098_portal_text.js?v=098')+tag('v106_assuntos_compactos.js?v=106')+tag('v099_legenda_grifos.js?v=099')+tag('v100_pdf_tools.js?v=100')+tag('v106_ink_ui.js?v=106')+tag('v103_mobile_pdf.js?v=103')+tag('v104_mobile_gestures.js?v=104')+tag('v105_pdf_horizontal.js?v=105')+tag('v122_grifos_master_core.js?v=122')+tag('v122_grifos_drive.js?v=122')+tag('v109_mobile_library.js?v=109')+tag('v121_calibrador_ui.js?v=121')+tag('v113_compact_bibliotecas.js?v=113')+tag('v118_ui_compact.js?v=118')+tag('v119_public_cards_ui.js?v=119')+tag('v122_flashcard_ink.js?v=122')+tag('v122_visual_compact.js?v=122')+tag('v123_cards_recovery.js?v=123')+tag('v128_assuntos_gerais.js?v=128')+tag('v130_redacao.js?v=130')+tag('v139_redacao_redirect.js?v=139')+'</body>');
  source=source.replace('Banco Mestre V062 — Estudos','Banco Mestre V140 — Estudos')
   .replaceAll('V062 · base V015','V140 · base V024 pública')
   .replace('<footer>V062 ·','<footer>V140 ·');
  document.open();document.write(source);document.close();
 }catch(error){
  console.error('V070: inicialização interrompida',error);
  info.querySelector('p').textContent='Não foi possível abrir esta versão: '+error.message;
 }
})();
</script>
</body>
</html>
