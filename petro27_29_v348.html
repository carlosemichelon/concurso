<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petrobras 27/29 — V348</title><link rel="stylesheet" href="assets/v348_visual.css"><style>body{max-width:960px;margin:2rem auto;padding:0 16px;font:16px/1.5 system-ui;color:#22384D}article{border:1px solid #d5e0e9;margin:12px 0;padding:16px;border-radius:8px}summary{cursor:pointer;color:#245FAD}p{white-space:pre-wrap}</style></head><body><a href="index.html">← Banco Mestre</a><h1>Petrobras 27 e 29 — cartões integrados</h1><p>Responda antes de abrir o verso. Sem alteração da agenda nesta página.</p><main id="cards">Carregando…</main><script src="assets/v348_visual_renderer.js"></script><script>BM348.load().then(({p,v})=>{const root=document.getElementById('cards');root.replaceChildren();for(const c of p.new_cards){const a=document.createElement('article');a.dataset.cardId=c.id;const h=document.createElement('h2');h.textContent=c.id+' — '+c.sub;const q=document.createElement('p');q.textContent=c.front;const det=document.createElement('details');const s=document.createElement('summary');s.textContent='Revelar resposta';det.append(s);det.addEventListener('toggle',()=>{if(det.open&&!det.querySelector('.bm348-card'))det.append(BM348.make(p.profiles[c.id],v))});a.append(h,q,det);root.append(a)}}).catch(e=>document.getElementById('cards').textContent=e.message)</script></body></html>
