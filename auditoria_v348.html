<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portão de encerramento — Banco Mestre V348</title><link rel="stylesheet" href="assets/v348_visual.css"><style>body{max-width:960px;margin:2rem auto;padding:0 16px;font:16px/1.5 system-ui;color:#22384D}button{padding:10px;cursor:pointer}li{margin:6px 0}</style></head><body><a href="index.html">← Banco Mestre</a><h1>Portão de encerramento V348</h1><p>Auditoria técnica, fora da revisão. Os resultados de imagem abaixo são desta sessão, não equivalem à homologação de todos os cartões nem do Drive privado.</p><div id="check">Carregando manifesto…</div><button id="show">Verificar os dez SVGs (revela conteúdo)</button><div id="media"></div><script src="assets/v348_visual_renderer.js"></script><script>fetch('assets/closure_gate_current.json').then(r=>r.json()).then(d=>{document.getElementById('check').textContent='Versão '+d.version+' — '+d.public_counts.cards+' cartões; '+d.public_counts.active+' ativos. Testes obrigatórios em cada incremento; pendências privadas fora do repositório.'});document.getElementById('show').onclick=async()=>{const {v}=await BM348.load();const root=document.getElementById('media');root.replaceChildren();for(const m of v.media){const h=document.createElement('h3');h.textContent=m.id+' — '+m.card_ids.join(', ');root.append(h,BM348.draw(m))}};</script></body></html>
