<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370"><rect width="800" height="370" fill="white"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#dc2626"/></marker></defs><g font-family="Arial,sans-serif" fill="#1e293b"><text x="400" y="30" font-size="23" font-weight="bold" text-anchor="middle">Parede multicamada — resistência e fluxo térmico</text><rect x="40" y="75" width="165" height="180" fill="#fde7d0"/><rect x="205" y="75" width="25" height="180" fill="#94a3b8"/><rect x="230" y="75" width="160" height="180" fill="#cf9b76"/><rect x="390" y="75" width="75" height="180" fill="#f3d66c"/><rect x="465" y="75" width="25" height="180" fill="#94a3b8"/><rect x="490" y="75" width="270" height="180" fill="#dbeafe"/><g font-size="18" text-anchor="middle"><text x="122" y="65">Exterior quente</text><text x="625" y="65">Interior frio</text><text x="310" y="280">Alvenaria</text><text x="427" y="280">Isolante</text></g><g stroke="#dc2626" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#a)"><path d="M100 115H700 M100 165H700 M100 215H700"/></g><text x="400" y="316" font-size="20" text-anchor="middle">Rtotal = Rsi + Σ(e/λ) + Rse; U = 1/Rtotal</text><text x="400" y="344" font-size="15" text-anchor="middle">Modelo estacionário unidimensional. O conforto depende também do clima, sol, ventilação e uso.</text></g></svg>