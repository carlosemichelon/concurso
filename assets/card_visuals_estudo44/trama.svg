="18"/><rect x="382" y="343" width="36" height="18"/><rect x="652" y="238" width="36" height="18"/></g><text x="420" y="397" font-size="18" text-anchor="middle" font-weight="bold">Caminho das cargas gravitacionais</text><g font-size="17" text-anchor="middle"><text x="420" y="428">Telhas → ripas → caibros → terças → tesouras → apoios</text><text x="420" y="462">Terças e ripas: longitudinais; caibros: sentido da água.</text><text x="420" y="497" font-size="15">Arranjo ilustrativo, sem escala; ligações, contraventamentos e apoios conforme projeto.</text></g></g></svg>