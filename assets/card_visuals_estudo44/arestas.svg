<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" fill="white"/><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2563eb"/></marker></defs><g font-family="Arial,sans-serif" fill="#1e293b"><text x="400" y="33" font-size="23" font-weight="bold" text-anchor="middle">Espigão × rincão — leitura do escoamento</text><text x="200" y="72" text-anchor="middle" font-size="19" font-weight="bold" fill="#b45309">ESPIGÃO: divisor</text><text x="600" y="72" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d9488">RINCÃO: coletor</text><path d="M50 100H350V330H50Z" fill="#f5d5b9" stroke="#95603b"/><path d="M50 100L350 330" stroke="#b45309" stroke-width="5"/><path d="M450 100H750V330H450Z" fill="#e0f2fe" stroke="#64748b"/><path d="M450 100L750 330" stroke="#0d9488" stroke-width="5"/><g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ar)"><path d="M156 156V109 M175 186H250 M230 255V313 M213 240H100"/><path d="M565 119V185 M720 190H570 M530 275H670 M680 310V278"/><path d="M615 229L733 320"/></g><text x="200" y="357" text-anchor="middle" font-size="16">A água se afasta da aresta saliente.</text><text x="600" y="357" text-anchor="middle" font-size="16">A água converge para a aresta reentrante.</text><text x="400" y="396" text-anchor="middle" font-size="14" fill="#475569">Detalhes locais em planta, sem escala: setas indicam sentido da água; não representam a planta inteira.</text></g></svg>