<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>Berma em aterro — seção idealizada</title><rect width="800" height="490" fill="white"/><g font-family="Arial,sans-serif" fill="#243447" text-anchor="middle"><text x="400" y="32" font-size="24" font-weight="bold">Berma em aterro — seção idealizada</text><path d="M120 385L200 225H230L300 85H500L570 225H600L680 385Z" fill="#e7d0ad" stroke="#856447" stroke-width="2"/><rect x="300" y="73" width="200" height="12" fill="#475569"/><path d="M200 225H230M570 225H600" stroke="#15803d" stroke-width="6"/><path d="M290 100L235 210M510 100L565 210" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M227 202L235 210 245 205M555 205L565 210 573 202" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M105 385H695" stroke="#64748b" stroke-width="3"/><g fill="#94a3b8" stroke="#475569"><circle cx="109" cy="380" r="10"/><circle cx="122" cy="380" r="10"/><circle cx="135" cy="380" r="10"/><circle cx="665" cy="380" r="10"/><circle cx="678" cy="380" r="10"/><circle cx="691" cy="380" r="10"/></g><path d="M300 60H500M300 52V68M500 52V68" stroke="#243447" stroke-width="1.5"/><text x="400" y="52" font-size="17">10 m</text><path d="M120 414H680M120 406V422M680 406V422" stroke="#243447" stroke-width="1.5"/><text x="400" y="438" font-size="18">28 m entre pés geométricos (hipótese)</text><path d="M716 85V385M708 85H724M708 385H724" stroke="#243447" stroke-width="1.5"/><text x="742" y="240" font-size="18">15 m</text><path d="M542 85V225M534 85H550M534 225H550" stroke="#243447" stroke-width="1.5"/><text x="556" y="156" font-size="16">7 m</text><text x="171" y="190" font-size="17" fill="#15803d">Berma</text><path d="M180 194L215 221" stroke="#15803d" fill="none"/><text x="400" y="265" font-size="20">Taludes 2V:1H</text><text x="400" y="298" font-size="18">w = (28 − 10 − 15)/2 = 1,5 m</text><text x="400" y="321" font-size="15">Somente se simétrico e cotas entre pés geométricos.</text><text x="400" y="469" font-size="16">Patamar não substitui drenagem e análise de estabilidade.</text><g font-size="16" font-weight="bold"><text x="400" y="113">Platô / plataforma</text><circle cx="300" cy="85" r="5" fill="#b91c1c"/><text x="262" y="75" fill="#b91c1c">Crista</text><text x="640" y="285" fill="#92400e">Saia</text><path d="M625 290L644 313" stroke="#92400e" fill="none"/><circle cx="680" cy="385" r="5" fill="#2563eb"/><text x="710" y="404" fill="#2563eb">Pé</text></g></g></svg>