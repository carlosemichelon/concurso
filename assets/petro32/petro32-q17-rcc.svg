<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320"><rect width="640" height="320" fill="white"/><g font-family="Arial" font-size="15" fill="#111"><text x="320" y="25" text-anchor="middle" font-weight="bold" font-size="20">NBR 15115:2004 — controle de compactação</text><rect x="20" y="45" width="185" height="155" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="112" y="68" text-anchor="middle" font-weight="bold">ANTES</text><path d="M112 78Q84 112 112 124Q140 112 112 78Z" fill="#60a5fa"/><text x="112" y="145" text-anchor="middle">Umidade na pista</text><text x="112" y="165" text-anchor="middle">a cada 700 m²</text><text x="112" y="187" text-anchor="middle">wót ± 1,5 p.p.</text><path d="M207 123H222l-7 -6m7 6l-7 6" stroke="#475569" stroke-width="2" fill="none"/><rect x="225" y="45" width="185" height="155" rx="7" fill="#fef3c7" stroke="#ca8a04"/><text x="317" y="68" text-anchor="middle" font-weight="bold">COMPACTAR</text><rect x="275" y="91" width="64" height="32" fill="#eab308"/><circle cx="283" cy="129" r="13" fill="#64748b"/><circle cx="340" cy="125" r="17" fill="#475569"/><path d="M250 145H388" stroke="#926b43" stroke-width="7"/><text x="317" y="170" text-anchor="middle">Sub-base/base</text><text x="317" y="189" text-anchor="middle">energia ≥ intermediária</text><path d="M412 123H427l-7 -6m7 6l-7 6" stroke="#475569" stroke-width="2" fill="none"/><rect x="430" y="45" width="190" height="155" rx="7" fill="#dcfce7" stroke="#16a34a"/><text x="525" y="68" text-anchor="middle" font-weight="bold">DEPOIS</text><path d="M455 90H595M455 104H595M455 118H595" stroke="#92400e" stroke-width="6"/><text x="525" y="145" text-anchor="middle">Massa específica seca</text><text x="525" y="164" text-anchor="middle">in situ — NBR 7185</text><text x="525" y="186" text-anchor="middle">50 m ou 400 m²</text><rect x="20" y="217" width="600" height="55" rx="6" fill="#f8fafc" stroke="#94a3b8"/><text x="320" y="240" text-anchor="middle" font-weight="bold">GC = 100 × ρd,campo / ρd,máx,lab</text><text x="320" y="260" text-anchor="middle">Mínimo especificado: 100%; recebimento conforme 7.3.2</text><text x="320" y="296" text-anchor="middle" font-size="13">Alternar borda direita, eixo e borda esquerda; mínimo de três determinações de densidade.</text></g></svg>