<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><rect width="640" height="300" fill="white"/><g font-family="Arial" font-size="16" fill="#111"><text x="320" y="25" font-size="19" text-anchor="middle" font-weight="bold">Deflexão por rumos — curva circular simples</text><path d="M135 230V48" stroke="#64748b" stroke-dasharray="5 4" stroke-width="2"/><text x="135" y="43" text-anchor="middle">N</text><path d="M135 230L242.061 111.097" stroke="#2563eb" stroke-width="4"/><path d="M135 230L294.781 221.626" stroke="#16a34a" stroke-width="4"/><path d="M135 175A55 55 0 0 1 171.802 189.127" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M135 143A87 87 0 0 1 221.881 225.447" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M218.641 137.107A125 125 0 0 1 259.829 223.458" stroke="#dc2626" stroke-width="3" fill="none"/><circle cx="135" cy="230" r="4"/><text x="153" y="171" fill="#1d4ed8">42°</text><text x="199" y="180" fill="#166534">87°</text><text x="255" y="160" fill="#b91c1c" font-weight="bold">45°</text><text x="248" y="104" fill="#1d4ed8">Entrada</text><text x="297" y="216" fill="#166534">Saída</text><rect x="350" y="66" width="272" height="169" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="486" y="94" text-anchor="middle" font-weight="bold">Mesmo quadrante NE</text><text x="486" y="126" text-anchor="middle">Δ = 87° − 42° = 45°</text><text x="486" y="156" text-anchor="middle" font-weight="bold" fill="#b91c1c">45° × π/180° = π/4 rad</text><text x="486" y="188" text-anchor="middle">Interno no PI = 135°</text><text x="486" y="216" text-anchor="middle">D = RΔ (Δ em rad)</text><text x="320" y="278" text-anchor="middle" font-size="14">Vetores de percurso transladados para uma mesma origem; não é o croqui original.</text></g></svg>