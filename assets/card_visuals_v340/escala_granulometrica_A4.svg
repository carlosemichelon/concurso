<text x="58" y="1009" class="sub">MEMORIZE AS FRONTEIRAS: 2  |  6  |  20  |  60  |  200  |  1.000 mm</text>
<text x="58" y="1047" class="body">2–6 fino → 6–20 médio → 20–60 grosso → 60–200 pedra-de-mão → 200–1.000 matacão.</text>
<rect x="58" y="1071" width="1124" height="77" class="box"/>
<text x="76" y="1102" class="sub">PEGADINHA QUE CAUSOU ERRO:</text>
<text x="76" y="1131" class="body">20–60 mm é PEDREGULHO GROSSO, não PEDRA-DE-MÃO (60–200 mm).</text>
