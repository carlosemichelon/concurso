<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="NBR 5413:1992 — método histórico, cancelado"><rect width="960" height="380" fill="#fff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#d97706"/></marker></defs><g font-family="Arial,sans-serif" fill="#203745"><text x="480" y="34" text-anchor="middle" font-size="25" font-weight="bold">NBR 5413:1992 — método histórico, cancelado</text><g font-size="23" text-anchor="middle"><rect x="70" y="105" width="240" height="155" fill="#dbeafe" rx="8" stroke="#64748b"/><text x="190" y="159">−3 / −2</text><text x="190" y="217" font-size="32" font-weight="bold">500 lx</text><rect x="320" y="105" width="320" height="155" fill="#dcfce7" rx="8" stroke="#64748b"/><text x="480" y="159">−1 / 0 / +1</text><text x="480" y="217" font-size="32" font-weight="bold">750 lx</text><rect x="650" y="105" width="240" height="155" fill="#ffedd5" rx="8" stroke="#64748b"/><text x="770" y="159">+2 / +3</text><text x="770" y="217" font-size="32" font-weight="bold">1.000 lx</text><text x="480" y="70">Idade + velocidade/precisão + refletância</text><text x="480" y="315" font-weight="bold">Começa no meio; dois pontos fazem mudar.</text><text x="480" y="350" font-size="19">Não aplicar a soma dos pesos como regra vigente.</text></g></g></svg>