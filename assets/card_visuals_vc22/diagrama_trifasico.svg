<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" role="img" aria-label="Solo: relações entre volumes e massas"><title>Solo: relações entre volumes e massas</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#2563eb"/></marker></defs><rect width="800" height="385" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554"><text x="400" y="32" font-size="23" font-weight="700" text-anchor="middle">Solo: relações entre volumes e massas</text><text x="175" y="70" font-size="20" fill="#172554" text-anchor="middle">Volumes</text><text x="450" y="70" font-size="20" fill="#172554" text-anchor="middle">Massas (sem escala)</text><rect x="100" y="85" width="150" height="55" fill="#e2e8f0" stroke="#64748b"/><rect x="100" y="140" width="150" height="80" fill="#bfdbfe" stroke="#64748b"/><rect x="100" y="220" width="150" height="100" fill="#ead8bd" stroke="#64748b"/><text x="175" y="118" font-size="16" fill="#172554" text-anchor="middle">Ar: Va</text><text x="175" y="185" font-size="16" fill="#172554" text-anchor="middle">Água: Vw</text><text x="175" y="270" font-size="16" fill="#172554" text-anchor="middle">Sólidos: Vs</text><rect x="375" y="85" width="150" height="55" fill="#fff" stroke="#64748b"/><rect x="375" y="140" width="150" height="80" fill="#bfdbfe" stroke="#64748b"/><rect x="375" y="220" width="150" height="100" fill="#ead8bd" stroke="#64748b"/><text x="450" y="118" font-size="16" fill="#172554" text-anchor="middle">≈ 0</text><text x="450" y="185" font-size="16" fill="#172554" text-anchor="middle">Mw</text><text x="450" y="270" font-size="16" fill="#172554" text-anchor="middle">Ms</text><line x1="80" y1="85" x2="80" y2="220" stroke="#334155" stroke-width="2" /><line x1="72" y1="85" x2="88" y2="85" stroke="#334155" stroke-width="2" /><line x1="72" y1="220" x2="88" y2="220" stroke="#334155" stroke-width="2" /><text x="50" y="155" font-size="17" fill="#172554" text-anchor="middle">Vv</text><line x1="270" y1="85" x2="270" y2="320" stroke="#334155" stroke-width="2" /><line x1="262" y1="85" x2="278" y2="85" stroke="#334155" stroke-width="2" /><line x1="262" y1="320" x2="278" y2="320" stroke="#334155" stroke-width="2" /><text x="290" y="205" font-size="17" fill="#172554" text-anchor="middle">V</text><text x="650" y="130" font-size="18" fill="#172554" text-anchor="middle">e = Vv/Vs</text><text x="650" y="171" font-size="18" fill="#172554" text-anchor="middle">n = Vv/V</text><text x="650" y="212" font-size="18" fill="#172554" text-anchor="middle">Sr = Vw/Vv</text><text x="650" y="253" font-size="18" fill="#172554" text-anchor="middle">w = Mw/Ms</text><text x="400" y="360" font-size="20" fill="#1d4ed8" text-anchor="middle">Sr·e = w·Gs     •     n = e/(1+e)</text></g></svg>