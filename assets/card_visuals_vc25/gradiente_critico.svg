<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470"><title>Fluxo vertical e gradiente crítico</title><rect width="900" height="470" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554"><text x="28" y="38" font-size="27" font-weight="bold">Percolação vertical e tensão efetiva</text><text x="28" y="67" font-size="16">Exemplo: γ′ = 10 kN/m³; γw = 10 kN/m³; z = 2 m; i = 0,6</text><g><text x="165" y="110" font-size="20" font-weight="bold" text-anchor="middle">Hidrostática</text><rect x="85" y="150" width="160" height="170" fill="#ead6b7" stroke="#a16207"/><rect x="85" y="133" width="160" height="17" fill="#93c5fd"/><path d="M85 150H245" stroke="#2563eb" stroke-width="3"/><path d="M130 177V275l-7 -12m7 12l7 -12" fill="none" stroke="#92400e" stroke-width="4"/><text x="110" y="298" font-size="15" fill="#92400e">γ′</text><path d="M68 150V320" stroke="#64748b" stroke-dasharray="4 3"/><text x="65" y="240" font-size="14" text-anchor="end">z</text><text x="165" y="350" text-anchor="middle" font-size="17">γ′z</text><text x="165" y="382" font-size="24" text-anchor="middle" fill="#64748b" font-weight="bold">20 kPa</text></g><g><text x="445" y="110" font-size="20" font-weight="bold" text-anchor="middle">Fluxo ascendente</text><rect x="365" y="150" width="160" height="170" fill="#ead6b7" stroke="#a16207"/><rect x="365" y="133" width="160" height="17" fill="#93c5fd"/><path d="M365 150H525" stroke="#2563eb" stroke-width="3"/><path d="M410 177V275l-7 -12m7 12l7 -12" fill="none" stroke="#92400e" stroke-width="4"/><text x="390" y="298" font-size="15" fill="#92400e">γ′</text><path d="M477 270V175l-7 12m7 -12l7 12" fill="none" stroke="#2563eb" stroke-width="5"/><text x="450" y="298" font-size="15" fill="#2563eb">iγw ↑</text><path d="M348 150V320" stroke="#64748b" stroke-dasharray="4 3"/><text x="345" y="240" font-size="14" text-anchor="end">z</text><text x="445" y="350" text-anchor="middle" font-size="17">(γ′ − iγw)z</text><text x="445" y="382" font-size="24" text-anchor="middle" fill="#2563eb" font-weight="bold">8 kPa</text></g><g><text x="725" y="110" font-size="20" font-weight="bold" text-anchor="middle">Fluxo descendente</text><rect x="645" y="150" width="160" height="170" fill="#ead6b7" stroke="#a16207"/><rect x="645" y="133" width="160" height="17" fill="#93c5fd"/><path d="M645 150H805" stroke="#2563eb" stroke-width="3"/><path d="M690 177V275l-7 -12m7 12l7 -12" fill="none" stroke="#92400e" stroke-width="4"/><text x="670" y="298" font-size="15" fill="#92400e">γ′</text><path d="M757 177V275l-7 -12m7 12l7 -12" fill="none" stroke="#0f766e" stroke-width="5"/><text x="730" y="298" font-size="15" fill="#0f766e">iγw ↓</text><path d="M628 150V320" stroke="#64748b" stroke-dasharray="4 3"/><text x="625" y="240" font-size="14" text-anchor="end">z</text><text x="725" y="350" text-anchor="middle" font-size="17">(γ′ + iγw)z</text><text x="725" y="382" font-size="24" text-anchor="middle" fill="#0f766e" font-weight="bold">32 kPa</text></g><rect x="60" y="409" width="780" height="43" rx="6" fill="#dbeafe"/><text x="450" y="437" font-size="19" text-anchor="middle">i crítico = γ′/γw = 1,0 → σ′ = 0 no modelo ascendente ideal</text><text x="450" y="465" font-size="13" text-anchor="middle">Setas indicam forças por unidade de volume; dimensões esquemáticas.</text></g></svg>