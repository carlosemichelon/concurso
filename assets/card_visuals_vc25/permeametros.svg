0" y="422" font-size="22" font-weight="bold">k = VL / (A Δh t)</text><text x="30" y="455" font-size="16">Mede V coletado em t.</text></g><g transform="translate(450 0)"><g stroke="#334155" stroke-width="2" fill="none"><path d="M75 150V322H139M96 150V302H139"/><rect x="139" y="285" width="155" height="55"/><path d="M294 312H345V245H384M384 245V265"/><path d="M357 280V343H410V280"/></g><rect x="141" y="287" width="151" height="51" fill="#ead6b7" stroke="#a16207"/><path d="M148 312H282" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="359" y="312" width="49" height="29" fill="#93c5fd"/><path d="M140 359H294m-154 -5v10m154 -10v10" stroke="#0f766e" stroke-width="2"/><text x="217" y="380" text-anchor="middle" font-size="15" fill="#0f766e">L</text><text x="217" y="280" text-anchor="middle" font-size="15">Amostra: área A</text><path d="M30 245H410" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="300" y="238" font-size="13">Saída de referência</text><path d="M77 160H94V302H77Z" fill="#93c5fd" opacity=".8"/><path d="M77 160H190M77 206H190" stroke="#2563eb" stroke-dasharray="5 3"/><path d="M160 160V245m-5 -85h10m-10 85h10M200 206V245m-5 -39h10m-10 39h10" stroke="#0f766e" fill="none"/><text x="165" y="190" font-size="14">h₁</text><text x="205" y="226" font-size="14">h₂</text><text x="103" y="154" font-size="14">Tubo: a</text><text x="383" y="365" text-anchor="middle" font-size="14">Saída</text><text x="30" y="422" font-size="22" font-weight="bold">k = (aL / At) ln(h₁/h₂)</text><text x="30" y="455" font-size="16">Mede a queda de nível em t.</text></g><text x="450" y="507" text-anchor="middle" font-size="15">k em m/s • A = área da amostra • a = área do tubo • t = tempo</text></g></svg>