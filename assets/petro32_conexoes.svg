<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350"><rect width="680" height="350" fill="white"/><g font-family="Arial" font-size="15" fill="#111" text-anchor="middle"><text x="340" y="24" font-size="18" font-weight="bold">União × flange × luva</text><g transform="translate(10 45)"><rect x="12" y="40" width="182" height="58" rx="9" fill="#bc784d" stroke="#78350f"/><path d="M68 25H138L154 42V96L138 113H68L52 96V42Z" fill="#935b39" stroke="#78350f" stroke-width="2"/><rect x="15" y="58" width="176" height="22" fill="#dbeafe"/><path d="M103 25V113" stroke="#fff" stroke-width="2" stroke-dasharray="4 4"/><text x="103" y="143" font-weight="bold">UNIÃO</text><text x="103" y="166">Porca central</text><text x="103" y="186">Desmontagem</text></g><g transform="translate(237 45)"><rect x="12" y="40" width="182" height="58" rx="5" fill="#94a3b8" stroke="#475569"/><rect x="81" y="15" width="19" height="108" fill="#64748b" stroke="#334155"/><rect x="106" y="15" width="19" height="108" fill="#64748b" stroke="#334155"/><rect x="12" y="58" width="182" height="22" fill="#dbeafe"/><path d="M69 30H137M69 108H137" stroke="#334155" stroke-width="7"/><text x="103" y="143" font-weight="bold">FLANGE</text><text x="103" y="166">Abas e parafusos</text><text x="103" y="186">Junta de vedação</text></g><g transform="translate(464 45)"><rect x="25" y="35" width="155" height="68" rx="5" fill="#bc784d" stroke="#78350f"/><rect x="25" y="58" width="155" height="22" fill="#dbeafe"/><path d="M103 35V58M103 80V103" stroke="#78350f" stroke-width="2"/><text x="103" y="143" font-weight="bold">LUVA</text><text x="103" y="166">Corpo cilíndrico</text><text x="103" y="186">Emenda reta</text></g><text x="340" y="278" font-weight="bold">Bucha de redução = muda diâmetro; junção = deriva em Y.</text><text x="340" y="306">União: soltar a porca; flange: soltar a fixação.</text><text x="340" y="331" font-size="12">Cortes esquemáticos de modelos típicos, não imagens originais da prova.</text></g></svg>