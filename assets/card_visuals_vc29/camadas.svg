<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><rect width="800" height="450" fill="white"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="20"><text x="400" y="30" font-weight="bold" fill="#173554">Pavimento flexível — IPR-719, p. 142</text><rect x="350" y="45" width="100" height="55" rx="10" fill="#334155"/><path d="M400 100v27m-8-9 8 9 8-9" stroke="#b91c1c" stroke-width="4" fill="none"/><rect x="60" y="130" width="680" height="45" fill="#475569"/><text x="400" y="158" fill="white">Revestimento asfáltico</text><rect x="60" y="175" width="680" height="60" fill="#f5cc89"/><text x="400" y="199" fill="#553500">Base — ISC ≥80%* | exp. ≤0,5%</text><text x="400" y="222" font-size="16" fill="#553500">*60% se N ≤5×10⁶, faixas E/F e demais requisitos</text><rect x="60" y="235" width="680" height="55" fill="#bae6fd"/><text x="400" y="269" fill="#173554">Sub-base — ISC ≥20% | IG=0 | exp. ≤1%</text><rect x="60" y="290" width="680" height="55" fill="#bbf7d0"/><text x="400" y="324" fill="#14532d">Reforço opcional — ISC &gt; subleito | exp. ≤1%</text><rect x="60" y="345" width="680" height="55" fill="#dec0a7"/><text x="400" y="379" fill="#5b3720">Subleito — ISC ≥2% | exp. ≤2%</text><path d="M350 128 84 400 M450 128 716 400" fill="none" stroke="#b91c1c" stroke-dasharray="7 6" stroke-width="2.5"/><text x="400" y="430" font-size="16" fill="#334155">Distribuição qualitativa da carga; sem escala; não é dimensionamento.</text></g></svg>