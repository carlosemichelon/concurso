<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390"><rect width="800" height="390" fill="white"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2563eb"/></marker></defs><g font-family="Arial,sans-serif" fill="#1e293b"><text x="400" y="30" text-anchor="middle" font-size="23" font-weight="bold">Despassivação do aço: carbonatação × cloretos</text><text x="200" y="63" text-anchor="middle" font-size="19" font-weight="bold">Carbonatação</text><text x="600" y="63" text-anchor="middle" font-size="19" font-weight="bold">Cloretos</text><g fill="#e2e8f0" stroke="#94a3b8"><rect x="45" y="100" width="310" height="205"/><rect x="445" y="100" width="310" height="205"/></g><rect x="46" y="101" width="308" height="123" fill="#f4c991"/><path d="M46 224H354" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><g fill="#64748b" stroke="#475569" stroke-width="2"><circle cx="200" cy="245" r="38"/><circle cx="600" cy="245" r="38"/></g><g stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"><path d="M100 83V155 M200 83V174 M300 83V155 M500 83V190 M600 83V200 M700 83V190"/></g><g font-size="15" fill="#2563eb" text-anchor="middle"><text x="200" y="94">CO₂</text><text x="600" y="94">Cl⁻</text></g><path d="M170 221Q200 199 230 221" stroke="#b45309" stroke-width="6" fill="none"/><path d="M570 223l10 9 -8 5 M631 256l-10 -2 5 9" stroke="#dc2626" stroke-width="6" fill="none"/><g font-size="15" text-anchor="middle"><text x="200" y="329">Redução do pH; frente de carbonatação.</text><text x="600" y="329">Despassivação localizada; risco de pites.</text><text x="400" y="361">A corrosão depende das condições eletroquímicas; os mecanismos podem coexistir.</text></g></g></svg>