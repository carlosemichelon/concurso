<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 375"><rect width="700" height="375" fill="white"/><g font-family="sans-serif" font-size="18" fill="#334155"><text x="20" y="26" font-weight="bold">Sobreposição de passadas — solo-cimento</text><text x="25" y="61">1990 / DNIT 2025: 1/2</text><rect x="25" y="75" width="150" height="64" fill="#93c5fd" stroke="#2563eb"/><rect x="100" y="75" width="150" height="64" fill="#86efac" stroke="#16a34a"/><rect x="100" y="75" width="75" height="64" fill="#fbbf24"/><text x="137" y="112" text-anchor="middle">50%</text><text x="350" y="61">NBR 2013: 1/3</text><rect x="350" y="75" width="150" height="64" fill="#93c5fd" stroke="#2563eb"/><rect x="450" y="75" width="150" height="64" fill="#86efac" stroke="#16a34a"/><rect x="450" y="75" width="50" height="64" fill="#fbbf24"/><text x="475" y="112" text-anchor="middle" font-size="14">33%</text><text x="25" y="177" font-weight="bold">Progressão transversal das passadas longitudinais</text><text x="25" y="209">Tangente: bordas → eixo</text><path d="M25 250L170 230L315 250L315 263L170 243L25 263Z" fill="#d6d3d1" stroke="#57534e"/><path d="M40 233L145 218l-12-3m12 3-9 9M300 233L195 218l12-3m-12 3 9 9" fill="none" stroke="#2563eb" stroke-width="3"/><text x="350" y="209">Curva: baixa → alta</text><path d="M350 263L650 225V238L350 276Z" fill="#d6d3d1" stroke="#57534e"/><path d="M365 247L635 213l-13-4m13 4-10 9" fill="none" stroke="#2563eb" stroke-width="3"/><text x="350" y="299">Borda baixa</text><text x="650" y="250" text-anchor="end">Alta</text><text x="25" y="343" font-size="16">Ex.: rolo 1,80 m — recobrimento 0,90 m (1/2) ou 0,60 m (1/3).</text><text x="25" y="365" font-size="15">A fração depende da norma e da edição, não de um valor fixo de 10 cm.</text></g></svg>
