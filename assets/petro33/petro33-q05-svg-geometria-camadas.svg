<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 475"><rect width="700" height="475" fill="white"/><g font-family="sans-serif" fill="#334155"><text x="20" y="26" font-size="21" font-weight="bold">Geometria, drenagem e estrutura rodoviária</text><text x="20" y="62" font-size="17" font-weight="bold">Abaulamento: água para as bordas</text><path d="M35 110L185 82L335 110V125L185 97L35 125Z" fill="#64748b"/><path d="M165 78L48 100l10-11m-10 11 15 3M205 78L322 100l-10-11m10 11-15 3" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M10 110L22 128L35 110M335 110L348 128L360 110" fill="none" stroke="#0891b2" stroke-width="3"/><text x="20" y="149" font-size="14">Sarjeta recebe e conduz a água longitudinalmente.</text><text x="380" y="62" font-size="17" font-weight="bold">Superelevação</text><path d="M380 115L670 80V96L380 131Z" fill="#64748b"/><path d="M650 72L400 102l12-9m-12 9 16 4" fill="none" stroke="#2563eb" stroke-width="3"/><text x="380" y="149" font-size="14">Equilíbrio lateral; drenagem na transição.</text><text x="20" y="185" font-size="17" font-weight="bold">Superlargura: acréscimo de largura em planta</text><path d="M30 245Q180 135 330 245L325 260Q180 175 35 260Z" fill="#86efac" stroke="#16a34a"/><path d="M35 260Q180 175 325 260L318 276Q180 200 42 276Z" fill="#94a3b8" stroke="#475569"/><text x="380" y="190" font-size="17" font-weight="bold">Seção do pavimento flexível</text><rect x="380" y="207" width="160" height="27" fill="#334155"/><text x="460" y="225.5" text-anchor="middle" font-size="14" fill="white">Capa</text><rect x="380" y="236" width="160" height="27" fill="#64748b"/><text x="460" y="254.5" text-anchor="middle" font-size="14" fill="white">Binder</text><rect x="380" y="266" width="160" height="40" fill="#b6c7d4"/><text x="460" y="291" text-anchor="middle" font-size="14" fill="#1e293b">Base</text><rect x="380" y="309" width="160" height="39" fill="#e6cda8"/><text x="460" y="333.5" text-anchor="middle" font-size="14" fill="#1e293b">Sub-base</text><rect x="380" y="351" width="160" height="35" fill="#d4a373"/><text x="460" y="373.5" text-anchor="middle" font-size="14" fill="#1e293b">Reforço</text><rect x="380" y="389" width="160" height="13" fill="#f5deb3"/><text x="460" y="400.5" text-anchor="middle" font-size="14" fill="#1e293b"></text><rect x="380" y="405" width="160" height="35" fill="#b99c82"/><text x="460" y="427.5" text-anchor="middle" font-size="14" fill="#1e293b">Subleito</text><path d="M540 235H553M540 265H553M540 396H553" stroke="#334155"/><text x="557" y="239" font-size="12">Ligação</text><text x="557" y="269" font-size="12">Imprimação*</text><text x="557" y="400" font-size="12">Regularização</text><text x="20" y="320" font-size="15" font-weight="bold">Base negra</text><text x="20" y="343" font-size="14">Agregados + asfalto; muitos vazios.</text><text x="20" y="370" font-size="15" font-weight="bold">Camada de bloqueio</text><text x="20" y="392" font-size="14">Evita migração de finos.</text><text x="20" y="418" font-size="15" font-weight="bold">Capa antiderrapante</text><text x="20" y="440" font-size="14">Reduz derrapagem.</text><text x="20" y="466" font-size="12">* Quando prevista para a base apropriada. Camadas opcionais conforme projeto.</text></g></svg>
