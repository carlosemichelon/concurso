<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300"><rect width="660" height="300" fill="white"/><g font-family="sans-serif" fill="#1e293b"><text x="20" y="26" font-size="20" font-weight="bold">NBR 7187 — pressão equivalente p = k·v²</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#2563eb"/></marker></defs><text x="90" y="64" text-anchor="middle" font-size="15">90° com a face</text><rect x="110" y="88" width="38" height="84" fill="#cbd5e1" stroke="#475569"/><path d="M32 130H93" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="90" y="208" text-anchor="middle" font-size="19" fill="#1d4ed8" font-weight="bold">k=0,71</text><text x="250" y="64" text-anchor="middle" font-size="15">45° com a face</text><rect x="270" y="88" width="38" height="84" fill="#cbd5e1" stroke="#475569"/><path d="M200 180L268 112" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="250" y="208" text-anchor="middle" font-size="19" fill="#1d4ed8" font-weight="bold">k=0,54</text><text x="410" y="64" text-anchor="middle" font-size="15">0° com a face</text><rect x="430" y="88" width="38" height="84" fill="#cbd5e1" stroke="#475569"/><path d="M416 182V80" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="410" y="208" text-anchor="middle" font-size="19" fill="#1d4ed8" font-weight="bold">k=0</text><text x="570" y="64" text-anchor="middle" font-size="15">Circular</text><circle cx="605" cy="130" r="29" fill="#cbd5e1" stroke="#475569"/><path d="M512 130H573" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="570" y="208" text-anchor="middle" font-size="19" fill="#1d4ed8" font-weight="bold">k=0,34</text><text x="20" y="245" font-size="16">Interpolar linearmente. Área projetada perpendicular ao fluxo.</text><text x="20" y="270" font-size="16">Dobrar v → quadruplicar p. Água parada: p = γh.</text><text x="20" y="290" font-size="13">0° refere-se à face considerada, não à força total em qualquer geometria.</text></g></svg>
