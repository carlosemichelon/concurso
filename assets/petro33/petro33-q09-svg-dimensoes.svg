<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 385"><rect width="680" height="385" fill="white"/><g font-family="sans-serif" fill="#334155" font-size="17"><text x="20" y="26" font-size="22" font-weight="bold">NBR 7187:2021 — dimensões mínimas (cm)</text><text x="20" y="59" font-weight="bold">Lajes maciças</text><rect x="20" y="89" width="180" height="46" fill="#93c5fd" stroke="#2563eb"/><text x="110" y="155" text-anchor="middle">Ferroviária: 23</text><rect x="245" y="99" width="180" height="36" fill="#93c5fd" stroke="#2563eb"/><text x="335" y="155" text-anchor="middle">Rodoviária*: 18</text><rect x="470" y="111" width="180" height="24" fill="#93c5fd" stroke="#2563eb"/><text x="560" y="155" text-anchor="middle">Demais: 12</text><text x="20" y="179" font-size="13">* Exceto lajes de continuidade.</text><text x="20" y="213" font-weight="bold">Almas de vigas</text><path d="M35 226H195V245H134V304H96V245H35Z" fill="#bfdbfe" stroke="#2563eb"/><text x="115" y="325" text-anchor="middle">Local ≥20</text><path d="M225 226H385V245H317V304H293V245H225Z" fill="#bfdbfe" stroke="#2563eb"/><text x="305" y="325" text-anchor="middle">Pré-fab. ≥12*</text><text x="425" y="213" font-weight="bold">Pilares</text><rect x="435" y="232" width="70" height="70" fill="#86efac" stroke="#15803d"/><rect x="550" y="232" width="95" height="70" fill="#86efac" stroke="#15803d"/><rect x="568" y="249" width="59" height="36" fill="white" stroke="#15803d"/><text x="470" y="323" text-anchor="middle">Maciço 40</text><text x="597" y="323" text-anchor="middle">Celular 20/25</text><text x="20" y="353" font-size="15">* Redução condicionada a técnica, controle e ausência de protensão na alma da seção.</text><text x="20" y="376" font-size="15">Pilar maciço: b ≥ max(40 cm, H/25). Passarela: 30 cm e H/25.</text></g></svg>
