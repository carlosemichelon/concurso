<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Retângulo e eixos centroidais"><rect width="640" height="200" fill="white"/><g stroke="#25495e" stroke-width="2" fill="none"><rect x="94" y="25" width="124" height="146" fill="#e5f1f8"/><path d="M65 98H250M156 9V187" stroke-dasharray="5 4"/><path d="M94 182H218M94 176V188M218 176V188M79 25V171M73 25H85M73 171H85"/><circle cx="156" cy="98" r="3" fill="#25495e"/></g><g font-family="Arial,sans-serif" font-size="15" fill="#183b52"><text x="224" y="93">x</text><text x="164" y="18">y</text><text x="145" y="197">b</text><text x="59" y="104">h</text><text x="165" y="112">G</text><text x="280" y="43" font-weight="bold">Eixo centroidal x</text><text x="280" y="79">Iₓ = b h³ / 12</text><text x="280" y="109">Wₓ = Iₓ / (h/2) = b h² / 6</text><text x="280" y="142">Distância à fibra extrema: h/2</text><text x="280" y="169">I: L⁴   ·   W: L³</text></g></svg>