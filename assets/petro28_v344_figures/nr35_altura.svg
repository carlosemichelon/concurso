<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="NR-18 e NR-35 — trabalho em altura"><title>NR-18 e NR-35 — trabalho em altura</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#53687B" stroke-width="1.2"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1" y="1" width="958" height="398" rx="15" fill="#F6F9FC" stroke="#D1DCE8" stroke-width="1.4"/><text x="34" y="38" font-size="27" font-weight="700" fill="#20354B" text-anchor="start">NR-18 e NR-35 — trabalho em altura</text><text x="34" y="65" font-size="16" font-weight="400" fill="#53687B" text-anchor="start">Serviços em telhados e coberturas: limiar normativo e risco de queda.</text><line x1="34" y1="79" x2="926" y2="79" stroke="#D1DCE8" stroke-width="1"  /><rect x="32" y="98" width="570" height="240" rx="10" fill="white" stroke="#D1DCE8" stroke-width="1.4"/><rect x="618" y="98" width="310" height="240" rx="10" fill="white" stroke="#D1DCE8" stroke-width="1.4"/><text x="52" y="125" font-size="20" font-weight="700" fill="#2457A6" text-anchor="start">Diferença de nível</text><line x1="55" y1="305" x2="580" y2="305" stroke="#53687B" stroke-width="3"  /><rect x="110" y="205" width="290" height="99" rx="0" fill="#E6EDF4" stroke="#53687B" stroke-width="1"/><path d="M91 207 L255 147 L420 207" stroke="#2457A6" stroke-width="4" fill="#D9E9FF" stroke-linecap="round" stroke-linejoin="round"/><line x1="410" y1="205" x2="531" y2="205" stroke="#53687B" stroke-width="1" stroke-dasharray="5 4" /><line x1="410" y1="305" x2="531" y2="305" stroke="#53687B" stroke-width="1" stroke-dasharray="5 4" /><line x1="515" y1="205" x2="515" y2="305" stroke="#B9383C" stroke-width="2.6"  /><path d="M509 214L515 205L521 214M509 296L515 305L521 296" stroke="#B9383C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="255" font-size="20" font-weight="700" fill="#B9383C" text-anchor="start">h</text><text x="255" y="325" font-size="16" font-weight="400" fill="#53687B" text-anchor="middle">Nível inferior</text><text x="640" y="125" font-size="18" font-weight="700" fill="#0C826C" text-anchor="start">Dois critérios cumulativos</text><text x="640" y="170" font-size="28" font-weight="700" fill="#2457A6" text-anchor="start">h &gt; 2,00 m</text><text x="640" y="199" font-size="20" font-weight="700" fill="#0C826C" text-anchor="start">E risco de queda</text><line x1="640" y1="216" x2="907" y2="216" stroke="#D1DCE8" stroke-width="1"  /><text x="640" y="248" font-size="18" font-weight="700" fill="#53687B" text-anchor="start">h = 2,00 m</text><text x="640" y="273" font-size="16" font-weight="400" fill="#B9383C" text-anchor="start">Não atende ao limiar literal.</text><text x="640" y="300" font-size="15" font-weight="400" fill="#53687B" text-anchor="start">Prevenção continua necessária.</text><line x1="34" y1="358" x2="926" y2="358" stroke="#D1DCE8" stroke-width="1"  /><text x="34" y="383" font-size="14" font-weight="400" fill="#53687B" text-anchor="start">NR-18 18.7.8.1; NR-35 35.2.1. Desenho de referência, sem autorização para trabalho.</text></g></svg>