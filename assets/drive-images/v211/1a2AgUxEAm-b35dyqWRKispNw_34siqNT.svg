<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Plataforma rígida gira mantendo-se retilínea, apoiada nas colunas 1, 2 e 3 distantes a e 2a">
<style>text{font-family:Arial, sans-serif;fill:#202124;font-size:20px}.tiny{font-size:17px}.headline{font-weight:700}.line{stroke:#252525;stroke-width:3;fill:none}.dash{stroke:#777;stroke-dasharray:9 7;stroke-width:3;fill:none}.dim{stroke:#444;stroke-width:2;fill:none}.blue{stroke:#24638d;stroke-width:3;fill:none}</style>
<text x="38" y="40" class="headline" font-size="25">Compatibilidade geométrica em plataforma RÍGIDA</text>
<path class="dash" d="M85 115 H770"/><text x="780" y="121" class="tiny">posição inicial</text>
<path class="line" d="M85 145 L770 248"/><text x="685" y="215" class="tiny">após deslocamento e rotação</text>
<g class="line" stroke-width="8"><path d="M125 145 V315"/><path d="M300 171.4 V315"/><path d="M650 224.1 V315"/></g>
<path class="line" d="M85 316 H730"/><text x="790" y="323" class="tiny">base fixa</text>
<g class="blue"><path d="M125 118 V141"/><path d="M300 118 V167"/><path d="M650 118 V220"/><path d="M119 135 L125 145 L131 135"/><path d="M294 161 L300 171 L306 161"/><path d="M644 214 L650 224 L656 214"/></g>
<g font-size="19"><text x="105" y="99">u₁</text><text x="308" y="150">u₂</text><text x="658" y="201">u₃</text><text x="115" y="346" class="headline">1</text><text x="291" y="346" class="headline">2</text><text x="641" y="346" class="headline">3</text></g>
<g class="dim"><path d="M125 365 H300 M125 359 V371 M300 359 V371"/><path d="M300 365 H650 M650 359 V371"/></g>
<text x="209" y="395">a</text><text x="456" y="395">2a</text><text x="37" y="74" class="tiny">Inclinação igual em todo trecho: (u₂ − u₁)/a = (u₃ − u₂)/(2a)</text>
</svg>