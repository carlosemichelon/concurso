<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690">
<rect width="1120" height="690" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#171717">
<text x="36" y="45" font-size="27" font-weight="bold">NBR 8160:1999 | Esgoto secundário, primário e caixas</text>
<text x="36" y="78" font-size="17">Esquema funcional para a questão Petrobras 2011 Q26 (não é reprodução do croqui original)</text>
</g>
<!-- main flow -->
<g fill="none" stroke="#222" stroke-width="3">
<rect x="40" y="125" width="210" height="135" rx="13"/>
<rect x="388" y="125" width="230" height="135" rx="13"/>
<rect x="771" y="125" width="276" height="135" rx="13"/>
<path d="M250 183 H388" stroke-width="5" stroke-dasharray="19 12"/>
<path d="M618 183 H771" stroke-width="5"/>
<path d="M375 175 L387 183 L375 191"/>
<path d="M758 175 L770 183 L758 191"/>
</g>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#171717" text-anchor="middle">
<text x="145" y="159" font-size="23" font-weight="bold">I</text><text x="145" y="195" font-size="21">Pia de cozinha</text><text x="145" y="222" font-size="15">origem de gordura</text>
<text x="503" y="159" font-size="23" font-weight="bold">II</text><text x="503" y="191" font-size="20">Caixa de gordura</text><text x="503" y="217" font-size="15">retenção + septo</text>
<text x="909" y="159" font-size="23" font-weight="bold">III</text><text x="909" y="191" font-size="20">Caixa de inspeção</text><text x="909" y="217" font-size="15">inspeção / limpeza</text>
<text x="319" y="112" font-size="21" font-weight="bold">TRACEJADA</text><text x="319" y="293" font-size="18">SECUNDÁRIO</text>
<text x="695" y="112" font-size="21" font-weight="bold">CONTÍNUA</text><text x="695" y="293" font-size="18">PRIMÁRIO</text>
</g>
<line x1="40" y1="320" x2="1080" y2="320" stroke="#999"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#171717">
<text x="40" y="358" font-size="22" font-weight="bold">Três padrões: somente na legenda que diferencia as funções</text>
<text x="235" y="402" font-size="19">SECUNDÁRIO = gases da rede não alcançam o trecho</text>
<text x="235" y="452" font-size="19">PRIMÁRIO = acesso dos gases provenientes do coletor</text>
<text x="235" y="502" font-size="19">VENTILAÇÃO = circulação de ar para equilíbrio de pressões</text>
</g>
<path d="M43 393 H200" stroke="#222" stroke-width="5" stroke-dasharray="18 11"/>
<path d="M43 443 H200" stroke="#222" stroke-width="5"/>
<path d="M43 493 H200" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 12"/>
<rect x="34" y="548" width="1044" height="95" rx="12" fill="#f4f4f4" stroke="#777"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#171717">
<text x="51" y="580" font-size="19" font-weight="bold">Atenção: a outra imagem enviada é uma legenda simplificada DIFERENTE.</text>
<text x="51" y="608" font-size="17">Nela, contínua = esgoto sanitário (sem discriminar primário/secundário)</text>
<text x="51" y="632" font-size="17">e tracejada = ventilação. Sempre verificar qual legenda a questão adota.</text>
</g></svg>