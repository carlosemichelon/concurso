<svg xmlns="http://www.w3.org/2000/svg" width="850" height="270" viewBox="0 0 850 270" role="img" aria-label="Comparação entre soma de forças como m a do centro de massa e soma de momentos em G como I de massa vezes alfa."><rect width="850" height="270" fill="white"/><g fill="none" stroke="#202020" stroke-width="2"><rect x="36" y="32" width="373" height="176" rx="10"/><rect x="441" y="32" width="373" height="176" rx="10"/></g><g fill="#202020" font-family="Arial,sans-serif" text-anchor="middle"><text x="221" y="70" font-size="22">TRANSLAÇÃO</text><text x="627" y="70" font-size="22">ROTAÇÃO</text><text x="221" y="124" font-size="31">ΣF = m a_G</text><text x="627" y="124" font-size="31">ΣM_G = I_G α</text><text x="221" y="166" font-size="19">Aceleração do centro de massa</text><text x="627" y="166" font-size="19">Aceleração angular</text><text x="427" y="247" font-size="18">Corpo rígido com movimento plano; ambos os efeitos podem ocorrer simultaneamente</text></g></svg>