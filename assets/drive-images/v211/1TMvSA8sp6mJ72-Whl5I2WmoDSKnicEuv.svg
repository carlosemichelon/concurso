<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780">
<style>text{font-family:Arial,sans-serif;fill:#151515} .thin{stroke:#222;stroke-width:2;fill:none}.surface{stroke:#222;stroke-width:2}.foot{fill:#ddd;stroke:#222;stroke-width:2}.failure{stroke:#111;stroke-width:3;fill:none}.dash{stroke-dasharray:9 6}.axis{stroke:#333;stroke-width:2;fill:none}.curve{stroke:#111;stroke-width:4;fill:none}</style>
<rect width="1000" height="780" fill="white"/>
<text x="500" y="37" text-anchor="middle" font-size="25" font-weight="bold">MODOS DE RUPTURA — VESIC (1975)</text>
<text x="500" y="67" text-anchor="middle" font-size="15">Esquemas didáticos sem escala; carga aumenta à direita e recalque aumenta para baixo</text>
<g transform="translate(0 83)">
