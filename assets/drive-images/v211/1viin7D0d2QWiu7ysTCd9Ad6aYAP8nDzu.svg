<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<rect width="1280" height="620" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#111">
<text x="45" y="47" font-size="29" font-weight="bold">TRELIÇA ISOSTÁTICA: AQUECIMENTO SEM ESFORÇO TÉRMICO ADICIONAL</text>
<text x="47" y="82" font-size="19">Os esforços da carga P permanecem; as barras podem alterar seu comprimento sem reação térmica adicional.</text>
</g>
<g stroke="#222" stroke-width="8" fill="none" stroke-linejoin="round"><path d="M160 180 L605 390 L1050 180 L160 180"/></g>
<g stroke="#333" stroke-width="3" fill="white"><circle cx="160" cy="180" r="14"/><circle cx="605" cy="390" r="14"/><circle cx="1050" cy="180" r="14"/></g>
<g fill="none" stroke="#111" stroke-width="4"><path d="M160 199 L134 244 L186 244 Z"/><path d="M1050 199 L1024 238 L1076 238 Z"/><path d="M1007 258 H1093 M140 247 H181"/><circle cx="1036" cy="249" r="9"/><circle cx="1065" cy="249" r="9"/><path d="M605 411 V502 M590 486 L605 505 L620 486"/></g>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#111" font-size="23"><text x="590" y="163">Barra 1</text><text x="280" y="310">Barra 2</text><text x="820" y="310">Barra 3</text><text x="629" y="490" font-weight="bold">P</text><text x="58" y="288">Apoio articulado</text><text x="939" y="289">Apoio móvel (rolete)</text>
<text x="47" y="562" font-size="21" font-weight="bold">Em cada barra: deformação total = deformação elástica + αΔT.</text>
<text x="47" y="596" font-size="20">ΔN térmico = 0 neste modelo isostático ideal, com apoios livres para acomodar a variação de temperatura.</text></g>
</svg>