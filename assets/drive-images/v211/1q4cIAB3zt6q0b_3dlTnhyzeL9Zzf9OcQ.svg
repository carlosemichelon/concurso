<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-label="A plataforma rígida sofre translação vertical u2 e rotação theta. A coluna 1 está a a à esquerda da coluna 2 e desloca-se u1=u2-a theta; a coluna 3 está a 2a à direita e desloca-se u3=u2+2a theta.">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#171717;font-size:20px}.title{font-weight:700;font-size:25px}.note{font-size:17px}.thin{stroke:#444;stroke-width:2;fill:none}.struct{stroke:#171717;stroke-width:5;fill:none}.initial{stroke:#777;stroke-width:2.3;stroke-dasharray:10 7;fill:none}.ref{stroke:#888;stroke-dasharray:6 7;stroke-width:1.7}.disp{stroke:#176887;stroke-width:3;fill:none}.accent{stroke:#555;stroke-width:2;fill:none}.box{stroke:#444;fill:#fafafa;stroke-width:1}
</style>
<rect x="0" y="0" width="960" height="465" fill="#fff"/>
<text x="35" y="39" class="title">Rotação θ — referência na coluna 2</text>
<text x="35" y="72" class="note">Deslocamentos positivos para baixo; rotação positiva aumenta u da esquerda para a direita</text>
