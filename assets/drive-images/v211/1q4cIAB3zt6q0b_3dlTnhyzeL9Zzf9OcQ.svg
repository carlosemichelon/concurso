<path d="M111 150 l8 11 8 -11 M335 189 l8 11 8 -11 M782 267 l8 11 8 -11" class="disp"/>
<g fill="#c9c9c9" stroke="#565656" stroke-width="1.5">
<rect x="108" y="161" width="22" height="179"/><rect x="332" y="200" width="22" height="140"/><rect x="779" y="278" width="22" height="62"/>
</g>
<path d="M80 340 H844" stroke="#202020" stroke-width="5"/>
<g text-anchor="middle">
<text x="119" y="380">Coluna 1</text><text x="343" y="380">Coluna 2</text><text x="790" y="380">Coluna 3</text>
<text x="119" y="94">u₁</text><text x="343" y="94">u₂</text><text x="790" y="94">u₃</text>
</g>
<path d="M119 406 H343 M343 406 H790 M119 397 V415 M343 397 V415 M790 397 V415" class="thin"/>
<text x="225" y="431">a</text><text x="550" y="431">2a</text>
