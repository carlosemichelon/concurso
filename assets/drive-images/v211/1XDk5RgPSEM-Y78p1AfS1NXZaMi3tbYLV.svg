<text x="82" y="31" class="label">DURABILIDADE — PONTE SOBRE O MAR</text>
<text x="84" y="227" class="label">CAA IV</text><text x="84" y="251" class="detail">Respingos de maré</text><text x="84" y="277" class="small">Muito forte / risco elevado</text>
<text x="634" y="141" class="label">CAA III</text><text x="634" y="166" class="detail">Ambiente marinho (geral)</text><text x="634" y="187" class="small">Forte / risco grande</text>
