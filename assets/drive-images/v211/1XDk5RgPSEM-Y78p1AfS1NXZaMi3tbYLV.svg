<text x="646" y="393" class="label">Zona submersa</text><text x="646" y="416" class="small">Analisar exposição específica</text><text x="646" y="437" class="small">Não equiparar automaticamente a CAA I</text>
<text x="84" y="472" class="detail">Cloretos → armadura → risco de corrosão → fissuras / destacamentos</text>
