<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"><rect width="640" height="350" fill="white"/><g font-family="Arial" font-size="16" fill="#111"><text x="320" y="25" font-size="20" font-weight="bold" text-anchor="middle">Orçamento angular — duas espirais e arco</text><text x="20" y="58" font-weight="bold">Δ disponível &gt; θ₁ + θ₂</text><rect x="20" y="70" width="180" height="32" fill="#bfdbfe" stroke="#2563eb"/><rect x="200" y="70" width="240" height="32" fill="#bbf7d0" stroke="#16a34a"/><rect x="440" y="70" width="180" height="32" fill="#bfdbfe" stroke="#2563eb"/><text x="110" y="91" text-anchor="middle">θ₁</text><text x="320" y="91" text-anchor="middle" fill="#166534" font-weight="bold">Δc &gt; 0</text><text x="530" y="91" text-anchor="middle">θ₂</text><text x="20" y="132" font-weight="bold">Δ disponível = θ₁ + θ₂</text><rect x="20" y="144" width="300" height="32" fill="#bfdbfe" stroke="#2563eb"/><rect x="320" y="144" width="300" height="32" fill="#bfdbfe" stroke="#2563eb"/><text x="170" y="165" text-anchor="middle">θ₁</text><text x="470" y="165" text-anchor="middle">θ₂</text><text x="320" y="195" text-anchor="middle">Δc = 0 — sem arco circular</text><text x="20" y="229" font-weight="bold">Δ disponível &lt; θ₁ + θ₂</text><rect x="20" y="241" width="340" height="32" fill="#bfdbfe" stroke="#2563eb"/><rect x="360" y="241" width="260" height="32" fill="#bfdbfe" stroke="#2563eb"/><rect x="620" y="241" width="14" height="32" fill="#fecdd3" stroke="#dc2626"/><path d="M620 236V279" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><text x="190" y="262" text-anchor="middle">θ₁</text><text x="490" y="262" text-anchor="middle">θ₂</text><text x="320" y="296" text-anchor="middle" fill="#b91c1c">Δc &lt; 0 — configuração incompatível</text><text x="320" y="322" text-anchor="middle" font-weight="bold">Δc = Δ − θ₁ − θ₂</text><text x="320" y="341" text-anchor="middle" font-size="13">Critério histórico: faltou ângulo? Testar R maior. Δ real não muda.</text></g><