<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="t d"><title id="t">Empuxos de terra e diagramas de pressão</title><desc id="d">Muro com solo à direita: deslocamento ativo à esquerda, passivo à direita, repouso sem movimento. Diagramas de peso próprio, sobrecarga uniforme e água hidrostática.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#17659b"/></marker><pattern id="soil" width="16" height="13" patternUnits="userSpaceOnUse"><path d="M1 8l4-3m6 7l3-3" stroke="#bca77d" stroke-width="1.4"/></pattern></defs><rect width="920" height="720" fill="#fff"/><g font-family="Arial,sans-serif" fill="#183044"><text x="460" y="35" text-anchor="middle" font-size="25" font-weight="bold">EMPUXOS DE TERRA — ESTADOS E AÇÕES</text><g font-size="18" text-anchor="middle"><text x="155" y="79" font-weight="bold">ATIVO</text><text x="460" y="79" font-weight="bold">REPOUSO</text><text x="765" y="79" font-weight="bold">PASSIVO</text></g><g stroke="#596c78" stroke-width="2"><path d="M112 117h148v143H112zM417 117h148v143H417zM722 117h148v143H722z" fill="url(#soil)"/><path d="M102 106v154h-36v12h84v-12h-36V106zM407 106v154h-36v12h84v-12h-36V106zM712 106v154h-36v12h84v-12h-36V106z" fill="#aebbc4"/></g><g fill="none" stroke="#17659b" stroke-width="4" marker-end="url(#arr)"><path d="M101 150H47"/><path d="M710 150h63"/></g><path d="M405 152h-45m45 10h-45" stroke="#17659b" stroke-width="4"/><g fill="#17659b" font-size="17" text-anchor="middle"><text x="155" y="299">Afasta • Ka = 1/3</text><text x="460" y="299">Sem deformação • K₀ ≈ 0,5</text><text x="765" y="299">Avança • Kp = 3</text><text x="460" y="328" font-size="15">Exemplo: φ′ = 30°, solo granular NC, Rankine simples; repouso por Jaky.</text></g><path d="M35 351H885" stroke="#c3d1d9" stroke-width="2"/><text x="460" y="386" text-anchor="middle" font-size="21" font-weight="bold">PRESSÕES LATERAIS: ÁREA = FORÇA POR METRO</text><g font-size="17" text-anchor="middle" font-weight="bold"><text x="155" y="426">Peso próprio</text><text x="460" y="426">Sobrecarga uniforme</text><text x="765" y="426">Água hidrostática</text></g><g stroke-width="2"><path d="M80 450v170h150z" fill="#d8ecc4" stroke="#54853b"/><path d="M385 450h150v170H385z" fill="#ffedb9" stroke="#b48722"/><path d="M690 450v170h150z" fill="#cae8fb" stroke="#17659b"/></g><g stroke="#3d596e" stroke-width="2" stroke-dasharray="5 4" fill="none"><path d="M80 563h150M385 535h150M690 563h150"/></g><g fill="#183044" font-size="16" text-anchor="middle"><text x="155" y="650">KγH²/2 · H/3</text><text x="460" y="650">KqH · H/2</text><text x="765" y="650">γwHw²/2 · Hw/3</text><text x="460" y="685">σh = Kσ′v + u   •   água não é multiplicada por K</text></g></g></svg>