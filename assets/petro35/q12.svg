<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350"><rect width="820" height="350" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22" font-weight="bold">SPT — o que se obtém diretamente?</text><rect x="20" y="65" width="250" height="82" fill="#e4cda6"/><rect x="20" y="147" width="250" height="80" fill="#c5a58c"/><rect x="20" y="227" width="250" height="88" fill="#e0c780"/><rect x="100" y="65" width="26" height="250" fill="#fff" stroke="#64748b"/><path d="M113 45V297" stroke="#475569" stroke-width="4"/><rect x="106" y="289" width="14" height="22" fill="#64748b"/><path d="M20 197H100M126 197H270" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/><text x="140" y="110" font-size="15">Areia fina</text><text x="140" y="175" font-size="15">Argila siltosa</text><text x="140" y="218" font-size="13" fill="#1d4ed8">NA observado</text><text x="140" y="270" font-size="15">Areia média</text><text x="288" y="56" font-size="13" font-weight="bold">N</text><rect x="288" y="79" width="16" height="14" fill="#16a34a"/><text x="312" y="90" font-size="13">4</text><rect x="288" y="124" width="32" height="14" fill="#16a34a"/><text x="328" y="135" font-size="13">8</text><rect x="288" y="169" width="40" height="14" fill="#16a34a"/><text x="336" y="180" font-size="13">10</text><rect x="288" y="254" width="88" height="14" fill="#16a34a"/><text x="384" y="265" font-size="13">22</text><text x="435" y="75" font-size="17" font-weight="bold" fill="#047857">ECAN: investigação preliminar</text><text x="435" y="106" font-size="16">E — Estratigrafia</text><text x="435" y="134" font-size="16">C — Classificação dos solos</text><text x="435" y="162" font-size="16">A — Água: posição do NA</text><text x="435" y="190" font-size="16">N — Índice de penetração (N-SPT)</text><text x="435" y="233" font-size="17" font-weight="bold" fill="#b91c1c">Não mede diretamente:</text><text x="435" y="262" font-size="15">Umidade, capilaridade, tensão efetiva,</text><text x="435" y="285" font-size="15">índice de vazios ou capacidade de carga.</text><text x="20" y="338" font-size="13">NBR 6122:2022, 4.3; NBR 6484:2020. Perfil ilustrativo, sem escala.</text></g></svg>