<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360"><rect width="820" height="360" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="22" font-weight="bold">SPT — medição e controle do nível d'água</text><rect x="20" y="80" width="345" height="235" fill="#ead9bd"/><rect x="20" y="180" width="345" height="135" fill="#bfdbfe"/><rect x="145" y="80" width="70" height="235" fill="white" stroke="#64748b" stroke-width="2"/><rect x="147" y="180" width="66" height="133" fill="#93c5fd"/><circle cx="95" cy="60" r="20" fill="#64748b"/><circle cx="95" cy="60" r="12" fill="#fbbf24"/><path d="M95 40H180V174" stroke="#d97706" stroke-width="3" fill="none"/><rect x="175" y="172" width="10" height="9" fill="#475569"/><path d="M20 180H145M215 180H365" stroke="#2563eb" stroke-dasharray="5 3" stroke-width="2"/><path d="M240 80V180M233 80H247M233 180H247" stroke="#475569" stroke-width="2"/><text x="250" y="130" font-size="14">3 m</text><text x="225" y="72" font-size="14">Boca 100 m</text><text x="225" y="201" font-size="14" fill="#1d4ed8">NA 97 m</text><text x="385" y="80" font-size="16" font-weight="bold">Durante o avanço</text><text x="385" y="105" font-size="14">Nível interno ≥ NA do terreno.</text><text x="385" y="132" font-size="16" font-weight="bold">Ao final</text><text x="385" y="156" font-size="14">Rebaixar água interna; observar recuperação.</text><text x="385" y="185" font-size="16" font-weight="bold" fill="#047857">Manual e mecanizado: mínimo 12 h</text><text x="385" y="210" font-size="14">Após encerramento e retirada do revestimento.</text><text x="385" y="237" font-size="16" font-weight="bold" fill="#1d4ed8">Mecanizado: também repetir após 24 h.</text><text x="385" y="272" font-size="14">Trado isolado: 5 min por 30 min; ≥12 h.</text><text x="20" y="344" font-size="13">NBR 6484:2020, itens 5.2.5 e 6.2.5 • NBR 9603:2023, 5.3.</text></g></svg>