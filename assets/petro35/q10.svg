<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340"><rect width="780" height="340" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="30" font-size="21" font-weight="bold">Trado: reconhecimento, não ensaio de resistência</text><rect x="20" y="90" width="340" height="74" fill="#e3c79e"/><rect x="20" y="164" width="340" height="66" fill="#bc956f"/><rect x="20" y="230" width="340" height="70" fill="#b2cce2"/><path d="M20 230H360" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/><path d="M45 59H145M95 59V213" stroke="#475569" stroke-width="5"/><path d="M77 144Q117 151 77 158Q117 165 77 172Q117 179 77 186Q117 193 95 213" stroke="#475569" stroke-width="7" fill="none"/><text x="175" y="130" font-size="15">Areia</text><text x="175" y="199" font-size="15">Argila</text><text x="175" y="250" font-size="15" fill="#1d4ed8">Nível d'água</text><text x="390" y="92" font-size="16" font-weight="bold" fill="#047857">O trado fornece:</text><text x="390" y="119" font-size="15">• Natureza do solo</text><text x="390" y="144" font-size="15">• Posição das camadas</text><text x="390" y="169" font-size="15">• Nível d'água</text><text x="390" y="194" font-size="15">• Amostra deformada</text><text x="390" y="235" font-size="16" font-weight="bold" fill="#b91c1c">Exige ensaio complementar:</text><text x="390" y="262" font-size="15">Resistência e deformabilidade</text><text x="390" y="287" font-size="15">Parâmetros físicos e mecânicos</text><text x="20" y="324" font-size="12">NBR 6497:1983, 4.3.3.3; NBR 9603:2023, escopo.</text></g></svg>