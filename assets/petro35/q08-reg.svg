t-size="14">Manual: mais de 30; mecanizado: mais de 40 golpes.</text><rect x="20" y="364" width="860" height="38" fill="#eef5fa"/><text x="30" y="388" font-size="17" font-weight="bold">5/0</text><text x="305" y="388" font-size="14">Cinco golpes sucessivos sem avanço; interromper e registrar</text><text x="20" y="432" font-size="13">Tabela 1 — NBR 6484:2020; não extrapolar registros incompletos.</text></g></svg>