<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255"><rect width="820" height="255" fill="#fff"/><g font-family="Arial" fill="#172033"><text x="20" y="30" font-size="23" font-weight="bold">Granulometria NBR 6502:2022 — limites em mm</text><rect x="20" y="65" width="140" height="55" fill="#a785ab"/><text x="90" y="97" font-size="18" text-anchor="middle">Argila</text><rect x="160" y="65" width="190" height="55" fill="#b8a6cf"/><text x="255" y="97" font-size="18" text-anchor="middle">Silte</text><rect x="350" y="65" width="220" height="55" fill="#dbbb70"/><text x="460" y="97" font-size="18" text-anchor="middle">Areia</text><rect x="570" y="65" width="230" height="55" fill="#b19b7d"/><text x="685" y="97" font-size="18" text-anchor="middle">Pedregulho</text><path d="M160 58V130" stroke="#333"/><text x="160" y="151" font-size="18" text-anchor="middle">0,002</text><path d="M350 58V130" stroke="#333"/><text x="350" y="151" font-size="18" text-anchor="middle">0,06</text><path d="M570 58V130" stroke="#333"/><text x="570" y="151" font-size="18" text-anchor="middle">2</text><path d="M800 58V130" stroke="#333"/><text x="800" y="151" font-size="18" text-anchor="end">60</text><text x="20" y="186" font-size="15">Areia: fina 0,06–0,20; média 0,20–0,60; grossa 0,60–2.</text><text x="20" y="209" font-size="15">Pedregulho: fino 2–6; médio 6–20; grosso 20–60. Pedra de mão: 60–200.</text><text x="20" y="232" font-size="15">Matacão: 200–1000. Esquema sem escala. USCS usa #200 = 0,075 mm.</text></g></svg>