<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480"><rect width="900" height="480" fill="#fff"/><g font-family="Arial,sans-serif" fill="#182739"><text x="20" y="30" font-size="23" font-weight="bold">Ensaios geotécnicos: campo × laboratório</text><rect x="20" y="50" width="420" height="36" rx="4" fill="#047857"/><rect x="460" y="50" width="420" height="36" rx="4" fill="#b45309"/><text x="30" y="73" fill="#fff" font-size="16" font-weight="bold">CAMPO — terreno no local</text><text x="470" y="73" fill="#fff" font-size="16" font-weight="bold">LABORATÓRIO — amostras</text><rect x="20" y="94" width="420" height="27" fill="#fff"/><text x="30" y="113" font-size="14">SPT — golpes; N</text><rect x="20" y="124" width="420" height="27" fill="#ecfdf5"/><text x="30" y="143" font-size="14">CPT/CPTu — cone; qc, fs, u (CPTu)</text><rect x="20" y="154" width="420" height="27" fill="#fff"/><text x="30" y="173" font-size="14">VST — torque; resistência não drenada</text><rect x="20" y="184" width="420" height="27" fill="#ecfdf5"/><text x="30" y="203" font-size="14">DMT — membrana plana</text><rect x="20" y="214" width="420" height="27" fill="#fff"/><text x="30" y="233" font-size="14">PMT — expansão cilíndrica</text><rect x="20" y="244" width="420" height="27" fill="#ecfdf5"/><text x="30" y="263" font-size="14">Placa — carga × deslocamento</text><rect x="20" y="274" width="420" height="27" fill="#fff"/><text x="30" y="293" font-size="14">Sísmicos — Vs</text><rect x="20" y="304" width="420" height="27" fill="#ecfdf5"/><text x="30" y="323" font-size="14">Permeabilidade / perda d'água</text><rect x="20" y="334" width="420" height="27" fill="#fff"/><text x="30" y="353" font-size="14">Piezometria / nível d'água</text><rect x="20" y="364" width="420" height="27" fill="#ecfdf5"/><text x="30" y="383" font-size="14">Penetração dinâmica</text><rect x="460" y="94" width="420" height="27" fill="#fff"/><text x="470" y="113" font-size="14">Caracterização — LL, LP, granulometria</text><rect x="460" y="124" width="420" height="27" fill="#fff7ed"/><text x="470" y="143" font-size="14">Cisalhamento direto — resistência</text><rect x="460" y="154" width="420" height="27" fill="#fff"/><text x="470" y="173" font-size="14">Triaxial — resistência/deformabilidade</text><rect x="460" y="184" width="420" height="27" fill="#fff7ed"/><text x="470" y="203" font-size="14">Adensamento — compressibilidade</text><rect x="460" y="214" width="420" height="27" fill="#fff"/><text x="470" y="233" font-size="14">Expansibilidade — aumento de volume</text><rect x="460" y="244" width="420" height="27" fill="#fff7ed"/><text x="470" y="263" font-size="14">Colapsibilidade — inundação sob carga</text><rect x="460" y="274" width="420" height="27" fill="#fff"/><text x="470" y="293" font-size="14">Pin-hole — dispersibilidade</text><rect x="460" y="304" width="420" height="27" fill="#fff7ed"/><text x="470" y="323" font-size="14">Permeabilidade — k de amostras</text><rect x="460" y="334" width="420" height="27" fill="#fff"/><text x="470" y="353" font-size="14">Químicos — contaminação</text><text x="20" y="433" font-size="15" font-weight="bold">Cone entra; palheta gira; SPT golpeia. Triaxial e edômetro: bancada.</text><text x="20" y="460" font-size="12">NBR 8044:2018, itens 6.3.5–6.3.6; SPT listado em sondagens; permeabilidade pode ser em campo ou laboratório.</text></g></svg>