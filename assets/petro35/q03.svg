<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390"><rect width="760" height="390" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="22" y="32" font-size="22" font-weight="bold">Altura do canal não é a altura da água</text><text x="22" y="55" font-size="14">Mesmo canal retangular: base b=2H, altura total H.</text><text x="180" y="83" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">Pleno: y=H</text><rect x="60" y="98" width="240" height="120" fill="#bfdbfe"/><path d="M60 98V218H300V98" stroke="#475569" stroke-width="3" fill="none"/><path d="M60 98V218H300V98" stroke="#d97706" stroke-width="5" fill="none"/><path d="M60 98H300" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/><path d="M45 98V218 M40 98h10 M40 218h10 M60 238H300 M60 233v10 M300 233v10" stroke="#64748b" stroke-width="1.4"/><text x="38" y="160" text-anchor="end" font-size="14">H</text><text x="180" y="258" text-anchor="middle" font-size="14">b=2H</text><text x="180" y="284" text-anchor="middle" font-size="14">Aₘ=2H²; Pₘ=4H</text><text x="180" y="311" text-anchor="middle" font-size="18" font-weight="bold" fill="#047857">Rₕ=H/2</text><text x="550" y="83" font-size="16" font-weight="bold" text-anchor="middle" fill="#b45309">Meio cheio: y=H/2</text><rect x="430" y="158" width="240" height="60" fill="#bfdbfe"/><path d="M430 98V218H670V98" stroke="#475569" stroke-width="3" fill="none"/><path d="M430 158V218H670V158" stroke="#d97706" stroke-width="5" fill="none"/><path d="M430 158H670" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/><path d="M415 98V218 M410 98h10 M410 218h10 M430 238H670 M430 233v10 M670 233v10" stroke="#64748b" stroke-width="1.4"/><text x="408" y="160" text-anchor="end" font-size="14">H</text><text x="550" y="258" text-anchor="middle" font-size="14">b=2H</text><text x="550" y="284" text-anchor="middle" font-size="14">Aₘ=H²; Pₘ=3H</text><text x="550" y="311" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">Rₕ=H/3</text><path d="M22 340h24" stroke="#d97706" stroke-width="5"/><text x="54" y="345" font-size="13">Perímetro molhado: fundo e laterais em contato com água</text><text x="22" y="374" font-size="14" font-weight="bold">Rₕ=by/(b+2y) • seção retangular ótima: b=2y; Rₕ=y/2.</text></g></svg>