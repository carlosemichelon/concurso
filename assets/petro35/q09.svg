<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460"><rect width="820" height="460" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="20" y="31" font-size="23" font-weight="bold">SPT — número mínimo de sondagens</text><text x="20" y="55" font-size="14">NBR 8036:1983 • usar projeção em planta da edificação</text><rect x="20" y="70" width="780" height="45" rx="4" fill="#ecfdf5"/><text x="32" y="98" font-size="17" font-weight="bold">Até 200 m²</text><text x="440" y="98" font-size="17">2</text><rect x="20" y="118" width="780" height="45" rx="4" fill="#f1f5f9"/><text x="32" y="146" font-size="17" font-weight="bold">Acima de 200 até 400 m²</text><text x="440" y="146" font-size="17">3</text><rect x="20" y="166" width="780" height="45" rx="4" fill="#dbeafe"/><text x="32" y="194" font-size="17" font-weight="bold">Acima de 400 até 1.200 m²</text><text x="440" y="194" font-size="17">⌈A/200⌉</text><rect x="20" y="214" width="780" height="45" rx="4" fill="#fef3c7"/><text x="32" y="242" font-size="17" font-weight="bold">Acima de 1.200 até 2.400 m²</text><text x="440" y="242" font-size="17">6 + ⌈(A−1.200)/400⌉</text><rect x="20" y="262" width="780" height="45" rx="4" fill="#ecfdf5"/><text x="32" y="290" font-size="17" font-weight="bold">Acima de 2.400 m²</text><text x="440" y="290" font-size="17">Plano particular</text><text x="20" y="329" font-size="18" font-weight="bold" fill="#047857">200→2 • 400→3 • 1.200→6 • 2.400→9</text><rect x="20" y="345" width="780" height="78" rx="6" fill="#e0f2fe"/><text x="32" y="369" font-size="16" font-weight="bold">Sem planta: mínimo 3 sondagens; máximo 100 m entre elas.</text><text x="32" y="393" font-size="15">Mais de 3 furos: não colocar todos no mesmo alinhamento.</text><text x="20" y="446" font-size="13">Arredondar para cima • 1.200 m² + excedente: começar com 6 furos.</text></g></svg>