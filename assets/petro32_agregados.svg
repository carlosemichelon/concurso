<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220"><rect width="600" height="220" fill="white"/><g font-family="Arial" text-anchor="middle" fill="#111"><text x="300" y="25" font-weight="bold" font-size="20">NBR 7211:2022 — agregados</text><rect x="38" y="55" width="258" height="74" fill="#dbeafe" stroke="#2563eb"/><rect x="296" y="55" width="266" height="74" fill="#dcfce7" stroke="#16a34a"/><text x="167" y="85" font-size="18" font-weight="bold">GRAÚDO</text><text x="167" y="110" font-size="14">Passa 75 / retém 4,75</text><text x="429" y="85" font-size="18" font-weight="bold">MIÚDO</text><text x="429" y="110" font-size="14">Passa 4,75 / retém 0,15</text><path d="M38 48V143M296 43V143M562 48V143" stroke="#334155" stroke-width="2"/><text x="38" y="163" font-size="15">75 mm</text><text x="296" y="163" font-size="17" font-weight="bold" fill="#b91c1c">4,75 mm</text><text x="562" y="163" font-size="15">150 µm</text><text x="300" y="192" font-size="14">4,75 mm é a peneira divisória.</text><text x="300" y="212" font-size="12">Esquema sem escala; observar limites das Tabelas 2 e 6.</text></g></svg>