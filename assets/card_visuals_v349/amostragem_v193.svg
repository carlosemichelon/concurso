<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Amostragem e redução representativa</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Amostragem e redução representativa</text><g font-size="15"><text x="160" y="65" text-anchor="middle" font-weight="bold">Coletar em posições distintas</text><path d="M35 220L160 80L285 220Z" fill="#e7d5b5" stroke="#94724c" stroke-width="2"/><circle cx="160" cy="112" r="12" fill="#2563eb"/><text x="160" y="117" text-anchor="middle" fill="white">1</text><circle cx="205" cy="164" r="12" fill="#2563eb"/><text x="205" y="169" text-anchor="middle" fill="white">2</text><circle cx="249" cy="204" r="12" fill="#2563eb"/><text x="249" y="209" text-anchor="middle" fill="white">3</text><path d="M300 150H365m-10 -7 10 7 -10 7" stroke="#475569" stroke-width="3" fill="none"/><text x="550" y="65" text-anchor="middle" font-weight="bold">Homogeneizar e quartear</text><path d="M550 88A80 80 0 0 1 630 168H550Z M550 248A80 80 0 0 1 470 168H550Z" fill="#99f6e4" stroke="#0d9488"/><path d="M550 88A80 80 0 0 0 470 168H550Z M550 248A80 80 0 0 0 630 168H550Z" fill="#e2e8f0" stroke="#64748b"/><text x="550" y="270" text-anchor="middle">Reter dois quadrantes opostos</text><text x="160" y="245" text-anchor="middle">Topo, meio e base (graúdo)</text><text x="380" y="309" text-anchor="middle" fill="#0f766e" font-weight="bold">Amostra de campo → redução representativa → amostra de ensaio</text><text x="380" y="335" text-anchor="middle">Não perder finos nem selecionar apenas grãos grandes.</text></g></g></svg>