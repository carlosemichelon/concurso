<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Molhamento: respostas diferentes do solo</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Molhamento: respostas diferentes do solo</text><g font-size="16"><text x="190" y="65" text-anchor="middle">Expansivo</text><text x="570" y="65" text-anchor="middle">Colapsível sob tensão</text><rect x="60" y="155" width="260" height="120" fill="#e7d5b5" stroke="#94724c"/><rect x="440" y="155" width="260" height="120" fill="#e7d5b5" stroke="#94724c"/><path d="M60 155H320M440 155H700" stroke="#64748b" stroke-dasharray="5 4"/><path d="M60 155Q190 90 320 155" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/><path d="M440 155Q570 220 700 155" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M190 146V100m-8 10 8 -10 8 10M570 160V205m-8 -10 8 10 8 -10" fill="none" stroke="#b45309" stroke-width="3"/><text x="190" y="300" text-anchor="middle" fill="#0f766e">Pode levantar</text><text x="570" y="300" text-anchor="middle" fill="#1d4ed8">Pode recalcar</text><text x="380" y="330" text-anchor="middle">Molhamento não determina uma resposta única; investigar o solo.</text></g></g></svg>