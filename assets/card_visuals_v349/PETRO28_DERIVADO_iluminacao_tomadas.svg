<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Tomadas × iluminação — NBR 5410"><title>Tomadas × iluminação — NBR 5410</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#53687B" stroke-width="1.2"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1" y="1" width="958" height="398" rx="15" fill="#F6F9FC" stroke="#D1DCE8" stroke-width="1.4"/><text x="34" y="38" font-size="27" font-weight="700" fill="#20354B" text-anchor="start">Tomadas × iluminação — NBR 5410</text><text x="34" y="65" font-size="16" font-weight="400" fill="#53687B" text-anchor="start">Exemplo: sala residencial de 24 m²; área e perímetro são grandezas diferentes.</text><line x1="34" y1="79" x2="926" y2="79" stroke="#D1DCE8" stroke-width="1"  /><rect x="32" y="98" width="285" height="240" rx="10" fill="white" stroke="#D1DCE8" stroke-width="1.4"/><text x="52" y="125" font-size="19" font-weight="700" fill="#2457A6" text-anchor="start">Sala: 4 × 6 m</text><rect x="80" y="152" width="174" height="116" rx="0" fill="#E7F0FF" stroke="#2457A6" stroke-width="2"/><text x="167" y="210" font-size="20" font-weight="700" fill="#2457A6" text-anchor="middle">A = 24 m²</text><text x="167" y="230" font-size="16" font-weight="400" fill="#53687B" text-anchor="middle">P = 20 m</text><circle cx="167" cy="152" r="7" fill="#0C826C" stroke="white" stroke-width="2"/><circle cx="254" cy="210" r="7" fill="#0C826C" stroke="white" stroke-width="2"/><circle cx="167" cy="268" r="7" fill="#0C826C" stroke="white" stroke-width="2"/><circle cx="80" cy="210" r="7" fill="#0C826C" stroke="white" stroke-width="2"/><text x="167" y="144" font-size="15" font-weight="400" fill="#53687B" text-anchor="middle">6 m</text><text x="63" y="213" font-size="15" font-weight="400" fill="#53687B" text-anchor="middle">4 m</text><text x="174" y="300" font-size="20" font-weight="700" fill="#0C826C" text-anchor="middle">4 pontos de tomada</text><text x="174" y="322" font-size="15" font-weight="400" fill="#53687B" text-anchor="middle">20 ÷ 5 = 4</text><rect x="333" y="98" width="595" height="240" rx="10" fill="white" stroke="#D1DCE8" stroke-width="1.4"/><text x="353" y="125" font-size="19" font-weight="700" fill="#2457A6" text-anchor="start">Carga de iluminação</text><text x="353" y="151" font-size="16" font-weight="400" fill="#53687B" text-anchor="start">100 VA + 60 VA por 4 m² inteiros</text><rect x="354" y="180" width="135.0" height="56" rx="3" fill="#2457A6" stroke="none" stroke-width="1.4"/><text x="421.5" y="205" font-size="16" font-weight="700" fill="white" text-anchor="middle">6 m²</text><text x="421.5" y="225" font-size="15" font-weight="400" fill="white" text-anchor="middle">100</text><rect x="492.0" y="180" width="89.0" height="56" rx="3" fill="#0C826C" stroke="none" stroke-width="1.4"/><text x="536.5" y="205" font-size="16" font-weight="700" fill="white" text-anchor="middle">4 m²</text><text x="536.5" y="225" font-size="15" font-weight="400" fill="white" text-anchor="middle">60</text><rect x="584.0" y="180" width="89.0" height="56" rx="3" fill="#0C826C" stroke="none" stroke-width="1.4"/><text x="628.5" y="205" font-size="16" font-weight="700" fill="white" text-anchor="middle">4 m²</text><text x="628.5" y="225" font-size="15" font-weight="400" fill="white" text-anchor="middle">60</text><rect x="676.0" y="180" width="89.0" height="56" rx="3" fill="#0C826C" stroke="none" stroke-width="1.4"/><text x="720.5" y="205" font-size="16" font-weight="700" fill="white" text-anchor="middle">4 m²</text><text x="720.5" y="225" font-size="15" font-weight="400" fill="white" text-anchor="middle">60</text><rect x="768.0" y="180" width="89.0" height="56" rx="3" fill="#0C826C" stroke="none" stroke-width="1.4"/><text x="812.5" y="205" font-size="16" font-weight="700" fill="white" text-anchor="middle">4 m²</text><text x="812.5" y="225" font-size="15" font-weight="400" fill="white" text-anchor="middle">60</text><rect x="860.0" y="180" width="43.0" height="56" rx="3" fill="#C5D1DC" stroke="none" stroke-width="1.4"/><text x="881.5" y="205" font-size="16" font-weight="700" fill="#20354B" text-anchor="middle">2 m²</text><text x="881.5" y="225" font-size="15" font-weight="400" fill="#20354B" text-anchor="middle">0</text><text x="353" y="261" font-size="14" font-weight="400" fill="#53687B" text-anchor="start">VA por bloco</text><text x="353" y="294" font-size="26" font-weight="700" fill="#0C826C" text-anchor="start">100 + 4 × 60 = 340 VA</text><text x="353" y="319" font-size="16" font-weight="400" fill="#53687B" text-anchor="start">Sobra de 2 m² não acrescenta potência.</text><line x1="34" y1="358" x2="926" y2="358" stroke="#D1DCE8" stroke-width="1"  /><text x="34" y="383" font-size="14" font-weight="400" fill="#53687B" text-anchor="start">NBR 5410:2004 vc2008, itens 9.5.2.1.2 e 9.5.2.2.1. Pontos indicativos, não projeto executivo.</text></g></svg>