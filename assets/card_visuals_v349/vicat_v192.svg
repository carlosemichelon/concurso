<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Consistência normal: distância da sonda à base</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Consistência normal: distância da sonda à base</text><path d="M75 275H370 M92 275V65H285" fill="none" stroke="#475569" stroke-width="8"/><rect x="245" y="63" width="24" height="157" rx="4" fill="#2563eb"/><path d="M150 142H345L329 275H166Z" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><rect x="245" y="125" width="24" height="126" rx="3" fill="#2563eb"/><path d="M277 251H319M277 275H319M310 251V275" stroke="#b45309" stroke-width="2"/><text x="326" y="267" font-size="17" fill="#b45309">6 ± 1 mm</text><text x="260" y="53" text-anchor="middle" font-size="15">Sonda de Tetmajer</text><text x="250" y="299" font-size="15" text-anchor="middle">Placa-base</text><text x="175" y="180" font-size="15" fill="#0f766e">Pasta</text><text x="469" y="90" font-size="17" font-weight="bold">Leitura após 30 s</text><g font-size="16"><text x="469" y="129" fill="#b45309">4 mm → penetrou demais</text><text x="469" y="167" fill="#0f766e">5–7 mm → faixa-alvo</text><text x="469" y="205" fill="#b45309">8 mm → penetrou pouco</text><text x="469" y="249">Medir a partir da base,</text><text x="469" y="273">não da superfície.</text></g><text x="380" y="337" text-anchor="middle" font-size="14">NBR 16606:2018 — esquema de leitura, sem escala.</text></g></svg>