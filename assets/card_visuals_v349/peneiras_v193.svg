<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Granulometria de agregados — séries e limites</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Granulometria de agregados — séries e limites</text><g font-size="16"><text x="40" y="66" fill="#1d4ed8" font-weight="bold">NORMAL · 10 peneiras · módulo de finura</text><text x="40" y="157" fill="#0f766e" font-weight="bold">INTERMEDIÁRIA · 6 peneiras · detalha a graduação</text></g><rect x="40" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="71.5" y="104" text-anchor="middle" font-size="14" fill="white">75</text><rect x="108" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="139.5" y="104" text-anchor="middle" font-size="14" fill="white">37,5</text><rect x="176" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="207.5" y="104" text-anchor="middle" font-size="14" fill="white">19</text><rect x="244" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="275.5" y="104" text-anchor="middle" font-size="14" fill="white">9,5</text><rect x="312" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="343.5" y="104" text-anchor="middle" font-size="14" fill="white">4,75</text><rect x="380" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="411.5" y="104" text-anchor="middle" font-size="14" fill="white">2,36</text><rect x="448" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="479.5" y="104" text-anchor="middle" font-size="14" fill="white">1,18</text><rect x="516" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="547.5" y="104" text-anchor="middle" font-size="14" fill="white">0,600</text><rect x="584" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="615.5" y="104" text-anchor="middle" font-size="14" fill="white">0,300</text><rect x="652" y="80" width="63" height="38" rx="4" fill="#2563eb"/><text x="683.5" y="104" text-anchor="middle" font-size="14" fill="white">0,150</text><rect x="40" y="171" width="63" height="38" rx="4" fill="#0d9488"/><text x="71.5" y="195" text-anchor="middle" font-size="14" fill="white">63</text><rect x="108" y="171" width="63" height="38" rx="4" fill="#0d9488"/><text x="139.5" y="195" text-anchor="middle" font-size="14" fill="white">50</text><rect x="176" y="171" width="63" height="38" rx="4" fill="#0d9488"/><text x="207.5" y="195" text-anchor="middle" font-size="14" fill="white">31,5</text><rect x="244" y="171" width="63" height="38" rx="4" fill="#0d9488"/><text x="275.5" y="195" text-anchor="middle" font-size="14" fill="white">25</text><rect x="312" y="171" width="63" height="38" rx="4" fill="#0d9488"/><text x="343.5" y="195" text-anchor="middle" font-size="14" fill="white">12,5</text><rect x="380" y="171" width="63" height="38" rx="4" fill="#0d9488"/><text x="411.5" y="195" text-anchor="middle" font-size="14" fill="white">6,3</text><text x="40" y="240" font-size="16">Aberturas em mm. Ambas as séries podem identificar DMC.</text><rect x="40" y="260" width="680" height="64" rx="6" fill="#fef3c7"/><text x="55" y="285" font-size="16" font-weight="bold" fill="#92400e">Massa retida máxima: abertura &lt; 4,75 mm → 7S kg</text><text x="55" y="309" font-size="16">Abertura ≥ 4,75 mm → 2,5aS kg (a em mm; S em m²)</text></g></svg>