<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Aterro de edificação — controle por camada</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" font-size="20" font-weight="bold" text-anchor="middle">Aterro de edificação — controle por camada</text><rect x="60" y="86" width="320" height="184" fill="#e2e8f0" stroke="#64748b"/><g stroke="#64748b" stroke-width="1.5"><rect x="60" y="86" width="320" height="61" fill="#ccfbf1"/><rect x="60" y="147" width="320" height="61" fill="#bfdbfe"/><rect x="60" y="208" width="320" height="62" fill="#ccfbf1"/></g><g font-size="16" text-anchor="middle"><text x="220" y="122">Camada 3</text><text x="220" y="184">Camada 2</text><text x="220" y="246">Camada 1</text></g><path d="M400 86V147M393 86H407M393 147H407" stroke="#475569"/><text x="414" y="120" font-size="15">≤ 30 cm</text><g font-size="17"><text x="455" y="177" fill="#0f766e">Umidade: wót ± 3 p.p.</text><text x="455" y="210" fill="#1d4ed8">GC ≥ 95%</text><text x="455" y="243">Solo apto</text><text x="455" y="275" font-size="14">Verificações independentes</text></g><text x="220" y="295" text-anchor="middle" font-size="15">Espessuras após compactação</text><text x="380" y="337" font-size="15" text-anchor="middle">NBR 5681:2015 estudada; projeto pode exigir limites mais restritivos.</text></g></svg>