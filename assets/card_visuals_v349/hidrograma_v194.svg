<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Hidrograma: pico, tempo e volume</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Hidrograma: pico, tempo e volume</text><g font-size="16"><path d="M90 275V65M90 275H690" stroke="#334155" stroke-width="2"/><path d="M90 275L300 95L650 275Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><path d="M90 95H300V275" stroke="#64748b" stroke-dasharray="5 5" fill="none"/><text x="65" y="100" text-anchor="end">Qp</text><text x="300" y="297" text-anchor="middle">Tp</text><text x="60" y="55">Q (m³/s)</text><text x="650" y="297" text-anchor="middle">4 h</text><text x="685" y="300">t</text><text x="330" y="225" text-anchor="middle" fill="#1d4ed8">Área = volume</text><text x="380" y="335" text-anchor="middle">Exemplo triangular: ½ × 4 × 3600 × 3 = 21.600 m³</text></g></g></svg>