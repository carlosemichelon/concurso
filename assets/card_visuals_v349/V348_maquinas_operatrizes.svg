<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<style>
  .t{font:700 43px Arial,Helvetica,sans-serif;fill:#22384D}.s{font:25px Arial,Helvetica,sans-serif;fill:#22384D}.h{font:700 31px Arial,Helvetica,sans-serif;fill:#22384D}.p{font:24px Arial,Helvetica,sans-serif;fill:#22384D}.m{font:21px Arial,Helvetica,sans-serif;fill:#22384D}.tiny{font:18px Arial,Helvetica,sans-serif;fill:#22384D}.line{fill:none;stroke:#22384D;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thick{fill:none;stroke:#22384D;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#22384D;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#22384D;stroke-width:2.3;stroke-dasharray:8 7}.cut{fill:#DDEBFB;stroke:#22384D;stroke-width:3}.arrow{fill:#22384D}
</style>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#22384D" /></marker>
<marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#22384D" /></marker></defs>
<rect width="1240" height="1754" fill="#F8FAFC" />
<text class="t" x="76" y="85" fill="#245FAD">MÁQUINAS E PROCESSOS DE USINAGEM</text>
<text class="s" x="76" y="135">PETROBRAS 27 • Identifique ferramenta e movimento principal de corte</text>
<path class="thick" d="M76 154H1164" />


<rect class="line" x="76" y="180" width="1088" height="340" rx="11" />
<text class="h" x="104" y="230" fill="#245FAD">1. FRESADORA — FRESAMENTO</text>
<text class="m" x="104" y="267">Ferramenta de vários gumes gira e remove cavacos.</text>

<rect class="cut" x="320" y="286" width="38" height="72" />
<path class="dash" d="M339 273v185" />

<circle class="thick" cx="339" cy="411" r="55" style="fill:#FBE7CF;stroke:#C45E15" fill="#FBE7CF" stroke="#C45E15" />
<circle class="thin" cx="339" cy="411" r="28" />
<g stroke="#22384D" stroke-width="5" stroke-linecap="round">
 <path d="M339 352v-10 M365 358l7-12 M386 377l13-7 M394 405h14 M387 438l11 8 M364 461l8 13 M339 469v13 M308 460l-7 13 M287 438l-12 8 M283 410h-14 M290 379l-13-9 M313 358l-7-12" />
</g>
<path class="line" d="M432 380A95 95 0 0 0 268 373" marker-end="url(#ar)" style="stroke:#087F83" stroke="#087F83" />
<text class="tiny" x="456" y="372">rotação da fresa</text>

<path class="cut" d="M182 477H497V505H182Z" />
<path class="thin" d="M352 464l18 -9 m-10 22l24 -15 m-36 7l-10-14" />
<path class="line" d="M639 416h135" marker-end="url(#ar)" style="stroke:#087F83" stroke="#087F83" />
<text class="p" x="645" y="386">Avanço relativo</text>
<text class="p" x="832" y="334">Exemplos:</text>
<text class="m" x="832" y="370">rasgos, planos,</text>
<text class="m" x="832" y="399">perfis e dentes</text>
<text class="m" x="832" y="428">de engrenagens</text>
<text class="tiny" x="176" y="461">peça</text>


<rect class="line" x="76" y="542" width="1088" height="340" rx="11" />
<text class="h" x="104" y="592" fill="#245FAD">2. PLAINA LIMADORA — APLAINAMENTO</text>
<text class="m" x="104" y="629">Ferramenta de um gume faz movimento retilíneo alternativo.</text>
<rect class="cut" x="195" y="760" width="390" height="65" />
<path class="thin" d="M195 760v65M215 760v65M235 760v65" />

<path class="cut" d="M340 686h31v51l14 16-44 7-1-74z" style="fill:#FBE7CF;stroke:#C45E15" fill="#FBE7CF" stroke="#C45E15" />
<path class="thick" d="M340 685l0 78" />
<path class="line" d="M254 673h240" marker-start="url(#arb)" marker-end="url(#ar)" style="stroke:#087F83" stroke="#087F83" />
<text class="tiny" x="282" y="661">vai e vem da ferramenta</text>
<path class="line" d="M612 786h125" marker-end="url(#ar)" style="stroke:#087F83" stroke="#087F83" />
<text class="p" x="627" y="751">avanço da peça</text>
<text class="p" x="822" y="701">Superfícies:</text>
<text class="m" x="822" y="736">planas, canais</text>
<text class="m" x="822" y="767">e rasgos retos</text>
<text class="tiny" x="205" y="847">peça fixada na mesa • avanço intermitente</text>


<rect class="line" x="76" y="905" width="1088" height="340" rx="11" />
<text class="h" x="104" y="955" fill="#245FAD">3. RETIFICADORA — RETIFICAÇÃO</text>
<text class="m" x="104" y="992">Rebolo abrasivo giratório remove finas camadas.</text>
<circle class="thick" cx="337" cy="1100" r="80" style="fill:#FBE7CF;stroke:#C45E15" fill="#FBE7CF" stroke="#C45E15" />
<circle class="thin" cx="337" cy="1100" r="35" />
<g stroke="#22384D" stroke-width="2">
  <path d="M337 1020v8M380 1032l-6 8 M412 1068l-8 3M416 1114l-8-2M397 1162l-6-7M349 1179l-1-8M301 1171l3-8M269 1138l9-4M257 1094l8 0M279 1047l7 8" />
</g>
<path class="line" d="M468 1070A138 138 0 0 0 235 1011" marker-end="url(#ar)" style="stroke:#087F83" stroke="#087F83" />
<path class="cut" d="M200 1180H480V1212H200Z" />
<path class="thin" d="M300 1174l6 -11M329 1174l7 -13M348 1174l8 -10" />
<text class="tiny" x="508" y="1125">rotação do rebolo</text>
<text class="p" x="797" y="1049">Aplicações:</text>
<text class="m" x="797" y="1087">acabamento fino,</text>
<text class="m" x="797" y="1120">precisão dimensional</text>
<text class="m" x="797" y="1154">e tolerâncias estreitas</text>


<rect class="line" x="76" y="1266" width="1088" height="280" rx="11" />
<text class="h" x="104" y="1314" fill="#754DA4" style="fill:#754DA4">4. PRENSA — CONFORMAÇÃO (NÃO USINAGEM TÍPICA)</text>
<text class="m" x="104" y="1350">Força sobre o material: dobramento, estampagem, repuxo.</text>

<g transform="translate(0 21)">
<path class="cut" d="M200 1470h112v-20h78v20h115v34H200Z" />
<path class="cut" d="M324 1380h58v69h-58z" style="fill:#FBE7CF;stroke:#C45E15" fill="#FBE7CF" stroke="#C45E15" />
<path class="thick" d="M353 1356v28" marker-end="url(#ar)" style="stroke:#087F83" stroke="#087F83" />
<path class="line" d="M257 1447h184" />
<path class="thin" d="M257 1447l-7 4m192-4l7 4" />
</g>
<text class="p" x="582" y="1440">Deforma a peça;</text>
<text class="p" x="582" y="1473">não define remoção de cavacos.</text>
<text class="tiny" x="870" y="1502">Permutador: troca calor.</text>

<path class="thick" d="M76 1580H1164" />
<text class="h" x="76" y="1633" fill="#245FAD">REGRA PARA A PROVA</text>
<text class="p" x="76" y="1677">FRESA GIRA • PLAINA VAI E VOLTA • RETÍFICA USA REBOLO</text>
<text class="m" x="76" y="1714">Alternativa D • Esquema vetorial didático (não representa máquinas em escala).</text>
</svg>
