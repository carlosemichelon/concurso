<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Resistência elétrica dos condutores"><title>Resistência elétrica dos condutores</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#53687B" stroke-width="1.2"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1" y="1" width="958" height="398" rx="15" fill="#F6F9FC" stroke="#D1DCE8" stroke-width="1.4"/><text x="34" y="38" font-size="27" font-weight="700" fill="#20354B" text-anchor="start">Resistência elétrica dos condutores</text><text x="34" y="65" font-size="16" font-weight="400" fill="#53687B" text-anchor="start">Segunda lei de Ohm — condutor homogêneo, seção constante.</text><line x1="34" y1="79" x2="926" y2="79" stroke="#D1DCE8" stroke-width="1"  /><rect x="32" y="98" width="440" height="240" rx="10" fill="white" stroke="#D1DCE8" stroke-width="1.4"/><rect x="487" y="98" width="440" height="240" rx="10" fill="white" stroke="#D1DCE8" stroke-width="1.4"/><text x="52" y="125" font-size="20" font-weight="700" fill="#2457A6" text-anchor="start">Comprimento L</text><text x="507" y="125" font-size="20" font-weight="700" fill="#0C826C" text-anchor="start">Área da seção A</text><text x="52" y="149" font-size="15" font-weight="400" fill="#53687B" text-anchor="start">Mesmo material, seção e temperatura</text><text x="507" y="149" font-size="15" font-weight="400" fill="#53687B" text-anchor="start">Mesmo material, comprimento e temperatura</text><rect x="55" y="177" width="160" height="25" rx="4" fill="#5A91D8" stroke="#2457A6" stroke-width="1.4"/><text x="228" y="195" font-size="16" font-weight="700" fill="#2457A6" text-anchor="start">L → R</text><rect x="55" y="245" width="320" height="25" rx="4" fill="#5A91D8" stroke="#2457A6" stroke-width="1.4"/><text x="388" y="263" font-size="16" font-weight="700" fill="#2457A6" text-anchor="start">2L → 2R</text><rect x="509" y="175" width="207" height="22" rx="4" fill="#39AB91" stroke="#0C826C" stroke-width="1.4"/><text x="734" y="191.0" font-size="18" font-weight="700" fill="#0C826C" text-anchor="start">A → R</text><rect x="509" y="242" width="207" height="44" rx="4" fill="#39AB91" stroke="#0C826C" stroke-width="1.4"/><text x="734" y="269.0" font-size="18" font-weight="700" fill="#0C826C" text-anchor="start">2A → R/2</text><text x="52" y="314" font-size="25" font-weight="700" fill="#20354B" text-anchor="start">R = ρL / A</text><text x="507" y="314" font-size="19" font-weight="700" fill="#0C826C" text-anchor="start">Área maior → resistência menor</text><line x1="34" y1="358" x2="926" y2="358" stroke="#D1DCE8" stroke-width="1"  /><text x="34" y="383" font-size="14" font-weight="400" fill="#53687B" text-anchor="start">R [Ω]; ρ [Ω·m]; L [m]; A [m²]. Para metais, a resistividade geralmente aumenta com a temperatura.</text></g></svg>