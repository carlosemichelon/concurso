t="400">D₂ = 0,30 m</text><text x="610" y="127" font-family="Arial,sans-serif" font-size="16" fill="#233b4b" text-anchor="start" font-weight="400">Maior diâmetro:</text><text x="610" y="156" font-family="Arial,sans-serif" font-size="20" fill="#087f8c" text-anchor="start" font-weight="700">D = 0,30 m</text><text x="610" y="188" font-family="Arial,sans-serif" font-size="20" fill="#233b4b" text-anchor="start" font-weight="400">5D = 1,50 m</text><text x="610" y="225" font-family="Arial,sans-serif" font-size="18" fill="#b91c1c" text-anchor="start" font-weight="700">1,20 &lt; 1,50 m</text><line x1="100" y1="330" x2="790" y2="330" stroke="#64748b" stroke-width="2" /><circle cx="170" cy="330" r="7" fill="#2563a6" stroke="#233b4b" stroke-width="1.5"/><circle cx="730" cy="330" r="7" fill="#087f8c" stroke="#233b4b" stroke-width="1.5"/><text x="170" y="309" font-family="Arial,sans-serif" font-size="16" fill="#2563a6" text-anchor="middle" font-weight="400">Primeira estaca</text><text x="730" y="309" font-family="Arial,sans-serif" font-size="16" fill="#087f8c" text-anchor="middle" font-weight="400">Segunda estaca</text><text x="450" y="360" font-family="Arial,sans-serif" font-size="21" fill="#087f8c" text-anchor="middle" font-weight="700">Intervalo ≥ 12 h</text></svg>