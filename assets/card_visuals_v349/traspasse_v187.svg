<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Uma emenda ≠ duas emendas"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0e7490"/></marker></defs><rect width="900" height="400" rx="15" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172554"><text x="32" y="36" font-size="22" font-weight="bold">Uma emenda ≠ duas emendas</text><text x="32" y="63" font-size="15" fill="#475569">Esquema sem escala: comprimento individual e afastamento longitudinal x.</text><rect x="40" y="98" width="820" height="210" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><rect x="160" y="115" width="240" height="150" fill="#dbeafe" opacity=".9"/><rect x="490" y="115" width="240" height="150" fill="#ccfbf1" opacity=".9"/><g stroke-linecap="round" stroke-width="10"><path d="M58 148H400" stroke="#2563eb"/><path d="M160 178H845" stroke="#0e7490"/><path d="M58 228H730" stroke="#2563eb"/><path d="M490 258H845" stroke="#0e7490"/></g><g stroke="#64748b" stroke-dasharray="5 4"><path d="M160 112v181M400 112v181M490 112v181M730 112v181"/></g><g stroke="#0e7490" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M160 287H400"/><path d="M400 287H490"/><path d="M490 287H730"/></g><g font-size="17"><text x="226" y="136">Emenda 1</text><text x="557" y="216">Emenda 2</text><text x="240" y="325">ℓ₀₁ = 80 cm</text><text x="430" y="325">x</text><text x="563" y="325">ℓ₀₂ = 80 cm</text><text x="40" y="374" font-size="20">Mesma seção se x &lt; 0,20 × 80 = 16 cm (sem sobreposição).</text></g></g></svg>