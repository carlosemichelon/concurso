<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Curva de carga de 24 horas</title><desc id="desc">Oito intervalos de 3 horas com demandas 20, 40, 60, 40, 80, 60, 40 e 20 kW. Média 45 kW, máxima 80 kW; energia 1080 kWh, fator 56,25%.</desc><rect width="760" height="390" fill="white"/><g font-family="Arial,sans-serif" fill="#18384b"><text x="26" y="29" font-size="23" font-weight="600">Curva de carga: média e pico</text><text x="26" y="53" font-size="15" fill="#526677">Exemplo ilustrativo · 24 h, intervalos de 3 h</text><rect x="78" y="91" width="624" height="204" fill="#f8fafc"/><line x1="78" y1="295.0" x2="702" y2="295.0" stroke="#dbe5ec"/><text x="64" y="300.0" font-size="15" text-anchor="end">0</text><line x1="78" y1="244.0" x2="702" y2="244.0" stroke="#dbe5ec"/><text x="64" y="249.0" font-size="15" text-anchor="end">20</text><line x1="78" y1="193.0" x2="702" y2="193.0" stroke="#dbe5ec"/><text x="64" y="198.0" font-size="15" text-anchor="end">40</text><line x1="78" y1="142.0" x2="702" y2="142.0" stroke="#dbe5ec"/><text x="64" y="147.0" font-size="15" text-anchor="end">60</text><line x1="78" y1="91.0" x2="702" y2="91.0" stroke="#dbe5ec"/><text x="64" y="96.0" font-size="15" text-anchor="end">80</text><line x1="78" y1="295" x2="78" y2="301" stroke="#32485c"/><text x="78" y="321" text-anchor="middle" font-size="15">0</text><line x1="234" y1="295" x2="234" y2="301" stroke="#32485c"/><text x="234" y="321" text-anchor="middle" font-size="15">6</text><line x1="390" y1="295" x2="390" y2="301" stroke="#32485c"/><text x="390" y="321" text-anchor="middle" font-size="15">12</text><line x1="546" y1="295" x2="546" y2="301" stroke="#32485c"/><text x="546" y="321" text-anchor="middle" font-size="15">18</text><line x1="702" y1="295" x2="702" y2="301" stroke="#32485c"/><text x="702" y="321" text-anchor="middle" font-size="15">24</text><path d="M 78 244.0 H 156 V 193.0 H 234 V 142.0 H 312 V 193.0 H 390 V 91.0 H 4