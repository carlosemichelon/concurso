<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Pré-tração e pós-tração — transferência de força</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="29" text-anchor="middle" font-size="20" font-weight="bold">Pré-tração e pós-tração — transferência de força</text><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b45309"/></marker></defs><text x="190" y="63" font-size="17" text-anchor="middle">Pré-tração</text><text x="570" y="63" font-size="17" text-anchor="middle">Pós-tração</text><path d="M55 85V142M325 85V142" stroke="#64748b" stroke-width="10"/><path d="M60 112H320" stroke="#2563eb" stroke-width="6"/><path d="M95 100H62M285 100H318" stroke="#b45309" stroke-width="3" marker-end="url(#ar)"/><text x="190" y="165" text-anchor="middle" font-size="14">Estira o aço antes de concretar</text><rect x="70" y="201" width="240" height="65" rx="3" fill="#ccfbf1" stroke="#0d9488"/><path d="M78 234H302" stroke="#2563eb" stroke-width="5"/><path d="M102 215H160M278 215H220" stroke="#0d9488" stroke-width="4"/><text x="190" y="289" text-anchor="middle" font-size="14">Libera: força por aderência</text><rect x="445" y="83" width="250" height="60" rx="3" fill="#e2e8f0" stroke="#64748b"/><path d="M452 113H690" stroke="#2563eb" stroke-width="5"/><rect x="686" y="96" width="12" height="34" fill="#475569"/><path d="M699 113H735" stroke="#b45309" stroke-width="3" marker-end="url(#ar)"/><text x="570" y="165" text-anchor="middle" font-size="14">Concreto endurecido; macaco traciona</text><rect x="445" y="201" width="250" height="65" rx="3" fill="#ccfbf1" stroke="#0d9488"/><path d="M452 234H688" stroke="#2563eb" stroke-width="5"/><path d="M453 210V258M687 210V258" stroke="#475569" stroke-width="6"/><path d="M470 217H530M670 217H610" stroke="#0d9488" stroke-width="4"/><text x="570" y="289" text-anchor="middle" font-size="14">Ancoragens transferem compressão</text><path d="M380 48V309" stroke="#cbd5e1"/><text x="380" y="337" text-anchor="middle" font-size="15">Azul: aço ativo tracionado • verde: concreto comprimido</text></g></svg>