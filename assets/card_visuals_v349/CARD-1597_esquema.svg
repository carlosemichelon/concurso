<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="SAW: arco submerso em fluxo granular"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker><pattern id="soil" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#d8c5a7" stroke-width="1"/></pattern></defs><rect width="900" height="420" fill="#fff"/><text x="30" y="35" font-family="Arial,sans-serif" font-size="23" fill="#233b4b" text-anchor="start" font-weight="700">SAW: arco submerso em fluxo granular</text><text x="30" y="61" font-family="Arial,sans-serif" font-size="15" fill="#64748b" text-anchor="start" font-weight="400">Corte funcional: eletrodo consumível, arco, fluxo e poça de fusão.</text><rect x="45" y="275" width="810" height="85" rx="0" fill="#b3c4d1" stroke="#64748b" stroke-width="1.5"/><path d="M330 275 Q450 235 570 275 Q450 322 330 275 Z" stroke="#b91c1c" stroke-width="2" fill="#fecaca" /><path d="M340 265 Q450 220 560 265 L575 275 Q450 245 325 275 Z" stroke="#b45309" stroke-width="2" fill="#c8a77a" /><path d="M235 275 L300 178 Q450 145 600 178 L665 275 L575 275 L560 265 Q450 220 340 265 L325 275 Z" stroke="#64748b" stroke-width="2" fill="#fef3c7" /><line x1="450" y1="83" x2="450" y2="232" stroke="#233b4b" stroke-width="8" /><path d="M450 232 L435 245 L462 255 L445 268" stroke="#2563a6" stroke-width="4" fill="none" /><circle cx="450" cy="232" r="5" fill="#b45309" stroke="#233b4b" stroke-width="1.5"/><line x1="300" y1="190" x2="185" y2="125" stroke="#b45309" stroke-width="2" /><text x="55" y="117" font-family="Arial,sans-serif" font-size="18" fill="#b45309" text-anchor="start" font-weight="700">Fluxo granular</text><text x="55" y="138" font-family="Arial,sans-serif" font-size="16" fill="#b45309" text-anchor="start" font-weight="400">externo</text><line x1="455" y1="110" x2="620" y2="100" stroke="#233b4b" stroke-width="2" /><text x="625" y="98" font-family="Arial,sans-serif" font-size="18" fill="#233b4b" text-anchor="start" font-weight="700">Arame contínuo</text><line x1="460" y1="251" x2="675" y2="190" stroke="#2563a6" stroke-width="2" /><text x="680" y="186" font-family="Arial,sans-serif" font-size="18" fill="#2563a6" text-anchor="start" font-weight="700">Arco coberto</text><line x1="555" y1="261" x2="690" y2="235" stroke="#b45309" stroke-width="2" /><text x="695" y="233" font-family="Arial,sans-serif" font-size="16" fill="#b45309" text-anchor="start" font-weight="400">Escória</text><text x="450" y="342" font-family="Arial,sans-serif" font-size="19" fill="#233b4b" text-anchor="middle" font-weight="400">Metal-base</text><line x1="160" y1="290" x2="330" y2="282" stroke="#b91c1c" stroke-width="2" /><text x="65" y="288" font-family="Arial,sans-serif" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="400">Poça</text><text x="450" y="395" font-family="Arial,sans-serif" font-size="17" fill="#233b4b" text-anchor="middle" font-weight="400">Não é proteção por gás externo como MIG/MAG.</text></svg>