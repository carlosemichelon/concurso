<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-label="Corte de laje nervurada com espaçamento entre eixos, largura média da nervura e espessura da mesa"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#075985"/></marker></defs><rect width="780" height="330" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="32" y="34" font-size="22" font-weight="bold">Laje nervurada — corte esquemático</text><text x="32" y="60" font-size="15">Eixos das nervuras ≠ distância livre entre faces</text><path d="M68 105H712V145H638V253H574V145H422V253H358V145H206V253H142V145H68Z" fill="#cbd5e1" stroke="#475569" stroke-width="2.5"/><path d="M68 105H712V145H68Z" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/><g stroke="#0f766e" stroke-dasharray="7 5" stroke-width="2"><path d="M174 81V285"/><path d="M390 81V285"/><path d="M606 81V285"/></g><g stroke="#075985" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"><path d="M174 280H390"/><path d="M358 238H422"/><path d="M739 105V145"/></g><g fill="#075985" font-size="16" font-weight="bold"><text x="282" y="304" text-anchor="middle">e (entre eixos)</text><text x="390" y="225" text-anchor="middle">b</text><text x="746" y="129">t</text></g><g font-size="16"><text x="282" y="128" text-anchor="middle" fill="#1e40af">mesa</text><text x="494" y="190" text-anchor="middle" fill="#334155">vão livre</text><text x="620" y="270" text-anchor="middle" fill="#0f766e">eixo</text><text x="68" y="320" font-size="13" fill="#475569">b = largura da nervura no corte de seção constante; t = espessura da mesa. Sem escala.</text></g></g></svg>