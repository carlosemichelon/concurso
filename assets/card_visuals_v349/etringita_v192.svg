<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Etringita: distinguir mecanismos</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Etringita: distinguir mecanismos</text><g font-size="15"><rect x="25" y="63" width="710" height="72" rx="8" fill="#ccfbf1" stroke="#0d9488"/><text x="45" y="88" font-weight="bold" fill="#0f766e">Hidratação inicial normal</text><text x="45" y="116">C₃A + sulfato + água → etringita inicial; controle da pega</text><rect x="25" y="149" width="710" height="72" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="45" y="174" font-weight="bold" fill="#92400e">DEF — formação tardia</text><text x="45" y="202">Histórico térmico elevado + umidade posterior → possível expansão</text><rect x="25" y="235" width="710" height="72" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="45" y="260" font-weight="bold" fill="#1d4ed8">Ataque externo por sulfatos</text><text x="45" y="288">Sulfatos do ambiente → produtos secundários; possível deterioração</text><text x="380" y="338" text-anchor="middle" font-weight="bold">DRX + MEV-EDS + histórico e exposição; presença isolada não diagnostica.</text></g></g></svg>