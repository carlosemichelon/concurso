<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Queda de tensão: percurso global e terminal</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Queda de tensão: percurso global e terminal</text><g font-size="16"><rect x="35" y="90" width="125" height="76" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="97" y="120" text-anchor="middle">Origem</text><text x="97" y="143" text-anchor="middle">definida</text><rect x="306" y="90" width="115" height="76" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="363" y="135" text-anchor="middle">Quadro</text><rect x="605" y="90" width="115" height="76" rx="5" fill="#ccfbf1" stroke="#0d9488"/><text x="662" y="135" text-anchor="middle">Carga</text><path d="M160 128H306M421 128H605" stroke="#334155" stroke-width="4"/><path d="M363 187V210H662V187" fill="none" stroke="#0d9488" stroke-width="3"/><text x="512" y="236" text-anchor="middle" fill="#0f766e">Terminal ≤ 4%</text><path d="M97 252V275H662V252" stroke="#2563eb" stroke-width="3" fill="none"/><text x="380" y="300" text-anchor="middle" fill="#1d4ed8">Global: 5% ou 7%, conforme origem normativa</text><text x="380" y="333" text-anchor="middle">Limites simultâneos — não somar 4% ao global.</text></g></g></svg>