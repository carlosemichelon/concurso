<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Massa unitária versus massa específica</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Massa unitária versus massa específica</text><g font-size="16"><text x="180" y="65" text-anchor="middle" font-weight="bold">Massa unitária: recipiente</text><rect x="65" y="85" width="230" height="175" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="90" cy="108" r="17" fill="#94724c"/><circle cx="133" cy="108" r="17" fill="#94724c"/><circle cx="176" cy="108" r="17" fill="#94724c"/><circle cx="219" cy="108" r="17" fill="#94724c"/><circle cx="262" cy="108" r="17" fill="#94724c"/><circle cx="98" cy="150" r="17" fill="#94724c"/><circle cx="141" cy="150" r="17" fill="#94724c"/><circle cx="184" cy="150" r="17" fill="#94724c"/><circle cx="227" cy="150" r="17" fill="#94724c"/><circle cx="270" cy="150" r="17" fill="#94724c"/><circle cx="90" cy="192" r="17" fill="#94724c"/><circle cx="133" cy="192" r="17" fill="#94724c"/><circle cx="176" cy="192" r="17" fill="#94724c"/><circle cx="219" cy="192" r="17" fill="#94724c"/><circle cx="262" cy="192" r="17" fill="#94724c"/><circle cx="98" cy="234" r="17" fill="#94724c"/><circle cx="141" cy="234" r="17" fill="#94724c"/><circle cx="184" cy="234" r="17" fill="#94724c"/><circle cx="227" cy="234" r="17" fill="#94724c"/><circle cx="270" cy="234" r="17" fill="#94724c"/><text x="180" y="285" text-anchor="middle">V inclui vazios entre grãos</text><text x="560" y="65" text-anchor="middle" font-weight="bold">Massa específica: partículas</text><circle cx="560" cy="170" r="72" fill="#e7d5b5" stroke="#94724c" stroke-width="2"/><text x="560" y="175" text-anchor="middle">V dos grãos</text><text x="560" y="285" text-anchor="middle">Conforme método de ensaio</text><text x="380" y="319" font-weight="bold" text-anchor="middle" fill="#0f766e">Vazios (%) = 100 × (1 − ρunit / ρgrãos)</text><text x="380" y="342" text-anchor="middle" font-size="14">Bases secas compatíveis; não confundir com índice de vazios e.</text></g></g></svg>