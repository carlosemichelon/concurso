<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="Recalques: movimento absoluto e relativo"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker><pattern id="soil" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#d8c5a7" stroke-width="1"/></pattern></defs><rect width="900" height="390" fill="#fff"/><text x="30" y="35" font-family="Arial,sans-serif" font-size="23" fill="#233b4b" text-anchor="start" font-weight="700">Recalques: movimento absoluto e relativo</text><text x="30" y="61" font-family="Arial,sans-serif" font-size="15" fill="#64748b" text-anchor="start" font-weight="400">Esquema qualitativo para a convenção de símbolos da questão estudada.</text><text x="40" y="105" font-family="Arial,sans-serif" font-size="18" fill="#233b4b" text-anchor="start" font-weight="700">Perfil com recalques</text><line x1="90" y1="140" x2="810" y2="140" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" /><text x="95" y="128" font-family="Arial,sans-serif" font-size="15" fill="#64748b" text-anchor="start" font-weight="400">Nível inicial</text><path d="M100 170 L330 254 L570 225 L800 210" stroke="#2563a6" stroke-width="4" fill="none" /><line x1="100" y1="170" x2="800" y2="210" stroke="#087f8c" stroke-width="2" stroke-dasharray="7 5" /><text x="635" y="184" font-family="Arial,sans-serif" font-size="15" fill="#087f8c" text-anchor="start" font-weight="400">corda AD (ω)</text><line x1="330" y1="140" x2="330" y2="254" stroke="#b45309" stroke-width="2" marker-end="url(#arr)" /><text x="342" y="191" font-family="Arial,sans-serif" font-size="17" fill="#b45309" text-anchor="start" font-weight="400">sB</text><line x1="330" y1="183" x2="330" y2="254" stroke="#b91c1c" stroke-width="3" /><text x="347" y="234" font-family="Arial,sans-serif" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="400">ΔB</text><line x1="100" y1="170" x2="330" y2="170" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4" /><text x="205" y="192" font-family="Arial,sans-serif" font-size="16" fill="#2563a6" text-anchor="start" font-weight="400">θAB</text><text x="344" y="274" font-family="Arial,sans-serif" font-size="16" fill="#233b4b" text-anchor="start" font-weight="400">mudança de inclinação α</text><text x="95" y="325" font-family="Arial,sans-serif" font-size="20" fill="#087f8c" text-anchor="start" font-weight="700">βAB ≈ θAB − ω</text><text x="95" y="354" font-family="Arial,sans-serif" font-size="20" fill="#b45309" text-anchor="start" font-weight="400">δsAB = |sB − sA|</text><text x="490" y="326" font-family="Arial,sans-serif" font-size="18" fill="#b91c1c" text-anchor="start" font-weight="400">Δ: distância à corda</text><text x="490" y="355" font-family="Arial,sans-serif" font-size="16" fill="#233b4b" text-anchor="start" font-weight="400">s: deslocamento desde o nível inicial</text><circle cx="100" cy="170" r="5" fill="#fff" stroke="#2563a6" stroke-width="1.5"/><text x="100" y="193" font-family="Arial,sans-serif" font-size="15" fill="#2563a6" text-anchor="middle" font-weight="400">A</text><circle cx="330" cy="254" r="5" fill="#fff" stroke="#2563a6" stroke-width="1.5"/><text x="330" y="277" font-family="Arial,sans-serif" font-size="15" fill="#2563a6" text-anchor="middle" font-weight="400">B</text><circle cx="570" cy="225" r="5" fill="#fff" stroke="#2563a6" stroke-width="1.5"/><text x="570" y="248" font-family="Arial,sans-serif" font-size="15" fill="#2563a6" text-anchor="middle" font-weight="400">C</text><circle cx="800" cy="210" r="5" fill="#fff" stroke="#2563a6" stroke-width="1.5"/><text x="800" y="233" font-family="Arial,sans-serif" font-size="15" fill="#2563a6" text-anchor="middle" font-weight="400">D</text></svg>