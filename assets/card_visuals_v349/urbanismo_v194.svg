<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>IA, TO e TP: exemplo de lote de 400 m²</title><rect width="760" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172554"><text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">IA, TO e TP: exemplo de lote de 400 m²</text><g font-size="16"><rect x="42" y="70" width="280" height="224" fill="#e2e8f0" stroke="#64748b"/><rect x="42" y="70" width="56" height="224" fill="#99f6e4" stroke="#0d9488"/><rect x="130" y="125" width="125" height="157" fill="#bfdbfe" stroke="#2563eb"/><text x="192" y="198" text-anchor="middle">125 m²</text><text x="70" y="182" text-anchor="middle" transform="rotate(-90 70 182)">80 m² permeáveis</text><text x="182" y="320" text-anchor="middle">Planta ilustrativa</text><g stroke="#2563eb" fill="#bfdbfe"><rect x="460" y="72" width="178" height="15" rx="2"/><rect x="460" y="95" width="178" height="15" rx="2"/><rect x="460" y="118" width="178" height="15" rx="2"/><rect x="460" y="141" width="178" height="15" rx="2"/><rect x="460" y="164" width="178" height="15" rx="2"/><rect x="460" y="187" width="178" height="15" rx="2"/><rect x="460" y="210" width="178" height="15" rx="2"/><rect x="460" y="233" width="178" height="15" rx="2"/></g><text x="549" y="276" text-anchor="middle">8 lajes × 125 = 1.000 m²</text><text x="549" y="304" text-anchor="middle">TO permite até 240 m²</text><text x="380" y="346" text-anchor="middle">195 m² externos impermeáveis somente na hipótese ilustrada.</text></g></g></svg>