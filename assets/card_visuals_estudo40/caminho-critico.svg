<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330"><title>Rede CPM — caminho crítico e folgas</title><rect width="760" height="330" fill="white"/><g font-family="Arial,sans-serif" fill="#243447" text-anchor="middle"><text x="380" y="28" font-size="23" font-weight="bold">Rede CPM — caminho crítico e folgas</text><g stroke="#b91c1c" stroke-width="4" fill="none"><path d="M100 143L150 85H160 M270 85H320 M430 85L485 143H500 M610 143H660"/><path d="M151 80l9 5-9 5 M311 80l9 5-9 5 M491 138l9 5-9 5 M651 138l9 5-9 5"/></g><g stroke="#2563eb" stroke-width="3" fill="none"><path d="M100 143L150 231H320 M430 231L485 143H500"/><path d="M311 226l9 5-9 5"/></g><g stroke="#b91c1c" stroke-width="2" fill="#fee2e2"><rect x="160" y="55" width="110" height="60" rx="6"/><rect x="320" y="55" width="110" height="60" rx="6"/><rect x="500" y="113" width="110" height="60" rx="6"/></g><rect x="320" y="201" width="110" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><g font-size="19" font-weight="bold"><text x="215" y="79">A · 3 d</text><text x="375" y="79">B · 4 d</text><text x="555" y="137">C · 2 d</text><text x="375" y="225">D · 5 d</text></g><g font-size="15"><text x="215" y="100">0 → 3</text><text x="375" y="100">3 → 7</text><text x="555" y="158">7 → 9</text><text x="375" y="246">0 → 5 · FT=2</text></g><circle cx="66" cy="143" r="34" fill="#f1f5f9" stroke="#475569"/><circle cx="694" cy="143" r="34" fill="#f1f5f9" stroke="#475569"/><text x="66" y="139" font-size="14">Início</text><text x="66" y="157" font-size="15">0 d</text><text x="694" y="139" font-size="14">Fim</text><text x="694" y="157" font-size="15">9 d</text><text x="380" y="291" font-size="18" fill="#b91c1c" font-weight="bold">A + B + C = 9 dias (crítico)</text><text x="380" y="315" font-size="16" fill="#2563eb">D + C = 7 dias; D pode atrasar 2 dias sem mudar o fim.</text></g></svg>