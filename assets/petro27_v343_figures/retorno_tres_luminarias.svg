<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700">
<rect width="1120" height="700" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#111">
<text x="560" y="49" text-anchor="middle" font-size="27" font-weight="700">COMANDO DE TRÊS PONTOS DE LUZ POR DOIS LOCAIS</text>
<text x="560" y="83" text-anchor="middle" font-size="17">Esquema funcional — circuitos em paralelo, retorno comum</text>
</g>
<g stroke="#111" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <rect x="135" y="149" width="120" height="134" rx="6" stroke-width="2"/>
  <rect x="432" y="149" width="120" height="134" rx="6" stroke-width="2"/>
  <!-- phase to common of first SPDT -->
  <path d="M45 218 H171"/>
  <path d="M171 218 L235 181"/>
  <circle cx="171" cy="218" r="5" fill="#111"/>
  <circle cx="236" cy="181" r="5" fill="#111"/>
  <circle cx="236" cy="253" r="5" fill="white"/>
  <!-- travelers -->
  <path d="M236 181 H449"/>
  <path d="M236 253 H449"/>
  <!-- common second SPDT -->
  <circle cx="449" cy="181" r="5" fill="#111"/>
  <circle cx="449" cy="253" r="5" fill="white"/>
  <path d="M449 181 L520 218"/>
  <circle cx="520" cy="218" r="5" fill="#111"/>
  <!-- switched live R from common to all three loads -->
  <path d="M520 218 H600 V354 H1040"/>
  <!-- lamp 1,2,3 parallel branches -->
  <path d="M686 354 V384 M686 430 V483"/>
  <path d="M846 354 V384 M846 430 V483"/>
  <path d="M1006 354 V384 M1006 430 V483"/>
  <circle cx="686" cy="407" r="23" stroke-width="2.3"/>
  <circle cx="846" cy="407" r="23" stroke-width="2.3"/>
  <circle cx="1006" cy="407" r="23" stroke-width="2.3"/>
  <path d="M670 391 L702 423 M702 391 L670 423 M830 391 L862 423 M862 391 L830 423 M990 391 L1022 423 M1022 391 L990 423" stroke-width="2"/>
  <!-- neutral trunk -->
  <path d="M45 483 H1065"/>
  <circle cx="686" cy="354" r="4.6" fill="#111"/>
  <circle cx="846" cy="354" r="4.6" fill="#111"/>
  <circle cx="1006" cy="354" r="4.6" fill="#111"/>
  <circle cx="686" cy="483" r="4.6" fill="#111"/>
  <circle cx="846" cy="483" r="4.6" fill="#111"/>
  <circle cx="1006" cy="483" r="4.6" fill="#111"/>
</g>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#111">
  <text x="48" y="203" font-size="20" font-weight="700">F</text>
  <text x="190" y="129" font-size="18" font-weight="700" text-anchor="middle">S1</text>
  <text x="491" y="129" font-size="18" font-weight="700" text-anchor="middle">S2</text>
  <text x="194" y="304" text-anchor="middle" font-size="15">Three-way</text>
  <text x="491" y="304" text-anchor="middle" font-size="15">Three-way</text>
  <text x="339" y="165" text-anchor="middle" font-size="15">Viajante V1</text>
  <text x="339" y="274" text-anchor="middle" font-size="15">Viajante V2</text>
  <text x="614" y="336" font-size="19" font-weight="700">R</text>
  <text x="745" y="332" font-size="16" font-weight="700">RETORNO COMUM</text>
  <text x="686" y="453" font-size="17" text-anchor="middle">L1</text>
  <text x="846" y="453" font-size="17" text-anchor="middle">L2</text>
  <text x="1006" y="453" font-size="17" text-anchor="middle">L3</text>
  <text x="48" y="472" font-size="20" font-weight="700">N</text>
  <text x="560" y="533" text-anchor="middle" font-size="18" font-weight="700">O QUE FALTAVA INDICAR NO CROQUI DA QUESTÃO?</text>
  <text x="560" y="565" text-anchor="middle" font-size="18">O retorno R no trecho S2–L1 e nas derivações L1–L2 e L2–L3.</text>
  <text x="560" y="607" text-anchor="middle" font-size="17" font-weight="700">A fase alimenta o COMUM de S1; o COMUM de S2 fornece o retorno R.</text>
  <text x="560" y="631" text-anchor="middle" font-size="16">Todos os pontos de luz recebem o mesmo R e o neutro N, ficando em paralelo.</text>
  <text x="45" y="670" font-size="12">Diagrama didático vetorial P&amp;B — não substitui projeto executivo, especificação ou intervenção segura.</text>
</g>
</svg>
