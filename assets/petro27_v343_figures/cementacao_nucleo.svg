<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="650" viewBox="0 0 1140 650" role="img" aria-label="Corte técnico esquemático de aço cementado: camada superficial de alta dureza e núcleo tenaz; etapas carbonetação, têmpera e revenido; perfil qualitativo de dureza.">
<defs>
  <pattern id="hachura" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(35)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#222" stroke-width="2" />
  </pattern>
  <marker id="seta" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#111"/></marker>
  <marker id="seta2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9Z" fill="#111"/></marker>
</defs>
<rect width="1140" height="650" fill="white"/>
<text x="55" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="bold" fill="#111">AÇO DE BAIXO CARBONO: CAMADA DURA + NÚCLEO TENAZ</text>
<text x="55" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#222">Carbonetação (cementação) → têmpera → revenido | esquema qualitativo, sem escala</text>
<path d="M55 95 H1085" stroke="#111" stroke-width="2"/>
<text x="55" y="131" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold">1. CORTE TRANSVERSAL DO COMPONENTE</text>
<circle cx="249" cy="302" r="150" fill="url(#hachura)" stroke="#111" stroke-width="3"/>
<circle cx="249" cy="302" r="113" fill="white" stroke="#111" stroke-width="3"/>
<text x="249" y="290" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold">NÚCLEO</text>
<text x="249" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">baixo teor de C</text>
<text x="249" y="343" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">maior tenacidade</text>
<path d="M361 198 L448 166 L490 166" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/>
<text x="496" y="162" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold">CAMADA CEMENTADA</text>
<text x="496" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">Carbono difunde da superfície para dentro</text>
<text x="496" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">Após têmpera: martensita de maior dureza</text>
<path d="M347 405 L445 445 L486 445" fill="none" stroke="#111" stroke-width="2" marker-end="url(#seta)"/>
<text x="493" y="439" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold">A CAMADA RESISTE AO DESGASTE</text>
<text x="493" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="16">O núcleo dá suporte e evita ruptura frágil</text>
<path d="M50 302 L98 302" stroke="#111" stroke-width="3" marker-end="url(#seta)"/>
<path d="M442 302 L394 302" stroke="#111" stroke-width="3" marker-end="url(#seta)"/>
<text x="40" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Atrito</text>
<text x="428" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="15">Atrito</text>
<path d="M55 492 H1085" stroke="#111" stroke-width="2"/>
<text x="55" y="524" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold">2. SEQUÊNCIA DE TRATAMENTO (ordem típica)</text>
<rect x="55" y="540" width="305" height="83" rx="4" fill="white" stroke="#111" stroke-width="2"/>
<text x="207" y="565" text-anchor="middle" font-size="18" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">CARBONETAÇÃO</text>
<text x="207" y="589" text-anchor="middle" font-size="15" font-family="DejaVu Sans,Arial,sans-serif">Enriquece a superfície com C</text>
<text x="207" y="609" text-anchor="middle" font-size="15" font-family="DejaVu Sans,Arial,sans-serif">Tratamento termoquímico</text>
<path d="M369 581 H410" stroke="#111" stroke-width="2.5" marker-end="url(#seta)"/>
<rect x="419" y="540" width="305" height="83" rx="4" fill="white" stroke="#111" stroke-width="2"/>
<text x="571" y="565" text-anchor="middle" font-size="18" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">TÊMPERA</text>
<text x="571" y="589" text-anchor="middle" font-size="15" font-family="DejaVu Sans,Arial,sans-serif">Resfriamento rápido</text>
<text x="571" y="609" text-anchor="middle" font-size="15" font-family="DejaVu Sans,Arial,sans-serif">Endurece a camada rica em C</text>
<path d="M733 581 H774" stroke="#111" stroke-width="2.5" marker-end="url(#seta)"/>
<rect x="783" y="540" width="302" height="83" rx="4" fill="white" stroke="#111" stroke-width="2"/>
<text x="934" y="565" text-anchor="middle" font-size="18" font-weight="bold" font-family="DejaVu Sans,Arial,sans-serif">REVENIDO</text>
<text x="934" y="589" text-anchor="middle" font-size="15" font-family="DejaVu Sans,Arial,sans-serif">Reduz fragilidade e tensões</text>
<text x="934" y="609" text-anchor="middle" font-size="15" font-family="DejaVu Sans,Arial,sans-serif">Preserva dureza útil</text>
</svg>
