<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 1587" width="1122" height="1587"><rect x="0" y="0" width="1122" height="1587" fill="white"/><defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#111;font-size:20px} .sm{font-size:16px}.tiny{font-size:14px}.xs{font-size:12px}.h{font-size:31px;font-weight:700}.h2{font-size:22px;font-weight:700}.bold{font-weight:700}.wire{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 5}.gray{fill:#eee;stroke:#111;stroke-width:1.5}.box{fill:none;stroke:#111;stroke-width:2}.dot{fill:#111}</style></defs><text x="60" y="63" class="h">COMANDOS • CONTAGEM &amp; SIMBOLOGIA</text><text x="61" y="98" class="sm">Leitura de projeto | composição dos comandos | condutores por trecho</text><line x1="60" y1="115" x2="1061" y2="115" class="wire"/><rect x="60" y="150" width="1000" height="388" class="box"/><text x="80" y="189" class="h2">TABELA 1 — COMPOSIÇÃO PARA UM ÚNICO PONTO DE LUZ</text><line x1="84" y1="214" x2="84" y2="511" class="thin"/><line x1="330" y1="214" x2="330" y2="511" class="thin"/><line x1="520" y1="214" x2="520" y2="511" class="thin"/><line x1="705" y1="214" x2="705" y2="511" class="thin"/><line x1="866" y1="214" x2="866" y2="511" class="thin"/><line x1="1041" y1="214" x2="1041" y2="511" class="thin"/><line x1="84" y1="214" x2="1041" y2="214" class="thin"/><line x1="84" y1="260" x2="1041" y2="260" class="thin"/><line x1="84" y1="307" x2="1041" y2="307" class="thin"/><line x1="84" y1="354" x2="1041" y2="354" class="thin"/><line x1="84" y1="401" x2="1041" y2="401" class="thin"/><line x1="84" y1="448" x2="1041" y2="448" class="thin"/><line x1="84" y1="511" x2="1041" y2="511" class="thin"/><text x="207" y="244" class="tiny bold" text-anchor="middle">Locais</text><text x="426" y="244" class="tiny bold" text-anchor="middle">Simples</text><text x="620" y="244" class="tiny bold" text-anchor="middle">Paralelos</text><text x="786" y="244" class="tiny bold" text-anchor="middle">Intermediários</text><text x="953" y="244" class="tiny bold" text-anchor="middle">Peças totais</text><text x="207" y="292" class="sm bold" text-anchor="middle">1</text><text x="426" y="292" class="sm bold" text-anchor="middle">1</text><text x="620" y="292" class="sm bold" text-anchor="middle">0</text><text x="786" y="292" class="sm bold" text-anchor="middle">0</text><text x="953" y="292" class="sm bold" text-anchor="middle">1</text><text x="207" y="339" class="sm bold" text-anchor="middle">2</text><text x="426" y="339" class="sm bold" text-anchor="middle">0</text><text x="620" y="339" class="sm bold" text-anchor="middle">2</text><text x="786" y="339" class="sm bold" text-anchor="middle">0</text><text x="953" y="339" class="sm bold" text-anchor="middle">2</text><text x="207" y="386" class="sm bold" text-anchor="middle">3</text><text x="426" y="386" class="sm bold" text-anchor="middle">0</text><text x="620" y="386" class="sm bold" text-anchor="middle">2</text><text x="786" y="386" class="sm bold" text-anchor="middle">1</text><text x="953" y="386" class="sm bold" text-anchor="middle">3</text><text x="207" y="433" class="sm bold" text-anchor="middle">4</text><text x="426" y="433" class="sm bold" text-anchor="middle">0</text><text x="620" y="433" class="sm bold" text-anchor="middle">2</text><text x="786" y="433" class="sm bold" text-anchor="middle">2</text><text x="953" y="433" class="sm bold" text-anchor="middle">4</text><text x="207" y="480" class="sm bold" text-anchor="middle">5</text><text x="426" y="480" class="sm bold" text-anchor="middle">0</text><text x="620" y="480" class="sm bold" text-anchor="middle">2</text><text x="786" y="480" class="sm bold" text-anchor="middle">3</text><text x="953" y="480" class="sm bold" text-anchor="middle">5</text><rect x="60" y="560" width="1000" height="258" class="box"/><text x="80" y="598" class="h2">TABELA 2 — CONTATOS E TERMINAIS</text><line x1="83" y1="616" x2="1038" y2="616" class="thin"/><line x1="83" y1="666" x2="1038" y2="666" class="thin"/><line x1="83" y1="716" x2="1038" y2="716" class="thin"/><line x1="83" y1="766" x2="1038" y2="766" class="thin"/><line x1="83" y1="816" x2="1038" y2="816" class="thin"/><line x1="83" y1="616" x2="83" y2="816" class="thin"/><line x1="275" y1="616" x2="275" y2="816" class="thin"/><line x1="502" y1="616" x2="502" y2="816" class="thin"/><line x1="765" y1="616" x2="765" y2="816" class="thin"/><line x1="1038" y1="616" x2="1038" y2="816" class="thin"/><text x="173" y="646" class="tiny bold" text-anchor="middle">Tipo</text><text x="390" y="646" class="tiny bold" text-anchor="middle">Bornes usuais</text><text x="626" y="646" class="tiny bold" text-anchor="middle">Função elétrica</text><text x="898" y="646" class="tiny bold" text-anchor="middle">Locais</text><text x="173" y="696" class="sm" text-anchor="middle">Simples</text><text x="390" y="696" class="sm" text-anchor="middle">2</text><text x="626" y="696" class="sm" text-anchor="middle">Abre/fecha o circuito</text><text x="898" y="696" class="sm" text-anchor="middle">1</text><text x="173" y="746" class="sm" text-anchor="middle">Paralelo</text><text x="390" y="746" class="sm" text-anchor="middle">3</text><text x="626" y="746" class="sm" text-anchor="middle">Seleciona V1 ou V2</text><text x="898" y="746" class="sm" text-anchor="middle">extremidades</text><text x="173" y="796" class="sm" text-anchor="middle">Intermediário</text><text x="390" y="796" class="sm" text-anchor="middle">4</text><text x="626" y="796" class="sm" text-anchor="middle">Direto ↔ cruzado</text><text x="898" y="796" class="sm" text-anchor="middle">entre paralelos</text><rect x="60" y="835" width="1000" height="390" class="box"/><text x="80" y="873" class="h2">CONFERÊNCIA DE FIAÇÃO EM PLANTA E EM ESQUEMA</text><rect x="88" y="887" width="126" height="38" class="box"/><text x="151" y="913" class="sm bold" text-anchor="middle">F</text><text x="229" y="913" class="tiny">Fase de alimentação; chega ao comum do primeiro paralelo.</text><rect x="88" y="936" width="126" height="38" class="box"/><text x="151" y="962" class="sm bold" text-anchor="middle">R</text><text x="229" y="962" class="tiny">Retorno: fase comutada que sai do comum do último paralelo até a luminária.</text><rect x="88" y="985" width="126" height="38" class="box"/><text x="151" y="1011" class="sm bold" text-anchor="middle">V1 / V2</text><text x="229" y="1011" class="tiny">Dois viajantes entre comutadores; atravessam cada módulo four-way.</text><rect x="88" y="1034" width="126" height="38" class="box"/><text x="151" y="1060" class="sm bold" text-anchor="middle">N</text><text x="229" y="1060" class="tiny">Neutro do circuito fase-neutro; chega diretamente à luminária no esquema usual.</text><rect x="88" y="1083" width="126" height="38" class="box"/><text x="151" y="1109" class="sm bold" text-anchor="middle">PE</text><text x="229" y="1109" class="tiny">Condutor de proteção; NÃO é viajante nem retorno.</text><rect x="88" y="1132" width="126" height="38" class="box"/><text x="151" y="1158" class="sm bold" text-anchor="middle">∆n</text><text x="229" y="1158" class="tiny">Conte o que atravessa CADA trecho: depois − antes; não confundir com 2 viajantes.</text><rect x="60" y="1245" width="1000" height="224" class="box"/><text x="80" y="1280" class="h2">PEGADINHAS DA CESGRANRIO</text><text x="82" y="1321" class="tiny">Um ponto de luz ≠ um ponto de comando; 3 lâmpadas juntas ainda podem usar 2 paralelos.</text><text x="82" y="1351" class="tiny">Interruptor triplo simples ≠ comutador three-way; tecla não equivale a local.</text><text x="82" y="1381" class="tiny">2 viajantes são condutores funcionais entre comutadores, NÃO o total do eletroduto.</text><text x="82" y="1411" class="tiny">Desenho de eletroduto mostra trajeto, NÃO ligação elétrica em série.</text><text x="82" y="1441" class="tiny">Exemplo: 2 → 3 locais = acrescentar 1 intermediário, mantendo os 2 paralelos.</text><text x="62" y="1512" class="tiny">Símbolos deste guia são IDENTIFICAÇÕES DIDÁTICAS, não reprodução literal da NBR 5444:1989.</text><text x="62" y="1545" class="tiny">PETROBRAS 27 • ver legenda do projeto e edição normativa aplicável • 2026</text></svg>