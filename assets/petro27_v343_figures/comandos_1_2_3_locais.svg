<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 1587" width="1122" height="1587"><rect x="0" y="0" width="1122" height="1587" fill="white"/><defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#111;font-size:20px} .sm{font-size:16px}.tiny{font-size:14px}.xs{font-size:12px}.h{font-size:31px;font-weight:700}.h2{font-size:22px;font-weight:700}.bold{font-weight:700}.wire{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:8 5}.gray{fill:#eee;stroke:#111;stroke-width:1.5}.box{fill:none;stroke:#111;stroke-width:2}.dot{fill:#111}</style></defs><text x="60" y="63" class="h">COMANDOS DE ILUMINAÇÃO</text><text x="61" y="98" class="sm">Diagramas funcionais • 1, 2 e 3 locais de acionamento • vista conceitual</text><line x1="60" y1="116" x2="1061" y2="116" class="wire"/><rect x="60" y="145" width="1000" height="230" class="box"/><text x="81" y="178" class="h2">01   UM LOCAL — INTERRUPTOR SIMPLES</text><text x="98" y="254" class="bold">F</text><line x1="122" y1="246" x2="385" y2="246" class="wire"/><circle cx="385" cy="246" r="4" class="dot"/><line x1="385" y1="246" x2="450" y2="213" class="thin"/><circle cx="473" cy="246" r="4" class="dot"/><line x1="473" y1="246" x2="770" y2="246" class="wire"/><circle cx="806" cy="246" r="23" class="thin"/><line x1="791" y1="231" x2="821" y2="261" class="thin"/><line x1="791" y1="261" x2="821" y2="231" class="thin"/><line x1="829" y1="246" x2="940" y2="246" class="wire"/><text x="949" y="254" class="bold">N</text><text x="418" y="293" class="sm">S1 — aberto</text><text x="87" y="338" class="sm">Uma tecla comuta a fase (F), produzindo retorno (R) até a lâmpada.</text><rect x="60" y="395" width="1000" height="403" class="box"/><text x="81" y="430" class="h2">02   DOIS LOCAIS — 2 INTERRUPTORES PARALELOS (THREE-WAY)</text><text x="98" y="598" class="bold">F</text><line x1="122" y1="590" x2="276" y2="590" class="wire"/><circle cx="276" cy="590" r="4" class="dot"/><circle cx="347" cy="557" r="4" class="dot"/><circle cx="347" cy="623" r="4" class="dot"/><line x1="276" y1="590" x2="347" y2="557" class="thin"/><line x1="347" y1="557" x2="757" y2="557" class="wire"/><line x1="347" y1="623" x2="757" y2="623" class="wire"/><circle cx="828" cy="590" r="4" class="dot"/><circle cx="757" cy="557" r="4" class="dot"/><circle cx="757" cy="623" r="4" class="dot"/><line x1="757" y1="557" x2="828" y2="590" class="thin"/><line x1="828" y1="590" x2="946" y2="590" class="wire"/><circle cx="977" cy="590" r="23" class="thin"/><line x1="962" y1="575" x2="992" y2="605" class="thin"/><line x1="962" y1="605" x2="992" y2="575" class="thin"/><line x1="1000" y1="590" x2="1030" y2="590" class="wire"/><text x="1035" y="598" class="bold">N</text><text x="311" y="535" class="sm" text-anchor="middle">P1</text><text x="794" y="535" class="sm" text-anchor="middle">P2</text><text x="535" y="546" class="sm" text-anchor="middle">viajante V1</text><text x="535" y="650" class="sm" text-anchor="middle">viajante V2</text><text x="92" y="694" class="sm">Comum P1 recebe a fase; comum P2 fornece o retorno à lâmpada.</text><text x="92" y="725" class="sm">O acionamento de qualquer P muda o caminho de continuidade.</text><text x="92" y="763" class="sm bold">TROCA NA LISTA: −1 simples; +2 paralelos. (Seu gabarito A.)</text><rect x="60" y="820" width="1000" height="525" class="box"/><text x="81" y="855" class="h2">03   TRÊS LOCAIS — 2 PARALELOS + 1 INTERMEDIÁRIO (FOUR-WAY)</text><text x="93" y="1014" class="bold">F</text><line x1="115" y1="1006" x2="219" y2="1006" class="wire"/><circle cx="219" cy="1006" r="4" class="dot"/><circle cx="290" cy="973" r="4" class="dot"/><circle cx="290" cy="1039" r="4" class="dot"/><line x1="219" y1="1006" x2="290" y2="973" class="thin"/><line x1="290" y1="973" x2="475" y2="973" class="wire"/><line x1="290" y1="1039" x2="475" y2="1039" class="wire"/><rect x="458" y="938" width="153" height="136" class="box"/><text x="534" y="955" class="tiny" text-anchor="middle">I — 4 bornes</text><circle cx="475" cy="973" r="4" class="dot"/><circle cx="475" cy="1039" r="4" class="dot"/><circle cx="594" cy="973" r="4" class="dot"/><circle cx="594" cy="1039" r="4" class="dot"/><line x1="475" y1="973" x2="594" y2="973" class="thin"/><line x1="475" y1="1039" x2="594" y2="1039" class="thin"/><line x1="594" y1="973" x2="728" y2="973" class="wire"/><line x1="594" y1="1039" x2="728" y2="1039" class="wire"/><circle cx="799" cy="1006" r="4" class="dot"/><circle cx="728" cy="973" r="4" class="dot"/><circle cx="728" cy="1039" r="4" class="dot"/><line x1="728" y1="973" x2="799" y2="1006" class="thin"/><line x1="799" y1="1006" x2="940" y2="1006" class="wire"/><circle cx="971" cy="1006" r="23" class="thin"/><line x1="956" y1="991" x2="986" y2="1021" class="thin"/><line x1="956" y1="1021" x2="986" y2="991" class="thin"/><line x1="994" y1="1006" x2="1030" y2="1006" class="wire"/><text x="1035" y="1014" class="bold">N</text><text x="254" y="939" class="sm" text-anchor="middle">P1</text><text x="765" y="939" class="sm" text-anchor="middle">P2</text><text x="380" y="960" class="tiny" text-anchor="middle">V1</text><text x="380" y="1064" class="tiny" text-anchor="middle">V2</text><text x="664" y="960" class="tiny" text-anchor="middle">V1</text><text x="664" y="1064" class="tiny" text-anchor="middle">V2</text><text x="94" y="1126" class="sm bold">O intermediário alterna entre:</text><rect x="95" y="1148" width="402" height="109" class="box"/><rect x="520" y="1148" width="402" height="109" class="box"/><text x="296" y="1170" class="sm bold" text-anchor="middle">DIRETO</text><text x="721" y="1170" class="sm bold" text-anchor="middle">CRUZADO</text><line x1="147" y1="1196" x2="447" y2="1196" class="thin"/><line x1="147" y1="1225" x2="447" y2="1225" class="thin"/><line x1="569" y1="1196" x2="630" y2="1196" class="thin"/><line x1="814" y1="1225" x2="873" y2="1225" class="thin"/><line x1="569" y1="1225" x2="630" y2="1225" class="thin"/><line x1="814" y1="1196" x2="873" y2="1196" class="thin"/><line x1="630" y1="1196" x2="814" y2="1225" class="thin"/><line x1="630" y1="1225" x2="814" y2="1196" class="thin"/><text x="95" y="1304" class="sm">Para 4 locais: 2 paralelos + 2 intermediários; para n ≥ 2: 2 + (n−2).</text><line x1="61" y1="1380" x2="1061" y2="1380" class="thin"/><text x="63" y="1411" class="h2">NOTAS DE PROJETO</text><text x="63" y="1441" class="sm">F = fase; N = neutro; R = retorno; V1/V2 = viajantes; P = paralelo; I = intermediário.</text><text x="63" y="1471" class="sm">PE (proteção) não aparece nas chaves; deve chegar às massas/partes aplicáveis das luminárias.</text><text x="63" y="1501" class="sm">Esquemas didáticos: não representam caixas/eletrodutos nem dispensam projeto e segurança.</text><text x="63" y="1545" class="tiny">PETROBRAS 27 • CARD-0199 / CARD-0388 / CARD-0454 • SVG vetorial original • 2026</text></svg>