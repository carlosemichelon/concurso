<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 355"><rect width="720" height="355" fill="#fff"/><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#253449}.h{font-weight:bold;font-size:21px}.s{font-size:15px}.a{font-weight:bold}</style><text x="360" y="29" text-anchor="middle" class="h">Dígrafos: reconheça pelo som</text><rect x="220" y="45" width="280" height="45" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="360" y="73" text-anchor="middle" class="a">2 letras → 1 fonema</text><path d="M360 90V112H182V130M360 112H538V130" stroke="#64748b" stroke-width="2" fill="none"/><rect x="22" y="130" width="320" height="130" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="378" y="130" width="320" height="130" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="182" y="155" text-anchor="middle" class="a">Consonantais</text><text x="182" y="181" text-anchor="middle" class="">ch · lh · nh · rr · ss</text><text x="182" y="205" text-anchor="middle" class="s">sc · sç · xc (no contexto)</text><text x="182" y="233" text-anchor="middle" class="s">qu / gu: U não pronunciado</text><text x="538" y="155" text-anchor="middle" class="a">Vocálicos</text><text x="538" y="181" text-anchor="middle" class="">am/an · em/en · im/in</text><text x="538" y="205" text-anchor="middle" class="">om/on · um/un</text><text x="538" y="233" text-anchor="middle" class="s">vogal nasalizada</text><rect x="22" y="282" width="676" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="360" y="304" text-anchor="middle" class="a">Contrastes: quilo × quase · tempo × trem</text><text x="360" y="325" text-anchor="middle" class="s">Encontro consonantal: prato (pr = dois sons).</text></svg>