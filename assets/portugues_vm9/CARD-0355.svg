<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302"><rect width="720" height="302" fill="#fff"/><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#253449}.h{font-weight:bold;font-size:21px}.s{font-size:15px}.a{font-weight:bold}</style><text x="360" y="28" text-anchor="middle" class="h">Causa, consequência e classificação</text><rect x="20" y="52" width="260" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150" y="77" text-anchor="middle" class="a">CAUSA</text><text x="150" y="101" text-anchor="middle" class="">João estava doente</text><rect x="440" y="52" width="260" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="570" y="77" text-anchor="middle" class="a">CONSEQUÊNCIA</text><text x="570" y="101" text-anchor="middle" class="">João faltou</text><path d="M280 87H440M430 81L440 87L430 93" stroke="#64748b" stroke-width="2" fill="none"/><text x="360" y="74" text-anchor="middle" class="s">por isso</text><rect x="20" y="147" width="680" height="55" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="360" y="170" text-anchor="middle" class="a">Choveu tanto que a obra parou.</text><text x="360" y="190" text-anchor="middle" class="s">Consecutiva subordinada: intensidade → efeito</text><rect x="20" y="224" width="680" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="360" y="247" text-anchor="middle" class="a">A obra parou porque chovia.</text><text x="360" y="267" text-anchor="middle" class="s">Causal: a oração introduz o motivo</text><text x="360" y="296" text-anchor="middle" class="s">Relação semântica não é sempre a classificação sintática.</text></svg>