<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 387"><rect width="720" height="387" fill="#fff"/><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#253449}.h{font-weight:bold;font-size:21px}.s{font-size:15px}.a{font-weight:bold}</style><text x="360" y="28" text-anchor="middle" class="h">Formação de palavras</text><rect x="240" y="45" width="240" height="42" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="360" y="71" text-anchor="middle" class="a">Novo vocábulo</text><path d="M360 87V108H180V125M360 108H540V125" stroke="#64748b" stroke-width="2" fill="none"/><rect x="20" y="125" width="320" height="224" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="380" y="125" width="320" height="224" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="180" y="151" text-anchor="middle" class="a">DERIVAÇÃO</text><text x="540" y="151" text-anchor="middle" class="a">COMPOSIÇÃO</text><text x="38" y="180" text-anchor="start" class="s">Prefixal</text><text x="322" y="180" text-anchor="end" class="s">infeliz</text><text x="38" y="208" text-anchor="start" class="s">Sufixal</text><text x="322" y="208" text-anchor="end" class="s">felizmente</text><text x="38" y="236" text-anchor="start" class="s">Prefixal + sufixal</text><text x="322" y="236" text-anchor="end" class="s">infelizmente</text><text x="38" y="264" text-anchor="start" class="s">Parassintética</text><text x="322" y="264" text-anchor="end" class="s">anoitecer</text><text x="38" y="292" text-anchor="start" class="s">Regressiva</text><text x="322" y="292" text-anchor="end" class="s">pesca</text><text x="38" y="320" text-anchor="start" class="s">Imprópria</text><text x="322" y="320" text-anchor="end" class="s">o jantar</text><text x="540" y="186" text-anchor="middle" class="a">Justaposição</text><text x="540" y="209" text-anchor="middle" class="s">gira + sol → girassol</text><text x="540" y="232" text-anchor="middle" class="s">Preserva estrutura sonora</text><