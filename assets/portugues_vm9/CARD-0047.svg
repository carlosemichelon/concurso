xt><text x="605" y="283" text-anchor="middle" class="s">a uma pessoa</text><rect x="30" y="320" width="660" height="65" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="360" y="343" text-anchor="middle" class="a">Atenção: locuções e casos especiais</text><text x="360" y="367" text-anchor="middle" class="s">à noite · à medida que · à moda de · possessivo facultativo</text></svg>