<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365"><rect width="760" height="365" fill="white"/><g font-family="Arial" fill="#17212c"><text x="380" y="28" font-size="23" font-weight="bold" text-anchor="middle">Rede de fluxo — carga total e pressão em A</text><text x="380" y="55" font-size="15" text-anchor="middle">10 intervalos; H = 4 m; cada queda = 0,4 m; nível interno = cota zero</text><path d="M50 95H710" stroke="#64748b" stroke-width="2"/><circle cx="50" cy="95" r="6" fill="#0369a1"/><text x="50" y="81" font-size="14" text-anchor="middle" fill="#0369a1">4.0</text><text x="50" y="117" font-size="12" text-anchor="middle">0</text><circle cx="116" cy="95" r="6" fill="#0369a1"/><text x="116" y="81" font-size="14" text-anchor="middle" fill="#0369a1">3.6</text><text x="116" y="117" font-size="12" text-anchor="middle">1</text><circle cx="182" cy="95" r="6" fill="#0369a1"/><text x="182" y="81" font-size="14" text-anchor="middle" fill="#0369a1">3.2</text><text x="182" y="117" font-size="12" text-anchor="middle">2</text><circle cx="248" cy="95" r="6" fill="#0369a1"/><text x="248" y="81" font-size="14" text-anchor="middle" fill="#0369a1">2.8</text><text x="248" y="117" font-size="12" text-anchor="middle">3</text><circle cx="314" cy="95" r="6" fill="#0369a1"/><text x="314" y="81" font-size="14" text-anchor="middle" fill="#0369a1">2.4</text><text x="314" y="117" font-size="12" text-anchor="middle">4</text><circle cx="380" cy="95" r="6" fill="#0369a1"/><text x="380" y="81" font-size="14" text-anchor="middle" fill="#0369a1">2.0</text><text x="380" y="117" font-size="12" text-anchor="middle">5</text><circle cx="446" cy="95" r="6" fill="#15803d"/><text x="446" y="81" font-size="14" text-anchor="middle" fill="#15803d">1.6</text><text x="446" y="117" font-size="12" text-anchor="middle">6</text><circle cx="512" cy="95" r="6" fill="#0369a1"/><text x="512" y="81" font-size="14" text-anchor="middle" fill="#0369a1">1.2</text><text x="512" y="117" font-size="12" text-anchor="middle">7</text><circle cx="578" cy="95" r="6" fill="#0369a1"/><text x="578" y="81" font-size="14" text-anchor="middle" fill="#0369a1">0.8</text><text x="578" y="117" font-size="12" text-anchor="middle">8</text><circle cx="644" cy="95" r="6" fill="#0369a1"/><text x="644" y="81" font-size="14" text-anchor="middle" fill="#0369a1">0.4</text><text x="644" y="117" font-size="12" text-anchor="middle">9</text><circle cx="710" cy="95" r="6" fill="#0369a1"/><text x="710" y="81" font-size="14" text-anchor="middle" fill="#0369a1">0.0</text><text x="710" y="117" font-size="12" text-anchor="middle">10</text><text x="50" y="142" font-size="14" text-anchor="start">Montante</text><text x="446" y="142" font-size="16" text-anchor="middle" fill="#15803d" font-weight="bold">A</text><text x="710" y="142" font-size="14" text-anchor="end">Jusante</text><path d="M50 159H446M446 159H710" stroke="#475569" stroke-width="2"/><text x="248" y="180" font-size="15" text-anchor="middle">6 quedas = 2,4 m</text><text x="578" y="180" font-size="15" text-anchor="middle">4 quedas = 1,6 m</text><rect x="25" y="195" width="710" height="120" rx="8" fill="#f1f5f9"/><text x="45" y="220" font-size="17">Montante: 10 × (9 − 2,4) = 66 kPa</text><text x="45" y="247" font-size="17">Jusante: 10 × (5 + 1,6) = 66 kPa</text><text x="45" y="274" font-size="17">Carga total: hA = 1,6 m; cota: zA = −5 m</text><text x="45" y="299" font-size="17" font-weight="bold" fill="#15803d">uA = γw(hA − zA) = 10 × 6,6 = 66 kPa</text><text x="380" y="343" font-size="15" text-anchor="middle">Vai com o fluxo, perde; volta contra o fluxo, ganha.</text></g></svg>