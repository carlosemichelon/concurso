<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310"><rect width="760" height="310" fill="white"/><g font-family="Arial" fill="#17212c"><text x="380" y="28" text-anchor="middle" font-size="22" font-weight="bold">Intemperismo físico e químico</text><rect x="20" y="45" width="350" height="165" rx="8" fill="#fef3c7"/><rect x="390" y="45" width="350" height="165" rx="8" fill="#dbeafe"/><text x="195" y="72" font-size="20" text-anchor="middle">Físico: desagregação</text><text x="565" y="72" font-size="20" text-anchor="middle">Químico: decomposição</text><circle cx="85" cy="102" r="18" fill="#f59e0b"/><path d="M110 177L135 107L197 92L205 124L180 143L198 177Z M220 95L274 113L302 177L215 177L200 143L224 123Z" fill="#a8a29e" stroke="#57534e" stroke-width="2"/><path d="M173 131L148 131M237 131L262 131" stroke="#dc2626" stroke-width="3"/><text x="195" y="196" text-anchor="middle" font-size="15">Minerais essencialmente preservados</text><path d="M510 95Q490 80 520 80Q538 66 558 82Q580 69 605 85Q625 83 632 95Z" fill="#94a3b8"/><path d="M520 103l-5 15m25-15l-5 15m25-15l-5 15m25-15l-5 15m25-15l-5 15" stroke="#0284c7" stroke-width="3"/><path d="M470 177L505 131L550 123L600 132L655 177Z" fill="#b45309" stroke="#92400e" stroke-width="2"/><path d="M513 175L537 143L577 141L610 175Z" fill="#a8a29e" stroke="#57534e"/><text x="565" y="196" text-anchor="middle" font-size="15">Minerais transformados</text><rect x="20" y="224" width="720" height="68" rx="8" fill="#ecfdf5"/><text x="380" y="251" font-size="21" text-anchor="middle" font-weight="bold">Calor + água = intemperismo químico favorecido</text><text x="380" y="276" font-size="15" text-anchor="middle">Mais lixiviação: esmectita → caulinita → oxi-hidróxidos de Fe e Al (tendência)</text></g></svg>