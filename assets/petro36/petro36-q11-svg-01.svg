<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#0284c7"/></marker></defs><rect width="640" height="300" fill="white"/><g font-family="Arial" fill="#1e293b"><text x="320" y="25" text-anchor="middle" font-size="22" font-weight="bold">Permeabilidade e transmissividade</text><text x="160" y="53" text-anchor="middle" font-size="17">Aquífero 1</text><text x="480" y="53" text-anchor="middle" font-size="17">Aquífero 2</text><rect x="30" y="120" width="260" height="60" fill="#bfdbfe" stroke="#2563eb"/><rect x="350" y="60" width="260" height="120" fill="#bfdbfe" stroke="#2563eb"/><g stroke="#0284c7" stroke-width="4" marker-end="url(#a)"><path d="M55 150H265"/><path d="M375 90H585"/><path d="M375 150H585"/></g><text x="160" y="205" text-anchor="middle" font-size="17">b = 5 m</text><text x="480" y="205" text-anchor="middle" font-size="17">b = 10 m</text><text x="320" y="235" text-anchor="middle" font-size="18" font-weight="bold">Mesmo k, mesma direção do fluxo: T₂ = 2T₁</text><text x="320" y="263" text-anchor="middle" font-size="17">k [m/s] · b [m] = T [m²/s]</text><text x="320" y="286" text-anchor="middle" font-size="13">Hipótese: k horizontal uniforme, meio saturado</text></g></svg>