<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290"><rect width="680" height="290" fill="white"/><g font-family="Arial" fill="#111827" font-size="16"><text x="340" y="25" text-anchor="middle" font-weight="bold" font-size="21">Vazão maior com perda de carga constante</text><text x="24" y="60" font-weight="bold">Projeto original</text><rect x="25" y="70" width="350" height="42" fill="#bae6fd" stroke="#475569" stroke-width="3"/><text x="24" y="148" font-weight="bold">Novo projeto</text><rect x="25" y="158" width="350" height="84" fill="#bae6fd" stroke="#475569" stroke-width="3"/><path d="M48 82H350l-10 -5m10 5l-10 5" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M48 100H350l-10 -5m10 5l-10 5" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M48 170H350l-10 -5m10 5l-10 5" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M48 190H350l-10 -5m10 5l-10 5" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M48 210H350l-10 -5m10 5l-10 5" stroke="#2563eb" stroke-width="2" fill="none"/><path d="M48 230H350l-10 -5m10 5l-10 5" stroke="#2563eb" stroke-width="2" fill="none"/><g font-size="19"><text x="400" y="85" fill="#166534" font-weight="bold">A₁ = A</text><text x="400" y="109" fill="#1d4ed8">Q₁ = Q; v₁ = v</text><text x="400" y="177" fill="#166534" font-weight="bold">A₂ = 2A</text><text x="400" y="201" fill="#1d4ed8">Q₂ = 2Q; v₂ = v</text><text x="400" y="229" fill="#92400e">K e hL constantes</text></g><text x="340" y="272" text-anchor="middle" font-size="15" font-weight="bold">Q = Av; hL = K v²/(2g); área dobra, velocidade não muda.</text></g></svg>