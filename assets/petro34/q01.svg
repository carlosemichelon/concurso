<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><rect width="640" height="300" fill="white"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b45309"/></marker></defs><g font-family="Arial" fill="#111827"><text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold">Ações permanentes no tabuleiro</text><text x="160" y="61" text-anchor="middle" font-size="15" fill="#92400e">Previsão de recapeamento</text><path d="M50 75V110M100 75V110M150 75V110M200 75V110M250 75V110" stroke="#b45309" stroke-width="3" marker-end="url(#a)"/><rect x="25" y="115" width="270" height="28" fill="#374151"/><rect x="25" y="143" width="270" height="83" fill="#d1d5db" stroke="#64748b"/><path d="M40 156H280M40 212H280" stroke="#9a3412" stroke-width="4"/><path d="M296 94H325M296 129H325M296 184H325" stroke="#475569" stroke-width="1.5"/><text x="338" y="99" font-size="18" fill="#92400e" font-weight="bold">2 kN/m² adicionais</text><text x="338" y="124" font-size="14">Pavimentação</text><text x="338" y="143" font-size="19" fill="#1d4ed8" font-weight="bold">≥ 24 kN/m³</text><text x="338" y="179" font-size="14">Concreto armado / protendido</text><text x="338" y="199" font-size="19" fill="#166534" font-weight="bold">≥ 25 kN/m³</text><rect x="24" y="245" width="592" height="38" rx="6" fill="#fef3c7"/><text x="320" y="269" text-anchor="middle" font-size="16" font-weight="bold">g = γ × e; 24 × 0,05 + 2 = 3,2 kN/m²</text></g></svg>