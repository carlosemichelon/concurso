<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290"><rect width="600" height="290" fill="white"/><g font-family="Arial" fill="#334155"><text x="300" y="26" font-size="20" font-weight="bold" text-anchor="middle">Bocal: entalpia converte-se em energia cinética</text><path d="M65 65H185L430 105H530V155H430L185 195H65Z" fill="#dbeafe"/><path d="M65 65H185L430 105H530M65 195H185L430 155H530" stroke="#475569" stroke-width="3" fill="none"/><path d="M20 130H150l-12 -7m12 7l-12 7" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M415 130H580l-12 -7m12 7l-12 7" stroke="#dc2626" stroke-width="4" fill="none"/><text x="125" y="53" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d4ed8">40 m/s</text><text x="500" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#b91c1c">200 m/s</text><text x="125" y="220" text-anchor="middle" font-size="16" fill="#1d4ed8">h₁ = 3200 kJ/kg</text><text x="478" y="220" text-anchor="middle" font-size="16" fill="#b91c1c">h₂ = 3180,8 kJ/kg</text><text x="300" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">−19,2 kJ/kg de entalpia; +19,2 kJ/kg de cinética</text><text x="300" y="277" text-anchor="middle" font-size="14">Adiabático, sem trabalho de eixo, Δz desprezível.</text></g></svg>