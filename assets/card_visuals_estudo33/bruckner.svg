<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415"><rect width="800" height="415" fill="white"/><g font-family="Arial,sans-serif" fill="#243447"><text x="400" y="32" text-anchor="middle" font-size="24" font-weight="bold">Brückner — corte positivo, aterro negativo</text><path d="M65 65V350H755" stroke="#334155" stroke-width="2" fill="none"/><path d="M65 210H755" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/><path d="M100 210L265 80L430 210Z" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><path d="M430 210L580 320L730 210Z" fill="#bae6fd" stroke="#2563eb" stroke-width="3"/><path d="M265 85V205" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/><text x="275" y="145" fill="#92400e" font-size="18">V</text><text x="265" y="69" text-anchor="middle" font-size="17">Máximo</text><text x="580" y="341" text-anchor="middle" font-size="17">Mínimo</text><text x="265" y="178" text-anchor="middle" font-size="17" fill="#166534">Área = MT</text><path d="M145 240H380m-12-7 12 7-12 7" stroke="#15803d" stroke-width="3" fill="none"/><text x="263" y="265" text-anchor="middle" font-size="16" fill="#166534">Transporte para frente</text><path d="M700 190H465m12-7-12 7 12 7" stroke="#2563eb" stroke-width="3" fill="none"/><text x="580" y="175" text-anchor="middle" font-size="16" fill="#1d4ed8">Transporte para trás</text><text x="405" y="376" text-anchor="middle" font-size="17">Distância ao longo do eixo</text><text x="24" y="205" transform="rotate(-90 24 205)" text-anchor="middle" font-size="17">Volume acumulado (m³)</text><text x="400" y="405" text-anchor="middle" font-size="16">Onda simples: DMT = área / volume; trajetos reais podem diferir.</text></g></svg>