<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title"><title id="title">Mecanismos de contenção e drenagem</title><rect width="900" height="650" fill="#fff"/><style>text{font:18px sans-serif;fill:#172033}.title{font:bold 22px sans-serif}.small{font:15px sans-serif}.soil{fill:#e8d1ab;stroke:#9a7445}.face{stroke:#64748b;stroke-width:10}.steel{stroke:#2563eb;stroke-width:5;stroke-linecap:round}.drain{stroke:#0891b2;stroke-width:5;stroke-dasharray:7 4}.line{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:7 5}</style><defs><pattern id="rocks" width="32" height="25" patternUnits="userSpaceOnUse"><rect width="32" height="25" fill="#cbd5e1"/><path d="M1 2L12 1 15 10 7 14 1 10ZM17 1L30 3 31 12 22 15 17 9ZM2 17L14 15 18 24 1 24ZM20 17L31 15 31 24 21 24Z" fill="#94a3b8" stroke="#475569"/></pattern></defs><text x="450" y="32" class="title" text-anchor="middle">Contenções: o que mobiliza resistência?</text><g transform="translate(20 55)"><rect width="420" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="15" y="30" class="title">Solo grampeado</text><path class="soil" d="M110 60H398V220H20V215H110Z"/><path class="face" d="M110 60V220"/><path class="line" d="M160 60Q300 140 133 220"/><path class="steel" d="M110 85L345 125M110 130L345 170M110 175L345 215"/><path class="drain" d="M111 200L210 185"/><text x="16" y="80" class="small">Face</text><text x="236" y="80" class="small">Grampos passivos</text><text x="15" y="242" class="small">Dreno → saída na face</text><text x="15" y="260" class="small">Escavação descendente; ruptura tracejada</text></g><g transform="translate(460 55)"><rect width="420" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="15" y="30" class="title">Cortina atirantada</text><path class="soil" d="M105 60H398V220H20V215H105Z"/><path class="face" d="M105 60V230"/><path class="line" d="M160 60Q280 140 130 220"/><path class="steel" d="M105 95L270 129M105 160L270 194"/><path stroke="#0f766e" stroke-width="13" stroke-linecap="round" d="M270 129L370 149M270 194L370 214"/><path stroke="#334155" stroke-width="8" d="M95 83V108M95 148V173"/><text x="120" y="82" class="small">Trecho livre</text><text x="290" y="110" class="small">Bulbo</text><text x="14" y="143" class="small">Cabeça</text><text x="15" y="253" class="small">Protensão usual; bulbo além da ruptura</text></g><g transform="translate(20 340)"><rect width="420" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="15" y="30" class="title">Gabião de gravidade</text><path class="soil" d="M210 70H398V230H20V225H210Z"/><rect x="60" y="175" width="150" height="50" fill="url(#rocks)" stroke="#475569"/><rect x="100" y="125" width="110" height="50" fill="url(#rocks)" stroke="#475569"/><rect x="150" y="75" width="60" height="50" fill="url(#rocks)" stroke="#475569"/><path d="M135 105V165" stroke="#b45309" stroke-width="3"/><path d="M129 158L135 169 141 158" fill="#b45309"/><path class="drain" d="M219 75V218H60"/><text x="230" y="100" class="small">Filtro</text><text x="30" y="95" class="small">Peso</text><text x="15" y="258" class="small">Caixas de pedra; verificar base e erosão</text></g><g transform="translate(460 340)"><rect width="420" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="15" y="30" class="title">Aterro reforçado</text><path class="soil" d="M105 65H398V225H20V220H105Z"/><path class="face" stroke-dasharray="30 3" d="M105 65V225"/><path stroke="#0f766e" stroke-width="5" stroke-dasharray="10 3" d="M110 90H315M110 127H315M110 164H315M110 201H315"/><path class="drain" d="M326 65V220H110"/><text x="155" y="82" class="small">Reforços à tração</text><text x="330" y="140" class="small">Dreno</text><text x="15" y="250" class="small">Aterro compactado em camadas ascendentes</text></g><text x="450" y="642" text-anchor="middle" class="small">Esquemas conceituais, sem escala; não substituem dimensionamento.</text></svg>