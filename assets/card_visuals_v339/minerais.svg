<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="Agregados pesados barita e hematita versus agregados leves argila expandida e vermiculita">
<title>Classificação mineral de agregados de densidades diferentes</title><rect width="960" height="460" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#1e293b}.h{font-size:24px;font-weight:bold}.l{font-size:22px;font-weight:bold}.t{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#475569;stroke-width:2}.dark{fill:#94a3b8;stroke:#334155;stroke-width:2}.light{fill:#e2e8f0;stroke:#334155;stroke-width:2}</style><text x="26" y="44" class="h">AGREGADOS — MASSA ESPECÍFICA MINERAL ≠ MASSA UNITÁRIA</text>
<rect x="25" y="76" width="440" height="334" rx="8" class="b"/><rect x="495" y="76" width="440" height="334" rx="8" class="b"/>
<text x="245" y="110" text-anchor="middle" class="l">PESADOS · minerais densos</text>
<polygon points="110,185 145,138 194,168 186,247 137,258" class="dark"/><polygon points="270,154 318,139 359,184 327,253 266,237" class="dark"/>
<text x="150" y="295" text-anchor="middle" class="l">BARITA</text><text x="150" y="322" text-anchor="middle" class="t">BaSO₄ · ≈4,5 g/cm³</text>
<text x="320" y="295" text-anchor="middle" class="l">HEMATITA</text><text x="320" y="322" text-anchor="middle" class="t">Fe₂O₃ · ≈5,2 g/cm³</text>
<text x="245" y="372" text-anchor="middle" class="s">Também: magnetita e limonita</text>
<text x="715" y="110" text-anchor="middle" class="l">LEVES · materiais expandidos</text>
<circle cx="605" cy="184" r="27" class="light"/><circle cx="654" cy="220" r="22" class="light"/><circle cx="579" cy="235" r="20" class="light"/>
<path d="M755 161 L826 148 L834 168 L763 185 Z M763 197 L835 184 L841 206 L768 218 Z M770 228 L839 218 L845 240 L776 249 Z" class="light"/>
<text x="620" y="295" text-anchor="middle" class="l">ARGILA EXPANDIDA</text><text x="620" y="321" text-anchor="middle" class="t">Grânulos porosos</text>
<text x="815" y="295" text-anchor="middle" class="l">VERMICULITA</text><text x="815" y="321" text-anchor="middle" class="t">Lâminas expandidas</text>
<text x="715" y="373" text-anchor="middle" class="s">Materiais diferentes, ambos leves</text>
<text x="26" y="444" class="s">Representação esquemática, não fotos dos minerais • Valores dos minerais puros, não do concreto</text></svg>