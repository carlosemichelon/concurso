<g font-size="16"><text x="52" y="358" font-weight="700">Grãos de agregado + esferas</text><text x="52" y="388">Impacto e atrito no tambor.</text><text x="52" y="414">Mede perda por desgaste /</text><text x="52" y="436">fragmentação do agregado.</text><text x="397" y="358" font-weight="700">Placa ou peça rochosa</text><text x="397" y="388">Abrasão da superfície.</text><text x="397" y="414">Não é o ensaio usual de</text><text x="397" y="436">brita solta da questão.</text><text x="742" y="358" font-weight="700">Corpo de prova íntegro</text><text x="742" y="388">Compressão diametral.</text><text x="742" y="414">Tração indireta na mistura</text><text x="742" y="436">asfáltica compactada.</text></g>
<rect x="32" y="518" width="1016" height="114" rx="10" fill="#EDF4FA" stroke="#B7CADB"/><text x="52" y="547" font-size="17" font-weight="700" fill="#245FAD">NÃO EXCLUA A PETROGRAFIA:</text><text x="52" y="572" font-size="16">Ela também caracteriza agregados (mineralogia, textura e possíveis constituintes reativos).</text><text x="52" y="597" font-size="16">Agregado + CAP → adesividade; ciclos com sulfatos → sanidade; água nos poros → absorção.</text><text x="32" y="652" font-size="13">PETRO27 · CARD-1304 · esquema autoral, não substitui procedimento ou especificação normativa.</text></g></svg>