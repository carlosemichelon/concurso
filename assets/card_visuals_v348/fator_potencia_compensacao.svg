<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 840 1188">
<rect x="0" y="0" width="840" height="1188" fill="#F8FAFC" />
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#22384D" stroke-linecap="round" stroke-linejoin="round">
<rect x="36" y="36" width="768" height="1116" stroke="#22384D" stroke-width="2" fill="white" />
<text x="65" y="86" font-size="28" font-weight="700" fill="#245FAD">CORREÇÃO DO FATOR DE POTÊNCIA</text>
<text x="65" y="115" font-size="15">Banco de capacitores | Estação elevatória | Petrobras 27</text>
<path d="M65 133 L775 133" stroke="#22384D" stroke-width="2" fill="none" />
<text x="65" y="170" font-size="21" font-weight="700" fill="#245FAD">1  TRIÂNGULO DAS POTÊNCIAS — CARGA CONSTANTE</text>
<text x="65" y="196" font-size="16">Antes: P=30 kW | FP=0,80 | Q=22,5 kvar | S=37,5 kVA</text>
<text x="65" y="219" font-size="16">Depois: P=30 kW | FP=0,96 | Q=8,75 kvar | S=31,25 kVA</text>
<path d="M154 492 L404 492" stroke="#245FAD" stroke-width="3" fill="none" style="stroke:#245FAD" />
<path d="M394 492 L394 312" stroke="#C45E15" stroke-width="3" fill="none" style="stroke:#C45E15" />
<path d="M154 492 L394 312" stroke="#754DA4" stroke-width="3" fill="none" style="stroke:#754DA4" />
<path d="M154 492 L394 422" stroke="#087F83" stroke-width="3" fill="none" stroke-dasharray="7 5" style="stroke:#087F83" />
<path d="M394 422 L394 492" stroke="#087F83" stroke-width="3" fill="none" stroke-dasharray="7 5" style="stroke:#087F83" />
<rect x="379" y="477" width="15" height="15" stroke="#22384D" stroke-width="1" fill="white" />
<text x="258" y="512" font-size="16" font-weight="700" fill="#245FAD" style="fill:#245FAD">P=30 kW</text>
<text x="399" y="299" font-size="15" font-weight="700" fill="#C45E15" style="fill:#C45E15">Q1=22,5 kvar</text>
<text x="399" y="413" font-size="15" font-weight="700" fill="#087F83" style="fill:#087F83">Q2=8,75 kvar</text>
<text x="198" y="349" font-size="15" font-weight="700" fill="#754DA4" style="fill:#754DA4">S1=37,5 kVA</text>
<text x="222" y="433" font-size="15" font-weight="700" fill="#087F83" style="fill:#087F83">S2=31,25 kVA</text>
<text x="65" y="557" font-size="18" font-weight="700" fill="#087F83" style="fill:#087F83">Capacitor compensou Qc = 22,5 − 8,75 = 13,75 kvar</text>
<text x="65" y="585" font-size="16">A potência ativa P não mudou; a exigência da rede diminuiu.</text>
<path d="M65 610 L775 610" stroke="#22384D" stroke-width="2" fill="none" />
<text x="65" y="646" font-size="21" font-weight="700" fill="#245FAD">2  POSIÇÃO DO BANCO — ONDE A CORRENTE DIMINUI?</text>
<rect x="78" y="704" width="125" height="73" stroke="#22384D" stroke-width="2" fill="white" />
<text x="140" y="734" font-size="20" font-weight="700" text-anchor="middle" fill="#245FAD">REDE</text>
<text x="140" y="758" font-size="14" text-anchor="middle">elétrica</text>
<rect x="360" y="704" width="120" height="73" stroke="#22384D" stroke-width="2" fill="white" />
<text x="420" y="733" font-size="16" font-weight="700" text-anchor="middle" fill="#245FAD">QUADRO</text>
<text x="420" y="756" font-size="15" text-anchor="middle">geral</text>
<circle cx="687" cy="741" r="39" fill="white" stroke="#22384D" stroke-width="3" />
<text x="687" y="745" font-size="16" font-weight="700" text-anchor="middle" fill="#245FAD">M 3~</text>
<path d="M203 741 L360 741" stroke="#087F83" stroke-width="3" fill="none" style="stroke:#087F83" />
<path d="M480 741 L648 741" stroke="#22384D" stroke-width="3" fill="none" />
<text x="283" y="711" font-size="17" font-weight="700" text-anchor="middle" fill="#087F83" style="fill:#087F83">I reduzida</text>
<text x="564" y="711" font-size="17" font-weight="700" text-anchor="middle" fill="#245FAD">I do motor</text>
<path d="M420 777 L420 823" stroke="#087F83" stroke-width="3" fill="none" style="stroke:#087F83" />
<path d="M393 823 L447 823" stroke="#087F83" stroke-width="3" fill="none" style="stroke:#087F83" />
<path d="M393 833 L447 833" stroke="#087F83" stroke-width="3" fill="none" style="stroke:#087F83" />
<path d="M420 833 L420 854" stroke="#087F83" stroke-width="3" fill="none" style="stroke:#087F83" />
<rect x="354" y="855" width="132" height="42" stroke="#087F83" stroke-width="2" fill="#D8F1EA" style="fill:#D8F1EA;stroke:#087F83" />
<text x="420" y="882" font-size="14" font-weight="700" text-anchor="middle" fill="#245FAD">CAPACITORES</text>
<text x="65" y="928" font-size="17">Se o banco fica no quadro geral, só o trecho a montante</text>
<text x="65" y="953" font-size="17">de sua conexão recebe a compensação da corrente reativa.</text>
<path d="M65 981 L775 981" stroke="#22384D" stroke-width="2" fill="none" />
<text x="65" y="1017" font-size="21" font-weight="700" fill="#245FAD">3  MACETES E PEGADINHAS</text>
<text x="65" y="1050" font-size="15">P = trabalho (kW) | Q = campo magnético (kvar) | S = rede (kVA)</text>
<text x="65" y="1078" font-size="15" font-weight="700" fill="#245FAD">FP aumenta → Q da rede diminui → S diminui → I diminui.</text>
<text x="65" y="1104" font-size="15">Banco fixo pode sobrecompensar quando a carga diminui.</text>
<text x="65" y="1131" font-size="15">Para baixa carga variável, avaliar banco automático em estágios.</text>
</g></svg>
