<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 900 1272">
<title>Eletronuclear 2022 questão 54: contagem de condutores em eletroduto antes e depois do three-way</title>
<desc>Diagrama didático colorido. Antes, dois condutores F1 e N1 no trecho da tomada para a caixa do teto. Depois, F1 N1 F2 V1 e V2, total cinco. O retorno R2 e neutro N2 da iluminação não atravessam este trecho; são encaminhados por outros trechos.</desc>
<rect width="900" height="1272" fill="#F8FAFC" />
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#22384D">
<text x="50" y="64" font-size="28" font-weight="bold" fill="#245FAD">CONTAGEM DE CONDUTORES EM ELETRODUTOS</text>
<text x="50" y="98" font-size="18">CESGRANRIO / ELETRONUCLEAR 2022 • Questão 54 • CARD-0454</text>
<path d="M50 115H850" stroke="#22384D" stroke-width="3" />

<rect x="50" y="140" width="800" height="333" fill="white" stroke="#22384D" stroke-width="2.4" />
<text x="72" y="180" font-size="24" font-weight="bold" fill="#245FAD">ANTES — INTERRUPTOR SIMPLES (UM LOCAL)</text>
<text x="72" y="210" font-size="17">Trecho analisado: TOMADA (circuito 1) → CAIXA DE LUZ NO TETO</text>
<rect x="92" y="270" width="145" height="113" rx="5" fill="white" stroke="#22384D" stroke-width="3" />
<text x="164" y="302" font-size="20" font-weight="bold" text-anchor="middle" fill="#245FAD">TOMADA</text>
<text x="164" y="327" font-size="16" text-anchor="middle">Circuito 1</text>
<text x="164" y="352" font-size="13" text-anchor="middle">F1 + N1</text>
<rect x="642" y="270" width="160" height="113" rx="5" fill="white" stroke="#22384D" stroke-width="3" />
<text x="722" y="306" font-size="19" font-weight="bold" text-anchor="middle" fill="#245FAD">CAIXA</text>
<text x="722" y="330" font-size="18" text-anchor="middle">DO TETO</text>
<text x="722" y="354" font-size="13" text-anchor="middle">chega do quadro</text>
<g stroke="#22384D" stroke-width="3" fill="none">
<path d="M237 296H642" style="stroke:#C45E15" stroke="#C45E15" /><path d="M237 335H642" style="stroke:#245FAD" stroke="#245FAD" />
</g>
<text x="443" y="287" font-size="19" text-anchor="middle" font-weight="bold" fill="#C45E15" style="fill:#C45E15">F1 — fase da tomada</text>
<text x="443" y="358" font-size="19" text-anchor="middle" font-weight="bold" fill="#245FAD" style="fill:#245FAD">N1 — neutro da tomada</text>
<rect x="319" y="406" width="256" height="49" rx="5" fill="#D8F1EA" stroke="#087F83" stroke-width="2.2" style="fill:#D8F1EA;stroke:#087F83" />
<text x="447" y="439" font-size="27" font-weight="bold" text-anchor="middle" fill="#245FAD">2 CONDUTORES</text>

<rect x="50" y="500" width="800" height="522" fill="white" stroke="#22384D" stroke-width="2.4" />
<text x="72" y="541" font-size="24" font-weight="bold" fill="#245FAD">DEPOIS — DOIS INTERRUPTORES THREE-WAY</text>
<text x="72" y="571" font-size="17">Novo 3-way junto à tomada; comando no circuito 2 (independente)</text>
<rect x="92" y="668" width="145" height="228" rx="5" fill="white" stroke="#22384D" stroke-width="3" />
<text x="164" y="710" font-size="19" font-weight="bold" text-anchor="middle" fill="#245FAD">TOMADA</text>
<text x="164" y="736" font-size="15" text-anchor="middle">Circuito 1</text>
<path d="M109 750H220" stroke="#22384D" stroke-width="1.2" />
<text x="164" y="788" font-size="17" font-weight="bold" text-anchor="middle" fill="#245FAD">3-WAY NOVO</text>
<text x="164" y="813" font-size="15" text-anchor="middle">Circuito 2</text>
<circle cx="163" cy="853" r="9" fill="white" stroke="#22384D" stroke-width="2" />
<text x="163" y="882" font-size="13" text-anchor="middle">comum = F2</text>
<rect x="642" y="668" width="160" height="228" rx="5" fill="white" stroke="#22384D" stroke-width="3" />
<text x="722" y="718" font-size="19" font-weight="bold" text-anchor="middle" fill="#245FAD">CAIXA</text>
<text x="722" y="745" font-size="18" text-anchor="middle">DO TETO</text>
<path d="M661 764H781" stroke="#22384D" stroke-width="1.2" />
<text x="722" y="798" font-size="14" text-anchor="middle">F2 vai ao</text>
<text x="722" y="820" font-size="14" text-anchor="middle">novo 3-way</text>
<text x="722" y="854" font-size="14" text-anchor="middle">V1 e V2 seguem</text>
<text x="722" y="876" font-size="14" text-anchor="middle">ao antigo 3-way</text>
<g stroke="#22384D" stroke-width="2.5" fill="none">
<path d="M237 676H642" style="stroke:#C45E15" stroke="#C45E15" /><path d="M237 705H642" style="stroke:#245FAD" stroke="#245FAD" />
<path d="M237 750H642" stroke-dasharray="12 6" style="stroke:#C45E15" stroke="#C45E15" />
<path d="M237 795H642" style="stroke:#087F83" stroke="#087F83" />
<path d="M237 840H642" style="stroke:#754DA4" stroke="#754DA4" />
</g>
<g font-size="17" text-anchor="middle" font-weight="bold">
<text x="440" y="650" style="fill:#C45E15" fill="#C45E15">F1 — fase da TOMADA</text>
<text x="440" y="695" style="fill:#245FAD" fill="#245FAD">N1 — neutro da TOMADA</text>
<text x="440" y="740" style="fill:#C45E15" fill="#C45E15">F2 — fase para o NOVO 3-way</text>
<text x="440" y="785" style="fill:#087F83" fill="#087F83">V1 — viajante do 3-way</text>
<text x="440" y="830" style="fill:#754DA4" fill="#754DA4">V2 — viajante do 3-way</text>
</g>
<rect x="283" y="930" width="329" height="64" rx="5" fill="#D8F1EA" stroke="#087F83" stroke-width="2.5" style="fill:#D8F1EA;stroke:#087F83" />
<text x="447" y="972" font-size="32" font-weight="bold" text-anchor="middle" fill="#245FAD">2 + 3 = 5 FIOS</text>

<rect x="50" y="1050" width="800" height="156" fill="white" stroke="#22384D" stroke-width="2" />
<text x="70" y="1085" font-size="23" font-weight="bold" fill="#245FAD">O QUE NÃO PASSA NO TRECHO DA TOMADA?</text>
<text x="70" y="1122" font-size="18">N2: chega à luminária pela caixa do teto, vindo do circuito 2.</text>
<text x="70" y="1153" font-size="18">R2: sai do 3-way antigo e volta à luminária por outro trecho.</text>
<text x="70" y="1184" font-size="18" font-weight="bold" fill="#245FAD">PEGADINHA: contar V1 e V2, mas esquecer a FASE F2.</text>
<text x="50" y="1242" font-size="14">Diagrama funcional e contagem do trecho da prova; não representa projeto executivo. PE excluído pelo enunciado.</text>
</g>
</svg>
