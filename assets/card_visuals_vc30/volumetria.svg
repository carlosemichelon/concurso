<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" fill="white"/><g font-family="Arial,sans-serif"><text x="400" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#173554">Mistura asfáltica compactada — volumes</text><rect x="120" y="75" width="320" height="12" fill="#bfdbfe" stroke="#64748b"/><rect x="120" y="87" width="320" height="36" fill="#fbbf24" stroke="#64748b"/><rect x="120" y="123" width="320" height="252" fill="#a8b4bf" stroke="#64748b"/><path d="M440 81H470L500 70H720" stroke="#2563eb" fill="none" stroke-width="2"/><text x="505" y="64" font-size="18" fill="#1d4ed8">Ar = Vv = 4%</text><path d="M440 106H480L500 145H720" stroke="#b45309" fill="none" stroke-width="2"/><text x="505" y="137" font-size="18" fill="#92400e">Ligante efetivo = 12%</text><text x="280" y="245" font-size="20" text-anchor="middle" fill="#173554">Agregado (volume aparente)</text><text x="280" y="270" font-size="20" text-anchor="middle" fill="#173554">84%</text><path d="M105 75H94V123H105" stroke="#166534" stroke-width="3" fill="none"/><text transform="translate(70 100) rotate(-90)" font-size="17" fill="#166534" text-anchor="middle">VAM 16%</text><text x="500" y="235" font-size="20" fill="#173554">RBV = 12/16 × 100</text><text x="500" y="265" font-size="24" font-weight="bold" fill="#166534">75%</text><text x="400" y="405" font-size="16" fill="#334155" text-anchor="middle">Exemplo ilustrativo: não representa limites normativos.</text></g></svg>