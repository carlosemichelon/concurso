<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petrobras 27 e 29 — cartões integrados | V347</title><style>body{font:16px/1.55 system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17243b}a{color:#155c8a}article{border:1px solid #d9e2e9;border-radius:12px;padding:1rem;margin:1rem 0}button{background:#e8f2f5;border:1px solid #78a4b5;padding:.45rem .8rem;border-radius:5px;cursor:pointer;margin:.2rem}summary{cursor:pointer;color:#155c8a}h4{margin-bottom:.3rem}p{white-space:pre-wrap}</style></head><body><a href="index.html">← Banco Mestre V347</a><h1>Petrobras 27 e 29</h1><p>15 cartões integrados. Tente recuperar a resposta antes de revelar o verso e os 11 módulos. A agenda privada permanece no Banco Mestre.</p><main id="cards">Carregando…</main><script src="assets/v347_retro_renderer.js"></script><script>BM347Retro.load().then(d=>{const main=document.getElementById('cards');main.replaceChildren();for(const c of d.new_cards){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=c.id+' — '+c.sub;const q=document.createElement('p');q.textContent=c.front;const det=document.createElement('details');const s=document.createElement('summary');s.textContent='Revelar resposta';det.append(s,BM347Retro.make(d.profiles[c.id],d));a.append(h,q,det);main.append(a)}}).catch(()=>{document.getElementById('cards').textContent='Não foi possível carregar os cartões.'})</script></body></html>
