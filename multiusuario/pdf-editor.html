<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src data: blob:; worker-src blob: https://cdnjs.cloudflare.com; connect-src https://cdnjs.cloudflare.com; font-src data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><title>Editor de PDF privado</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;color:#17353b;background:#edf2f1}header{position:sticky;top:0;z-index:2;background:white;border-bottom:1px solid #d7e2e1;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button{border:1px solid #bbcfcc;border-radius:8px;background:white;color:#17353b;padding:7px 10px;cursor:pointer}button[aria-pressed=true]{background:#16616a;color:white}button:disabled{opacity:.5}#msg{flex-basis:100%;font-size:12px;color:#526c7b}main{overflow:auto;padding:10px;display:flex;justify-content:flex-start}#wrap{position:relative;margin:auto;flex:none;box-shadow:0 2px 12px #a3b9b9}canvas{display:block}#ink{position:absolute;inset:0;touch-action:none;mix-blend-mode:multiply}#color{width:34px;height:32px;border:1px solid #d7e2e1;background:white}#page{width:64px;padding:5px}#width{width:70px}label{display:flex;align-items:center;gap:4px}</style></head><body><header><button id="prev">← Página</button><input id="page" type="number" min="1" value="1" aria-label="Página"><span id="total">/ —</span><button id="next">Próxima →</button><button id="minus">−</button><button id="plus">+ Zoom</button><button id="fit">Largura</button><button data-tool="pen">Caneta</button><button data-tool="highlighter" aria-pressed="true">Grifar</button><button data-tool="rect">Retângulo</button><button data-tool="eraser">Borracha</button><button data-tool="pan">Mover</button><label>Cor <input type="color" id="color" value="#ffd400"></label><label>Traço <input type="range" id="width" min="1" max="40" value="12"></label><button id="undo">Desfazer</button><button id="redo">Refazer</button><button id="clear">Limpar página</button><span id="msg" role="status">Carregando editor…</span></header><main><div id="wrap"><canvas id="base"></canvas><canvas id="ink" aria-label="Camada de marcações"></canvas></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" referrerpolicy="no-referrer"></script>
<script>
'use strict';const $=x=>document.getElementById(x),ink=$('ink'),base=$('base'),ctx=ink.getContext('2d'),pageCtx=base.getContext('2d');let nonce='',pdf=null,page=1,pages={},tool='highlighter',zoom=1,fitMode=true,draft=null,ready=false,busy=false,undo=[],redo=[],markPending=false;
const copy=x=>JSON.parse(JSON.stringify(x)),msg=x=>$('msg').textContent=x,post=x=>parent.postMessage({channel:'bm-private-pdf',nonce,...x},'*'),strokes=()=>pages[page]||[];
function point(e){const r=ink.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),.65]}
function drawOne(m){ctx.save();ctx.globalAlpha=m.type==='pen'?1:.35;ctx.strokeStyle=ctx.fillStyle=m.color;ctx.lineJoin=ctx.lineCap='round';if(m.type==='rect'){const [a,b,c,d]=m.box;ctx.fillRect(Math.min(a,c)*ink.width,Math.min(b,d)*ink.height,Math.abs(c-a)*ink.width,Math.abs(d-b)*ink.height)}else{ctx.lineWidth=Math.max(1,Math.min(ink.width,ink.height)*m.size/1000*(m.type==='highlighter'?1.7:1));const p=m.points;ctx.beginPath();ctx.moveTo(p[0][0]*ink.width,p[0][1]*ink.height);if(p.length===1)ctx.lineTo(p[0][0]*ink.width+.1,p[0][1]*ink.height+.1);else for(const [x,y] of p.slice(1))ctx.lineTo(x*ink.width,y*ink.height);ctx.stroke()}ctx.restore()}
function paint(){ctx.clearRect(0,0,ink.width,ink.height);strokes().forEach(drawOne);if(draft)drawOne(draft);$('undo').disabled=!undo.length||markPending;$('redo').disabled=!redo.length||markPending}
function checkpoint(){undo.push(copy(strokes()));if(undo.length>50)undo.shift();redo=[]}
function save(){markPending=true;post({type:'marks',page,strokes:copy(strokes())});msg('Enviando marcações à sessão privada…');paint()}
function modify(next){if(!ready||busy||markPending)return;checkpoint();pages[page]=next;save()}
async function render(){if(!pdf||busy)return;busy=true;ready=false;try{const p=await pdf.getPage(page),v0=p.getViewport({scale:1});const scale=Math.min(fitMode?Math.max(.25,(document.documentElement.clientWidth-24)/v0.width):zoom,3,Math.sqrt(15000000/(v0.width*v0.height)));const v=p.getViewport({scale});base.width=ink.width=Math.ceil(v.width);base.height=ink.height=Math.ceil(v.height);await p.render({canvasContext:pageCtx,viewport:v}).promise;$('page').value=page;$('total').textContent='/ '+pdf.numPages;$('page').max=pdf.numPages;paint();ready=true;msg('Página '+page+' · original preservado · traços vetoriais normalizados.')}catch(e){msg(e.message);post({type:'error',message:e.message})}finally{busy=false}}
function go(p){if(busy||markPending||!pdf)return;page=Math.max(1,Math.min(pdf.numPages,Number(p)||1));undo=[];redo=[];draft=null;void render()}
$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('page').onchange=e=>go(e.target.value);$('plus').onclick=()=>{if(!busy){fitMode=false;zoom=Math.min(3,zoom*1.25);void render()}};$('minus').onclick=()=>{if(!busy){fitMode=false;zoom=Math.max(.25,zoom/1.25);void render()}};$('fit').onclick=()=>{fitMode=true;void render()};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));ink.style.touchAction=tool==='pan'?'auto':'none';ink.style.pointerEvents=tool==='pan'?'none':'auto'});
ink.onpointerdown=e=>{if(!ready||busy||markPending||tool==='pan'||e.button!==0)return;const p=point(e);if(tool==='eraser'){let i=strokes().findLastIndex(m=>m.type==='rect'?(p[0]>=Math.min(m.box[0],m.box[2])&&p[0]<=Math.max(m.box[0],m.box[2])&&p[1]>=Math.min(m.box[1],m.box[3])&&p[1]<=Math.max(m.box[1],m.box[3])):m.points.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<.025));if(i>=0)modify(strokes().filter((_,j)=>j!==i));return}if(strokes().length>=2000){msg('Limite de marcações na página');return}e.preventDefault();ink.setPointerCapture(e.pointerId);draft={type:tool,color:$('color').value,size:Number($('width').value),...(tool==='rect'?{box:[p[0],p[1],p[0],p[1]]}:{points:[p]})};paint()};
ink.onpointermove=e=>{if(!draft)return;const p=point(e);if(draft.type==='rect'){draft.box[2]=p[0];draft.box[3]=p[1]}else if(draft.points.length<20000)draft.points.push(p);paint()};ink.onpointerup=()=>{if(!draft)return;const m=draft;draft=null;modify([...strokes(),m])};ink.onpointercancel=()=>{draft=null;paint()};
$('undo').onclick=()=>{if(!ready||!undo.length||markPending)return;redo.push(copy(strokes()));pages[page]=undo.pop();save()};$('redo').onclick=()=>{if(!ready||!redo.length||markPending)return;undo.push(copy(strokes()));pages[page]=redo.pop();save()};$('clear').onclick=()=>{if(strokes().length&&confirm('Limpar as marcações desta página, mantendo o original?'))modify([])};
window.addEventListener('message',async e=>{if(e.source!==parent||e.data?.channel!=='bm-private-pdf')return;const m=e.data;if(m.type==='init'&&!nonce){nonce=m.nonce;pages=m.pages||{};try{if(!window.pdfjsLib)throw Error('PDF.js indisponível');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdf=await pdfjsLib.getDocument({data:new Uint8Array(m.bytes),isEvalSupported:false,disableFontFace:true,disableAutoFetch:true,disableStream:true}).promise;await render()}catch(err){msg(err.message);post({type:'error',message:err.message})}}else if(m.nonce===nonce&&m.type==='ack'){markPending=false;msg('Marcações registradas no banco da conta; aguarde confirmação da sincronização no portal.');paint()}else if(m.nonce===nonce&&m.type==='reject'){markPending=false;msg('Não registrado: '+m.message+' — use desfazer ou feche e reabra para recuperar os dados salvos.');paint()}});
post({type:'ready'});
</script></body></html>
