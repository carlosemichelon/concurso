'use strict';const $=x=>document.getElementById(x),ink=$('ink'),base=$('base'),ctx=ink.getContext('2d'),pageCtx=base.getContext('2d');let nonce='',pdf=null,page=1,pages={},tool='highlighter',zoom=1,fitMode=true,draft=null,ready=false,busy=false,undo=[],redo=[],markPending=false,clearArmed=false,sourceBytes=null,selection=null,viewPort=null;

const colors={"rule":"#FDE68A","subject":"#BBF7D0","condition":"#BAE6FD","exception":"#FECDD3"};function drawOne(m){ctx.save();ctx.globalAlpha=m.type==='pen'?1:.35;ctx.strokeStyle=ctx.fillStyle=m.color;ctx.lineJoin=ctx.lineCap='round';if(m.type==='text'){for(const [a,b,c,d] of m.boxes)ctx.fillRect(a*ink.width,b*ink.height,(c-a)*ink.width,(d-b)*ink.height)}else if(m.type==='rect'){const [a,b,c,d]=m.box;ctx.fillRect(Math.min(a,c)*ink.width,Math.min(b,d)*ink.height,Math.abs(c-a)*ink.width,Math.abs(d-b)*ink.height)}else{ctx.lineWidth=Math.max(1,Math.min(ink.width,ink.height)*m.size/1000*(m.type==='highlighter'?1.7:1));const p=m.points;ctx.beginPath();ctx.moveTo(p[0][0]*ink.width,p[0][1]*ink.height);if(p.length===1)ctx.lineTo(p[0][0]*ink.width+.1,p[0][1]*ink.height+.1);else for(const [x,y] of p.slice(1))ctx.lineTo(x*ink.width,y*ink.height);ctx.stroke()}ctx.restore()}

window.addEventListener('message',async e=>{if(e.source!==parent||e.data?.channel!=='bm-private-pdf')return;const m=e.data;if(m.type==='init'&&!nonce){nonce=m.nonce;pages=m.pages||{};sourceBytes=new Uint8Array(m.bytes).slice();try{if(!window.pdfjsLib)throw Error('PDF.js indisponível');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdf=await pdfjsLib.getDocument({data:new Uint8Array(m.bytes),isEvalSupported:false,disableFontFace:true,disableAutoFetch:true,disableStream:true}).promise;page=Math.max(1,Math.min(pdf.numPages,Number(m.startPage)||1));await render()}catch(err){msg(err.message);post({type:'error',message:err.message})}}else if(m.nonce===nonce&&m.type==='ack'){markPending=false;msg('Marcações registradas no banco da conta; aguarde confirmação da sincronização no portal.');paint()}else if(m.nonce===nonce&&m.type==='reject'){markPending=false;msg('Não registrado: '+m.message+' — use desfazer ou feche e reabra para recuperar os dados salvos.');paint()}});
function captureSelection(){if(tool!=='text'||!ready||busy)return;const sel=window.getSelection();if(!sel||sel.isCollapsed||sel.rangeCount!==1)return;const r=sel.getRangeAt(0),tl=$('textLayer');if(!tl.contains(r.startContainer)||!tl.contains(r.endContainer))return;const quote=sel.toString();if(!quote.trim()||quote.length>12000)return;const bounds=ink.getBoundingClientRect(),clamp=x=>Math.min(1,Math.max(0,x));const boxes=Array.from(r.getClientRects()).map(b=>[clamp((b.left-bounds.left)/bounds.width),clamp((b.top-bounds.top)/bounds.height),clamp((b.right-bounds.left)/bounds.width),clamp((b.bottom-bounds.top)/bounds.height)]).filter(b=>b[2]>b[0]&&b[3]>b[1]);if(boxes.length&&boxes.length<=300)selection={quote,boxes,page}}

$('highlightText').onpointerdown=e=>e.preventDefault();

async function exportAnnotated(){if(!ready||busy||markPending||!sourceBytes)return;busy=true;const old=$('exportCopy').textContent;$('exportCopy').disabled=true;try{if(!window.PDFLib)throw Error('Biblioteca de exportação indisponível');const doc=await PDFLib.PDFDocument.load(sourceBytes.slice(),{updateMetadata:false});const all=doc.getPages();for(const [key,marks] of Object.entries(pages)){const index=Number(key)-1;if(index<0||index>=all.length)throw Error('Página de marcação inválida');const pg=all[index],p=await pdf.getPage(index+1),v=p.getViewport({scale:1});const point=(x,y)=>{const [a,b]=v.convertToPdfPoint(x*v.width,y*v.height);return {x:a,y:b}};for(const m of marks){const hex=m.color.slice(1),rgb=PDFLib.rgb(parseInt(hex.slice(0,2),16)/255,parseInt(hex.slice(2,4),16)/255,parseInt(hex.slice(4,6),16)/255),opacity=m.type==='pen'?1:.32;const rect=b=>{const pts=[point(b[0],b[1]),point(b[2],b[3])];const x=Math.min(...pts.map(p=>p.x)),y=Math.min(...pts.map(p=>p.y)),width=Math.abs(pts[1].x-pts[0].x),height=Math.abs(pts[1].y-pts[0].y);if(width&&height)pg.drawRectangle({x,y,width,height,color:rgb,opacity,blendMode:PDFLib.BlendMode.Multiply})};if(m.type==='text'){m.boxes.forEach(rect)}else if(m.type==='rect'){rect(m.box)}else{const pts=m.points.map(p=>point(p[0],p[1])),thickness=Math.max(.6,Math.min(v.width,v.height)*m.size/1000*(m.type==='highlighter'?1.7:1));if(pts.length===1)pg.drawCircle({x:pts[0].x,y:pts[0].y,size:thickness/2,color:rgb,opacity});for(let j=1;j<pts.length;j++)pg.drawLine({start:pts[j-1],end:pts[j],thickness,color:rgb,opacity})}}}const bytes=await doc.save();const ab=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);parent.postMessage({channel:'bm-private-pdf',nonce,type:'export',bytes:ab},'*',[ab]);msg('Cópia anotada gerada; arquivo original preservado.')}catch(e){msg('Exportação não concluída: '+e.message)}finally{busy=false;$('exportCopy').disabled=false;$('exportCopy').textContent=old}}
