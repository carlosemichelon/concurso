name: Editor de imagens VS28 — teste pontual
on:
  push:
    branches: [correcao/editor-imagens-vs28]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/v419_image_flags.js && node --check assets/v419_js_000_001_editor.js && node --check assets/v419_js_040_051_atlas.js && node --check assets/v419_js_088_099_atlas_editor.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/bm419-server.log 2>&1 &
          node tests/v419_flags.cjs
