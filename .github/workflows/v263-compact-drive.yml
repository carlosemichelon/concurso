name: Banco Mestre V263 - cabeçalho compacto e Drive confiável
on:
  pull_request:
    branches: [gh-pages]
    paths: ['v263.html', 'assets/v263*', 'tests/v263*', 'v277.html', 'assets/v277*', 'tests/v277*', 'v298.html', 'assets/v298*', 'tests/v298*', 'v300.html', 'assets/v300*', 'tests/v300*', 'v303.html', 'assets/v303*', 'tests/v303*', 'v307.html', 'assets/v307*', 'tests/v307*', 'v310.html', 'assets/v310*', 'tests/v310*', 'v262.html', 'assets/v262*', 'tests/v262*', 'v121.html', 'assets/v121*', 'tests/v121*', 'v124.html', 'assets/v124*', 'tests/v124*', 'v214.html', 'assets/v214*', 'tests/v214*', 'v216.html', 'assets/v216*', 'tests/v216*', 'v217.html', 'assets/v217*', 'tests/v217*', 'v219.html', 'assets/v219*', 'tests/v219*', 'v222.html', 'assets/v222*', 'tests/v222*', 'v225.html', 'assets/v225*', 'tests/v225*', 'v228.html', 'assets/v228*', 'tests/v228*', '.github/workflows/v263-compact-drive.yml']
  push:
    branches: [gh-pages]
    paths: ['v263.html', 'assets/v263*', 'tests/v263*', 'v277.html', 'assets/v277*', 'tests/v277*', 'v298.html', 'assets/v298*', 'tests/v298*', 'v300.html', 'assets/v300*', 'tests/v300*', 'v303.html', 'assets/v303*', 'tests/v303*', 'v307.html', 'assets/v307*', 'tests/v307*', 'v310.html', 'assets/v310*', 'tests/v310*', 'v262.html', 'assets/v262*', 'tests/v262*', 'v121.html', 'assets/v121*', 'tests/v121*', 'v124.html', 'assets/v124*', 'tests/v124*', 'v214.html', 'assets/v214*', 'tests/v214*', 'v216.html', 'assets/v216*', 'tests/v216*', 'v217.html', 'assets/v217*', 'tests/v217*', 'v219.html', 'assets/v219*', 'tests/v219*', 'v222.html', 'assets/v222*', 'tests/v222*', 'v225.html', 'assets/v225*', 'tests/v225*', 'v228.html', 'assets/v228*', 'tests/v228*', '.github/workflows/v263-compact-drive.yml']
  workflow_dispatch:
jobs:
  v263-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar integridade do portal e regressões V262
        run: |
          node tests/v263_static_integrity.cjs
          node tests/v277_header_bundle.cjs
          node --check assets/v300_simple_filters.js
          node --check assets/v300_lacunas_ui.js
          node tests/v300_ui_static.cjs
          node --check assets/v303_unified_filters.js
          node --check assets/v303_compact_bibliotecas.js
          node --check assets/v303_toolbar_reorder.js
          node tests/v303_current_ui_static.cjs
          node tests/v310_image_taxonomy.cjs
          node tests/v262_layout_sync.test.cjs
          node tests/v121_integridade_portal.cjs
          node tests/v124_integridade_portal.cjs
          node tests/v214_gallery_integrity.cjs
          node tests/v216_single_drive_auth.cjs
          node tests/v217_hybrid_drive_media.cjs
          node tests/v219_image_metadata.cjs
          node tests/v222_v1_regressions.cjs
          node tests/v225_legal_search_oauth.cjs
          node tests/v228_drive_editor.cjs
  v263-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Testar carregamento real e mock isolado do Drive
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bm-v263.log 2>&1 &
          sleep 2
          node tests/v263_browser.cjs
          node tests/v277_header_browser.cjs
          node tests/v298_visual_browser.cjs
          node tests/v300_ui_browser.cjs
          node tests/v303_ui_browser.cjs
          node tests/v307_mobile_matrix.cjs
      - name: Proteger a versão anterior V262
        run: node tests/v262_browser.cjs
      - name: Guardar capturas V298 (somente dados públicos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-visual-v298
          path: |
            test-artifacts/v298/
            test-artifacts/v307-mobile/
          if-no-files-found: ignore
