name: Banco Mestre V262 - integridade do layout e sincronização
on:
  pull_request:
    branches: [gh-pages]
    paths: ['v262.html', 'assets/v262*', 'tests/v262*', 'v121.html', 'assets/v121*', 'tests/v121*', 'v124.html', 'assets/v124*', 'tests/v124*', 'v214.html', 'assets/v214*', 'tests/v214*', 'v216.html', 'assets/v216*', 'tests/v216*', 'v217.html', 'assets/v217*', 'tests/v217*', 'v219.html', 'assets/v219*', 'tests/v219*', 'v222.html', 'assets/v222*', 'tests/v222*', 'v225.html', 'assets/v225*', 'tests/v225*', 'v228.html', 'assets/v228*', 'tests/v228*', '.github/workflows/v262-layout-sync.yml']
  push:
    branches: [gh-pages]
    paths: ['v262.html', 'assets/v262*', 'tests/v262*', 'v121.html', 'assets/v121*', 'tests/v121*', 'v124.html', 'assets/v124*', 'tests/v124*', 'v214.html', 'assets/v214*', 'tests/v214*', 'v216.html', 'assets/v216*', 'tests/v216*', 'v217.html', 'assets/v217*', 'tests/v217*', 'v219.html', 'assets/v219*', 'tests/v219*', 'v222.html', 'assets/v222*', 'tests/v222*', 'v225.html', 'assets/v225*', 'tests/v225*', 'v228.html', 'assets/v228*', 'tests/v228*', '.github/workflows/v262-layout-sync.yml']
  workflow_dispatch:
jobs:
  v262-static-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar V262 e testes históricos independentes de versão
        run: |
          node tests/v262_layout_sync.test.cjs
          node tests/v121_integridade_portal.cjs
          node tests/v124_integridade_portal.cjs
          node tests/v214_gallery_integrity.cjs
          node tests/v216_single_drive_auth.cjs
          node tests/v217_hybrid_drive_media.cjs
          node tests/v219_image_metadata.cjs
          node tests/v222_v1_regressions.cjs
          node tests/v225_legal_search_oauth.cjs
          node tests/v228_drive_editor.cjs
  v262-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de homologação
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Avaliar layout real e JS V262
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bm-v262.log 2>&1 &
          sleep 2
          node tests/v262_browser.cjs
