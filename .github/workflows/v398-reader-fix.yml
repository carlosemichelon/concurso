name: Verificar correção do leitor VS10
on:
  push:
    branches: [correcao/leitor-vs10]
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/catalog_snapshot.cjs --check
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/v398_reader_regression.cjs
