name: Banco Mestre — verificacoes Site V2
on:
  push:
    branches:
      - 'feature/site-v2-*'
    paths:
      - 'v2/**'
      - '.github/workflows/v2-checks.yml'
  pull_request:
    branches:
      - gh-pages
    paths:
      - 'v2/**'
      - '.github/workflows/v2-checks.yml'
permissions:
  contents: read
jobs:
  v2-catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe da V2
        run: |
          node --check v2/assets/data.js
          node --check v2/assets/app.js
          node --check v2/assets/drive.js
          node --check v2/assets/drive-ui.js
          node --check v2/assets/audit.js
          node --check v2/assets/audit-ui.js
          node --check v2/assets/deployment.js
          node --check v2/assets/deployment-ui.js
          node --check v2/assets/evolutive.js
          node --check v2/assets/evolutive-ui.js
          node --check v2/assets/pdf-compat.js
          node --check v2/assets/pdf-reader.js
          node --check v2/assets/pdf-overlay.js
          node --check v2/assets/pdf-overlay-ui.js
          node --check v2/assets/pdf-identity.js
          node --check v2/assets/drive-media.js
          node --check v2/assets/catalog-probe.js
          node --check v2/assets/catalog-probe-ui.js
          node --check v2/assets/oauth-readiness.js
          node --check v2/assets/oauth-readiness-ui.js
      - name: Conferir integridade da base pública e contrato
        run: |
          node v2/tests/smoke.mjs
          node v2/tests/drive.mjs
          node v2/tests/audit.mjs
          node v2/tests/deployment.mjs
          node v2/tests/evolutive.mjs
          node v2/tests/related-images.mjs
          node v2/tests/pdf-compat.mjs
          node v2/tests/pdf-overlay.mjs
          node v2/tests/drive-media.mjs
          node v2/tests/catalog-probe.mjs
          node v2/tests/oauth-readiness.mjs
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright para teste de interface
        run: |
          npm install --no-save playwright@1.56.1 pdfjs-dist@3.11.174
          npx playwright install --with-deps chromium
      - name: Testar a V2 no Chromium sem login privado
        run: |
          node v2/tests/browser.mjs
          node v2/tests/browser-drive.mjs
