name: Banco Mestre V219 - nomes e assuntos de imagens
on:
  push:
    branches:
      - staging/v219-image-titles-subjects-2026-11-17
      - gh-pages
    paths:
      - v219.html
      - assets/v218_image_metadata.js
      - assets/v218_drive_gallery_feed.js
      - assets/v218_single_image_viewer.js
      - tests/v219_image_metadata.cjs
      - .github/workflows/validar-v219-imagens.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  labels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check assets/v218_image_metadata.js
          node --check assets/v218_drive_gallery_feed.js
          node --check assets/v218_single_image_viewer.js
          node --check tests/v219_image_metadata.cjs
      - name: Testar 93 assuntos conhecidos, 144 pendencias e cartao C004
        run: node tests/v219_image_metadata.cjs
