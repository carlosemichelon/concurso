name: Banco Mestre V228 - editor de imagens Drive restaurado
on:
  push:
    branches:
      - staging/v227-image-editor-restored-2026-11-17
      - gh-pages
    paths:
      - v228.html
      - assets/v228_drive_image_editor.js
      - assets/v228_drive_gallery_feed.js
      - assets/v228_footer_version.js
      - assets/version.json
      - index.html
      - tests/v228_drive_editor.cjs
      - .github/workflows/validar-v228-editor.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check assets/v228_drive_image_editor.js
          node --check assets/v228_drive_gallery_feed.js
          node --check assets/v228_footer_version.js
          node --check tests/v228_drive_editor.cjs
      - name: Verificar integridade dos dados e do editor
        run: node tests/v228_drive_editor.cjs
