name: VS44 - indice privado de materiais
on:
  push:
    branches: ['correcao/vs44-indice-midias', 'gh-pages']
    paths: ['index.html', 'assets/bm-account/connection-v435.js', 'assets/bm-account/v435_js_002_015_topic_media.js', 'infra/vs41-private/browser-account-v435.mjs', 'tests/v435*', '.github/workflows/v435-media-index.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check infra/vs41-private/browser-account-v435.mjs && node --check assets/bm-account/connection-v435.js && node --check assets/bm-account/v435_js_002_015_topic_media.js
      - run: node --test tests/vs41_browser_drive.test.mjs tests/v435_browser_account.test.mjs tests/v435_topic_search.cjs
      - run: node tools/catalog_snapshot.cjs --check
      - run: npm install --no-save playwright pdfjs-dist@3.11.174
      - run: npx playwright install --with-deps chromium
      - run: node tests/v435_topic_browser.cjs
      - run: node tests/vs41_original_account_browser.mjs .
