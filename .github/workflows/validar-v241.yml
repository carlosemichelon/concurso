name: V241 - Cronômetro e integridade do Drive
on:
  push:
    branches:
      - 'homologacao/v241-*'
  pull_request:
    branches:
      - gh-pages
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-v241:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar contratos do portal
        run: node --test tests/v241_smoke.test.cjs
      - name: Instalar Chromium para testes de interação
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Testar cronômetro e navegação em navegador real (sem OAuth)
        run: node --test tests/v241_browser.test.cjs
