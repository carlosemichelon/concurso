name: Portal isolation regression
on:
  push:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'assets/version.json'
      - 'assets/**/*.js'
      - 'infra/vs41-private/**'
      - '.github/workflows/portal-isolation-regression.yml'
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test infra/vs41-private/portal-isolation.test.mjs
