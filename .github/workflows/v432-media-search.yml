name: VS41 - busca tematica de midias
on:
  push:
    branches: ['correcao/vs41-busca-midias']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/v432_js_002_015_topic_media.js && node --check assets/v432_js_040_051_atlas.js
      - run: node --test tests/v432_media_search.cjs tests/v371_drive_changes.test.cjs
      - run: node tools/catalog_snapshot.cjs --check
