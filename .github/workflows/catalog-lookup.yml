name: Índice derivado do catálogo oficial
on:
  push:
    branches: [gh-pages, manutencao/indice-vigente-vc35]
    paths:
      - 'assets/version.json'
      - 'assets/catalog_snapshot_*.json'
      - 'tools/catalog_lookup.cjs'
      - '.github/workflows/catalog-lookup.yml'
permissions:
  contents: write
concurrency:
  group: catalog-lookup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar índice conforme a revisão corrente, sem sobrescrever concorrentes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout --detach FETCH_HEAD
            node tools/catalog_snapshot.cjs --check
            node tools/catalog_lookup.cjs
            node tools/catalog_lookup.cjs --check
            git add -- assets/catalog_lookup
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Atualizar índice derivado do catálogo vigente'
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            echo 'Publicação concorrente: recalcular índice sobre a revisão mais recente.'
          done
          exit 1
