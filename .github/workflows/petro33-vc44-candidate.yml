name: Validar Petrobras 33
on:
  push:
    branches: ['estudo/petro33-vc44']
    paths: ['assets/petro33_publish_request.json']
permissions:
  contents: write
concurrency:
  group: petro33-vc44
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materializar e validar contrato
        run: |
          echo "CATALOG_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node tools/catalog_petro33_release.cjs
          node tools/catalog_snapshot.cjs --check
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/catalog_reader_gate.cjs "$CATALOG_BASE"
      - run: node tools/catalog_lookup.cjs
      - name: Registrar candidato validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          HOME_FILE=$(node -p "require('./assets/version.json').home")
          SNAP=$(node -p "require('./assets/version.json').catalog.path")
          git add -A -- assets/version.json "$SNAP" assets/catalog_lookup index.html "$HOME_FILE" assets/petro33 assets/petro33_new_cards.json assets/petro33_evolution.json
          git diff --cached --quiet && exit 0
          git commit -m 'Validar e materializar Petrobras 33 VC44'
          git push origin HEAD:$GITHUB_REF_NAME
