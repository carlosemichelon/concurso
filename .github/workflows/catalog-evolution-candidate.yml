name: Materializar incremento editorial candidato
on:
  push:
    branches: ['estudo/**']
    paths:
      - 'assets/catalog_evolution_request.json'
      - 'tools/catalog_apply_pending.cjs'
      - 'tools/catalog_evolution_batch.cjs'
      - '.github/workflows/catalog-evolution-candidate.yml'
permissions:
  contents: write
concurrency:
  group: evolution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materializar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registrar base anterior ao incremento
        run: echo "CATALOG_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: node tools/catalog_apply_pending.cjs
      - run: node tools/catalog_snapshot.cjs --check
      - name: Selecionar IDs alterados para o leitor
        id: reader
        run: node tests/catalog_reader_gate.cjs "$CATALOG_BASE" --plan >> "$GITHUB_OUTPUT"
      - if: steps.reader.outputs.count != '0'
        run: npm install --no-save playwright
      - if: steps.reader.outputs.count != '0'
        run: npx playwright install --with-deps chromium
      - if: steps.reader.outputs.count != '0'
        run: node tests/catalog_reader_gate.cjs "$CATALOG_BASE"
      - name: Atualizar e conferir índice derivado do mesmo snapshot
        run: node tools/catalog_lookup.cjs
      - name: Commit da versão candidata validada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          PACKET=$(node -p "require('./assets/catalog_evolution_request.json').packet")
          HOME_FILE=$(node -p "require('./assets/version.json').home")
          git add -- assets/version.json assets/catalog_snapshot_*.json assets/catalog_lookup "$PACKET" index.html "$HOME_FILE"
          git diff --cached --quiet && exit 0
          git commit -m 'Materializar catálogo de evoluções editoriais validado'
          git push origin HEAD:${GITHUB_REF_NAME}
