name: VS41 - leitura privada multiusuario
on:
  push:
    branches: ['feature/multiusuario-vs41-original']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/vs41_private_catalog.test.mjs
      - run: node tools/catalog_snapshot.cjs --check
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/vs41_private_browser.mjs
