name: VS41 - seleção de conta no site original
on:
  push:
    branches: ['feature/multiusuario-vs41-original']
permissions:
  contents: write
jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check infra/vs41-private/browser-account.mjs && node --check infra/vs41-private/browser-account-connection.js
      - run: node tools/vs41_build_original_account.mjs /tmp/bm-original-account
      - run: node --test tests/vs41_browser_drive.test.mjs tests/vs41_browser_account.test.mjs
      - run: |
          find /tmp/bm-original-account -name '*.js' -exec node --check {} +
          test -f /tmp/bm-original-account/index.html
      - run: npm install --no-save playwright pdfjs-dist@3.11.174
      - run: npx playwright install --with-deps chromium
      - run: node tests/vs41_original_account_browser.mjs /tmp/bm-original-account
      - uses: actions/upload-artifact@v4
        with:
          name: vs41-original-account
          path: /tmp/bm-original-account
          retention-days: 3
      - name: Preparar arquivos testados para o site oficial
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .vs41-release
          cp -a /tmp/bm-original-account/. .vs41-release/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .vs41-release/
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Arquivos do site original validados para publicação"
            git push origin HEAD:feature/multiusuario-vs41-original
          fi
