name: VS41 - leitura privada multiusuario
on:
  push:
    branches: ['feature/multiusuario-vs41-original']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/vs41_browser_drive.test.mjs tests/vs41_private_catalog.test.mjs tests/vs41_private_api.test.mjs tests/vs41_private_oauth.test.mjs tests/vs41_private_drive_smoke.test.mjs tests/vs41_private_srs.test.mjs tests/vs41_private_media.test.mjs tests/vs41_private_annotations.test.mjs tests/vs41_private_gaps.test.mjs tests/vs41_private_study.test.mjs tests/vs41_private_formulas.test.mjs tests/vs41_private_migration.test.mjs tests/vs41_private_accounts.test.mjs tests/vs41_private_chat_proposals.test.mjs tests/vs41_private_id_reservations.test.mjs
      - run: node tools/catalog_snapshot.cjs --check
      - run: node infra/vs41-private/migration.mjs
      - run: mkdir -p /tmp/bm-editorial-seed && node tools/vs41_editorial_seed.mjs /tmp/bm-editorial-seed/VC52_EDITORIAL_CANDIDATA.json
      - uses: actions/upload-artifact@v4
        with:
          name: vc52-editorial-candidate
          path: /tmp/bm-editorial-seed/VC52_EDITORIAL_CANDIDATA.json
          retention-days: 3
      - run: npm install --no-save playwright pdfjs-dist@3.11.174
      - run: npx playwright install --with-deps chromium
      - run: node tests/vs41_private_browser.mjs

      - run: node tests/vs41_oauth_browser.mjs

      - run: node tests/vs41_preview_accounts.mjs /tmp/bm-editorial-seed/VC52_EDITORIAL_CANDIDATA.json

      - run: node tests/vs41_real_catalog_layout.mjs /tmp/bm-editorial-seed/VC52_EDITORIAL_CANDIDATA.json

      - run: node tools/vs41_build_browser_portal.mjs

      - run: node tests/vs41_drive_original_reader.mjs /tmp/bm-editorial-seed/VC52_EDITORIAL_CANDIDATA.json

      - run: node tests/vs41_browser_to_original.mjs /tmp/bm-editorial-seed/VC52_EDITORIAL_CANDIDATA.json

  stage-preview:
    if: contains(github.event.head_commit.message, '[stage-preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar somente a prévia integral já testada
        run: |
          git diff --exit-code 3a06df0fc6b5ad76e595ccd3e9a07128b68226f0 HEAD -- . ':!.github/workflows/vs41-private-cards.yml'
          node tools/vs41_build_browser_portal.mjs
          git add -f preview-vs41-reader/portal/
          git diff --cached --name-only | grep -v '^preview-vs41-reader/portal/' && exit 1 || true
          test -f preview-vs41-reader/portal/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preparar arquivos da prévia integral VS41 já testada'
          git push origin HEAD:refs/heads/feature/multiusuario-vs41-original
