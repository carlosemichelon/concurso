name: Banco Mestre — relações normativas V121
on:
  push:
    branches:
      - gh-pages
      - feature/v121-lei-precisa-20261111
    paths:
      - 'assets/v121_relacoes_normativas.js'
      - 'assets/v114_cf_artigo1.js'
      - 'assets/v114_ia_lei_seca.js'
      - 'assets/v112_perfis_lei_seca.js'
      - 'tests/v121_relacoes_normativas.cjs'
      - 'tests/v121_integridade_portal.cjs'
      - 'v121.html'
      - 'assets/version.json'
      - 'index.html'
      - 'VERSAO_ATUAL.md'
      - 'assets/v121_calibrador_ui.js'
      - '.github/workflows/validar-relacoes-lei-v121.yml'
  pull_request:
    paths:
      - 'assets/v121_relacoes_normativas.js'
      - 'tests/v121_relacoes_normativas.cjs'
      - 'tests/v121_integridade_portal.cjs'
      - 'v121.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressão do classificador constitucional antigo
        run: node tests/v114_cf_ia.cjs
      - name: Artigos 2–4, relacionamentos e negações adversariais
        run: node tests/v121_relacoes_normativas.cjs
      - name: Conferir carregamento V121 e compatibilidade da V120
        run: node tests/v121_integridade_portal.cjs
