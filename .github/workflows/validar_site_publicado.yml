name: Banco Mestre - verificar publicação pública
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditoria-publica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir conteúdo publicado no GitHub Pages
        run: node tests/validar_site_publicado.cjs
