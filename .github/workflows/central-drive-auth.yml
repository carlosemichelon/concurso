name: Drive central — teste de login
on:
  push:
    branches: ['feature/portal-atual-dois-usuarios']
    paths: ['infra/central-drive/**', 'tests/central-drive-*.test.mjs', '.github/workflows/central-drive-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check infra/central-drive/login.js
          node --check infra/central-drive/original-session.js
          node --check infra/central-drive/original-core.js
          node --check infra/central-drive/original-reader.js
          node --check infra/central-drive/original-review.js
          node --check infra/central-drive/original-image-editor.js
          node --check infra/central-drive/original-pdf-editor.js
          node --check infra/central-drive/original-pdf-grifador.js
          node --check infra/central-drive/original-pdf-sync-core.js
          node --check infra/central-drive/original-calendar.js
          node --check infra/central-drive/original-study-app.js
          node --check infra/central-drive/original-study-native.js
          for f in tests/central-drive-*.test.mjs; do node --check "$f"; done
      - run: node --test tests/central-drive-*.test.mjs
