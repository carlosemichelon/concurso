name: Drive central — teste de login
on:
  push:
    branches: ['feature/portal-atual-dois-usuarios']
    paths: ['infra/central-drive/**', 'tests/central-drive-*.test.mjs', '.github/workflows/central-drive-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check infra/central-drive/login.js
          node --check infra/central-drive/original-session.js
          node --check infra/central-drive/original-core.js
          node --check infra/central-drive/original-reader.js
          node --check infra/central-drive/original-review.js
          for f in tests/central-drive-*.test.mjs; do node --check "$f"; done
      - run: node --test tests/central-drive-auth.test.mjs tests/central-drive-runtime.test.mjs tests/central-drive-media.test.mjs tests/central-drive-review.test.mjs tests/central-drive-discursive.test.mjs tests/central-drive-upload.test.mjs tests/central-drive-marks.test.mjs tests/central-drive-interface.test.mjs tests/central-drive-original.test.mjs tests/central-drive-original-reader.test.mjs
