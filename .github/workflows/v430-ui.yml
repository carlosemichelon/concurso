name: VS39 - interface e consulta de midias
on:
  push:
    branches: ['correcao/vs39-interface-media']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/v430_ui.test.cjs tests/v371_drive_changes.test.cjs
      - run: node tools/catalog_snapshot.cjs --check
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/v430_ui_browser.cjs && node tests/pdf_toolbar_current.cjs && node tests/v430_formula_browser.cjs && node tests/v430_delete_browser.cjs
