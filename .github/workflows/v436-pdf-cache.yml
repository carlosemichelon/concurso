name: VS45 - PDF de assunto e cache
on:
  push:
    branches: ['correcao/vs45-pdf-cache', 'gh-pages', 'correcao/vs57-interface-midia']
    paths: ['assets/bm-account/*v436*', 'infra/vs41-private/*v436*', 'tests/v436*', '.github/workflows/v436-pdf-cache.yml']
  pull_request:
    branches: [gh-pages]
    paths: ['assets/bm-account/*v436*', 'infra/vs41-private/*v436*', 'tests/v436*', 'tests/vs41_browser_account_fixture.mjs', '.github/workflows/v436-pdf-cache.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/bm-account/client-v436.js && node --check assets/bm-account/v436_js_002_015_topic_media.js && node --check assets/bm-account/connection-v436.js && node --check infra/vs41-private/browser-account-v436.mjs && node --check infra/vs41-private/browser-drive-v436.mjs && node --check infra/vs41-private/verified-cache-v436.mjs
      - run: node --test tests/v436_browser_account.test.mjs tests/v436_pdf_copy.test.mjs tests/vs41_browser_drive.test.mjs
      - run: node tools/catalog_snapshot.cjs --check
      - run: npm install --no-save playwright pdfjs-dist@3.11.174
      - run: npx playwright install --with-deps chromium
      - run: node tests/v436_topic_browser.cjs
      - run: node tests/v436_original_account_browser.mjs .
