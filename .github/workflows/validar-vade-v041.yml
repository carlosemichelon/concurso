name: Validar editor do Vade Mecum V041
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'v041.html'
      - 'assets/v041_vade.js'
      - 'assets/v041_vade.css'
      - 'tests/vade_integridade_v041.cjs'
      - 'tests/vade_browser_v041.cjs'
      - '.github/workflows/validar-vade-v041.yml'
  workflow_dispatch:
jobs:
  validar-pdf-e-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar bibliotecas de teste
        run: npm install --no-save --ignore-scripts --no-audit --no-fund pdfjs-dist@3.11.174 pdf-lib@1.17.1 playwright@1.55.1
      - name: Validar as 21 partes e round-trip de PDF
        run: node tests/vade_integridade_v041.cjs
      - name: Preparar navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Testar grifo, persistência e exportação no navegador
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/banco-mestre-http.log 2>&1 &
          sleep 2
          node tests/vade_browser_v041.cjs
