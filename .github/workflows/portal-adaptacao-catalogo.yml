name: Adaptação direta - catálogo original
on:
  workflow_dispatch:
  push:
    branches: ['feature/portal-atual-dois-usuarios']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/portal-multiaccount-storage-v001.test.mjs
      - run: node tests/portal-multiaccount-bootstrap-v001.test.mjs
      - run: node tests/portal-multiaccount-drive-v001.test.mjs
      - run: node tests/portal-original-catalog-v348.test.mjs
      - run: node tests/portal-multiaccount-srs-v001.test.mjs
      - run: node --check assets/v326_js_076_087.js && node --check assets/v316_srs_journal.js
      - run: node tests/portal-multiaccount-review-events-v001.test.mjs
      - run: node tests/portal-multiaccount-discursive-v001.test.mjs
      - run: node tests/portal-multiaccount-pdf-v001.test.mjs
      - run: node --check assets/v326_js_002_015.js && node --check assets/v315_js_028_039.js && node --check assets/v326_js_040_051.js && node --check assets/v326_js_052_063.js
