<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petrobras 28 — Banco Mestre</title><style>body{margin:auto;max-width:960px;padding:24px;font:16px/1.55 system-ui;color:#243549;background:#f7fafc}h1,h2{color:#173c68}article{background:white;border:1px solid #d4dfe8;border-radius:12px;padding:18px;margin:12px 0}button{font:inherit;padding:9px 13px;border:1px solid #28748e;border-radius:8px;background:#edf8fa;color:#143f59;cursor:pointer}p{white-space:pre-line}small{color:#50647c}mark{background:#fde68a;color:#26374b}details{margin-top:12px}summary{cursor:pointer}a{color:#175b8b}</style></head><body><a href="index.html">← Banco Mestre</a><h1>Petrobras 28</h1><p>Cartões autorizados, evoluções aditivas e propostas. O gabarito fica oculto até a tentativa. Originais privados e SRS não são publicados aqui.</p><main id="root">Carregando…</main><script>
fetch('assets/petro28_sync_v344.json?v=344-1').then(r=>{if(!r.ok)throw Error('Falha ao carregar');return r.json()}).then(d=>{
const root=document.getElementById('root');root.replaceChildren();
const el=(t,x)=>{const e=document.createElement(t);if(x!==undefined)e.textContent=x;return e;};
for(const [heading,items] of [['Cartões autorizados e ativos no catálogo público',Object.values(d.approved)],['Evoluções de cartões existentes',Object.values(d.profiles)],['Propostas — não ativadas',Object.values(d.proposals)]]){
root.append(el('h2',heading));
for(const p of items){let a=el('article');a.append(el('small',p.id),el('h3',p.title),el('p',p.front));let button=el('button','Revelar resposta'),body=el('div');body.hidden=true;
body.append(el('p',p.back),el('small',p.source));if(p.related_card_ids.length)body.append(el('p','Relacionados: '+p.related_card_ids.join(' · ')));
let fold=el('details');fold.append(el('summary','Onze módulos didáticos'));for(const m of p.layers){fold.append(el('h4',m.ord+'. '+m.titulo),el('p',m.texto));}body.append(fold);
button.onclick=()=>{body.hidden=!body.hidden;button.textContent=body.hidden?'Revelar resposta':'Ocultar resposta';if(body.hidden)fold.open=false;};a.append(button,body);root.append(a);}
}
}).catch(e=>document.getElementById('root').textContent=e.message);
</script></body></html>
