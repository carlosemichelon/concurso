<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco Mestre · Abrindo versão online atualizada</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<style>body{font:16px/1.6 system-ui,Arial,sans-serif;background:#f3f7f6;color:#183438;margin:0;padding:8vh 5vw;max-width:700px}a{color:#006e68;font-weight:700}small{display:block;margin-top:14px;color:#526b6f}</style>
</head><body><h1>Banco Mestre</h1><p id="st">Verificando a edição mais recente do portal...</p>
<p><a id="entrar" href="./v084.html?versao=V084">Abrir Banco Mestre V084</a></p>
<small>Este endereço verifica qual versão publicar. Caso não redirecione, clique em Abrir Banco Mestre.</small>
<script>
(function(){
 var fallback='V084';
 function go(version){if(!/^V[0-9]{3}$/.test(version))version=fallback;var link='v'+version.slice(1)+'.html?versao='+version+'&nova='+Date.now()+location.hash;document.getElementById('entrar').href=link;location.replace(new URL(link,location.href).href);}
 fetch('./assets/version.json?verificar='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Manifesto indisponível');return r.json()}).then(function(v){go(v.version)}).catch(function(){document.getElementById('st').textContent='Não foi possível verificar a atualização. Acesse diretamente a versão V084 pelo link abaixo.';document.getElementById('entrar').href='./v084.html?versao=V084&nova='+Date.now()+location.hash;});
})();
</script></body></html>
