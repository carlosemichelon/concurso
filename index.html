<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco Mestre — Portal público V010</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f7f7;color:#192b32;min-height:70vh;display:grid;place-items:center;margin:0;padding:24px}.loader{max-width:600px;padding:32px;background:#fff;border:1px solid #d4dddd;border-radius:16px;box-shadow:0 5px 30px #0001}h1{font-size:24px}.sub{color:#637175}a{color:#174b54}</style>
</head><body><main class="loader"><h1>Banco Mestre — Portal V010</h1><p id="status">Carregando biblioteca de estudos, flashcards e imagens...</p><p class="sub">Versão pública: sem acesso aos arquivos privados do Drive nem ao manuscrito.</p><noscript>Ative o JavaScript para consultar o portal.</noscript></main>
<script>
(async()=>{
  const files=Array.from({length:18},(_,i)=>"assets/part-"+String(i+1).padStart(3,"0")+".txt");
  const html=(await Promise.all(files.map(async(name)=>{
    const response=await fetch(name,{cache:"no-store"});
    if(!response.ok) throw new Error("Falha ao carregar "+name+": HTTP "+response.status);
    return await response.text();
  }))).join("");
  if(html.length!==10498493 || !html.includes('<script id="data"') || !html.includes('</body></html>'))throw new Error("Conteúdo do portal incompleto; não foi aberto.");
  document.open();document.write(html);document.close();
})().catch(err=>{
  document.getElementById("status").textContent="Não foi possível carregar o portal: "+err.message;
});
</script></body></html>
