<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco Mestre · Abrindo versão online atualizada</title>
<meta http-equiv="Cache-Control" content="no-store"><meta http-equiv="Pragma" content="no-cache">
<style>body{font:16px/1.6 system-ui,Arial,sans-serif;background:#f3f7f6;color:#183438;margin:0;padding:8vh 5vw;max-width:700px}a{color:#006e68;font-weight:700}</style>
</head><body><h1>Banco Mestre</h1><p id="st">Verificando a edição mais recente do portal...</p>
<p><a id="entrar" href="./v314.html?versao=V314">Abrir Banco Mestre V314</a></p>
<small>O endereço verifica o manifesto da versão ativa e preserva o cartão solicitado.</small>
<script>
(function(){
 'use strict';
 const fallback={version:'V314',home:'v314.html'};
 const cardParam=()=>{
  const x=new URLSearchParams(location.search).get('cartao');
  return x&&/^(?:CARD-\d{4,}|PROP-IJUI-\d+|IJUI-[A-Z0-9_-]+|TRT\d{2}-C\d{3})$/i.test(x)?x:'';
 };
 const go=(data)=>{
  const version=/^V\d{3}$/.test(data&&data.version||'')?data.version:fallback.version;
  const expected='v'+version.slice(1)+'.html';
  const home=data&&data.home===expected?data.home:expected;
  const dest=new URL('./'+home,location.href);
  dest.searchParams.set('versao',version);
  dest.searchParams.set('nova',version+'-portal');
  const id=cardParam();if(id)dest.searchParams.set('cartao',id);
  dest.hash=location.hash;
  const link=document.getElementById('entrar');
  link.href=dest.href;link.textContent='Abrir Banco Mestre '+version;
  location.replace(dest.href);
 };
 fetch('./assets/version.json',{cache:'no-store'}).then(r=>{
  if(!r.ok)throw Error('Manifesto indisponível: HTTP '+r.status);return r.json();
 }).then(manifest=>{
  if(!manifest||!/^V\d{3}$/.test(manifest.version)||manifest.home!=='v'+manifest.version.slice(1)+'.html')
   throw Error('Manifesto de versão inconsistente');
  go(manifest);
 }).catch(e=>{
  document.getElementById('st').textContent='Não foi possível consultar o manifesto ('+e.message+'). A versão V314 permanece disponível diretamente.';
  const dest=new URL('./v314.html?versao=V314&nova=V314-fallback',location.href);
  const id=cardParam();if(id)dest.searchParams.set('cartao',id);dest.hash=location.hash;
  const link=document.getElementById('entrar');link.href=dest.href;link.textContent='Abrir Banco Mestre V314';
 });
})();
</script>
</body></html>
