<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petrobras 24 — Banco Mestre</title><style>body{max-width:960px;margin:auto;padding:20px;font:16px/1.6 system-ui;color:#23354a}article{border:1px solid #d5dce4;padding:16px;margin:12px 0;border-radius:10px}button{font:inherit;border:1px solid #345e80;background:#eff7ff;border-radius:6px;padding:8px 12px;cursor:pointer}details{margin:10px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #d5dce4;padding:8px;text-align:left}th{background:#e4eef5}p{white-space:pre-wrap}summary{cursor:pointer}</style></head><body><a href="index.html">← Banco Mestre</a><h1>Petrobras 24 — Fundações</h1><p>19 cartões novos e 19 aprimoramentos. O gabarito fica recolhido. Imagens originais e agenda são mantidas no Drive privado.</p><main id="root">Carregando…</main><script>const el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n};function rich(box,value){const a=String(value).split('\n');for(let i=0;i<a.length;){if(a[i].trim().startsWith('|')&&i+1<a.length&&/^\s*\|[\s:|\-]+\|\s*$/.test(a[i+1])){const table=el('table'),wrap=el('div');wrap.style.overflowX='auto';const cells=t=>t.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim().replaceAll('**',''));const hr=el('tr'),head=el('thead');for(const x of cells(a[i]))hr.append(el('th',x));head.append(hr);table.append(head);i+=2;const tb=el('tbody');while(i<a.length&&a[i].trim().startsWith('|')){const row=el('tr');for(const x of cells(a[i++]))row.append(el('td',x));tb.append(row)}table.append(tb);wrap.append(table);box.append(wrap);continue}const t=a[i++].trim();if(t)box.append(el('p',t.replaceAll('**','')))}}fetch('assets/petro24_regularizacao_v346.json').then(r=>{if(!r.ok)throw Error('Falha ao carregar');return r.json()}).then(d=>{const root=document.getElementById('root');root.replaceChildren();for(const p of Object.values(d.profiles)){const a=el('article');a.append(el('small',p.id),el('h3',p.title),el('p',p.front));const btn=el('button','Revelar resposta'),body=el('div');body.hidden=true;rich(body,p.back);const det=el('details');det.append(el('summary','11 módulos didáticos'));for(const m of p.layers){det.append(el('h4',m.ord+'. '+m.titulo));rich(det,m.texto)}body.append(det,el('p','Relacionados: '+p.related_card_ids.join(' · ')));btn.onclick=()=>{body.hidden=!body.hidden;btn.textContent=body.hidden?'Revelar resposta':'Ocultar resposta';if(body.hidden)det.open=false};a.append(btn,body);root.append(a)}const h=el('h2','Evoluções dos cartões existentes');root.append(h);for(const u of d.existing_updates){const det=el('details');det.append(el('summary',u.id),el('p',u.note));root.append(det)}}).catch(e=>document.getElementById('root').textContent=e.message);</script></body></html>
