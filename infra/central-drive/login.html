<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banco Mestre — Entrar</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#f5f7f7;--paper:#fff;--ink:#17353b;--sub:#597078;--accent:#16616a;--line:#d7e2e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Arial,sans-serif}header{background:white;border-bottom:1px solid var(--line)}.head{max-width:1180px;margin:auto;padding:13px 18px;font-size:21px;font-weight:850}main{max-width:470px;margin:35px auto;padding:0 18px}.panel{border:1px solid var(--line);border-radius:13px;background:white;padding:22px}h1{font-size:24px;margin:0 0 8px}p{color:var(--sub)}label{display:block;margin:12px 0 4px;font-weight:650}input,button{font:inherit;width:100%;border:1px solid #bbcfcc;border-radius:9px;padding:10px 12px}button{margin-top:16px;background:var(--accent);color:white;cursor:pointer}button:disabled{opacity:.6}dl{display:grid;grid-template-columns:1fr auto;gap:6px}dd{margin:0;font-weight:700}[hidden]{display:none!important}</style><script src="/login.js" defer></script></head><body><header><div class="head">Banco Mestre</div></header><main><div class="panel"><h1>Entrar no seu ambiente de estudos</h1><p>Use seu usuário e senha. O Google Drive é administrado pelo responsável pelo Banco Mestre.</p><form id="form"><label for="user">Usuário</label><input id="user" autocomplete="username" required maxlength="160"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="enter">Entrar</button></form><p id="status" role="status" aria-live="polite"></p><div id="result"></div><button id="logout" hidden>Sair</button><p><small>Ambiente de homologação: valida o perfil privado. O portal completo continua bloqueado até os testes dos módulos.</small></p></div></main></body></html>
